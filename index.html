e paper by Yahya Alshawabkeh and Ahmad Baik, published in Sustainability, covers two tombs in the Hegra necropolis in Saudi Arabia and Al-Deir at Petra. Tomb IGN 110 was scanned from 29 stations, four of them inside, yielding more than 403 million points at an average resolution of 6 mm, and tomb IGN 22 from seven stations with about 77 million points. Scans were registered in ReCap Pro, images processed in Metashape, and the sources fused in CloudCompare with a registration residual of 0.18 mm for one tomb. The model was built in Revit as a central model with thematic worksets that link condition, historical and geological data to each element. Decorative motifs such as an eagle, sphinx, serpent and Medusa were kept as a library of mesh-based families next to parametric elements. The authors list limitations: the motifs are not editable, the workflow depends on proprietary software, IFC and CIDOC CRM were not tested, and the data are not open. It is a case study very close to Nabataean sites in Israel such as Avdat, Mamshit and Shivta, and it also shows what is still missing for an open, shareable model.", "speech_he": "מסגרת HBIM לקברים הנבטיים בחגרא ובפטרה. חוקרים מירדן ומסעודיה פרסמו מאמר בכתב העת Sustainability. הם תיעדו שני קברים בנקרופוליס של חגרא, ואת המבנה א-דיר בפטרה. קבר אחד נסרק בעשרים ותשע עמדות, עם יותר מארבע מאות מיליון נקודות. הסריקות שולבו עם צילום פוטוגרמטרי, ברזולוציה של כשישה מילימטר. המודל נבנה בתוכנה Revit, ומקשר נתוני מצב, היסטוריה וגיאולוגיה לכל אלמנט. העיטורים, כמו נשר, ספינקס ומדוזה, נשמרו כספרייה של מודלים תלת ממדיים. המחברים מציינים מגבלות. המוטיבים אינם ניתנים לעריכה, והנתונים אינם פתוחים. זה מקרה בוחן קרוב מאוד לאתרים הנבטיים בנגב, כמו עבדת, ממשית ושבטה.", "speech_en": "An HBIM framework for Nabataean tombs at Hegra and Petra. Researchers from Jordan and Saudi Arabia published the paper in the journal Sustainability. They documented two tombs in the Hegra necropolis and the Al-Deir monument in Petra. One tomb was scanned from 29 stations, with more than 400 million points. The scans were combined with photogrammetry at about six millimetre resolution. The model was built in Revit and links condition, history and geology data to each element. Decorative motifs such as an eagle, a sphinx and Medusa were kept as a library of 3D meshes. The authors note limits. The motifs cannot be edited, and the data are not open. It is a close case study for Nabataean sites in the Negev, such as Avdat, Mamshit and Shivta.", "url": "https://www.mdpi.com/2071-1050/18/20/10533", "sourceName": "MDPI Sustainability", "relevance": 5, "heritage": true, "discovery": false, "isUpdate": false, "people": ["Yahya Alshawabkeh", "Ahmad Baik"], "published": "2026-10-16", "readTime": "45 דק׳"}, {"id": "2026-10-24-nyu-fragmented-legacy", "date": "2026-10-24", "kind": "news", "topicId": "research", "title": "Fragmented Legacy: פרויקט של NYU ו-Tübingen ללימוד AI להרכיב ממצאים שבורים מסריקות תלת-ממדיות", "summary": "פרויקט לשלוש שנים במימון Schmidt Sciences יבנה מאגר של לפחות 100,000 אובייקטים שבורים, אמיתיים ומדומים, ומודל שמציע איפה כל שבר שייך ואיך נראה הכלי השלם. הנתונים והמודלים ישוחררו ברישיון פתוח.", "title_en": "Fragmented Legacy: an NYU and Tübingen project teaching AI to reassemble broken finds from 3D scans", "summary_en": "A three-year project funded by Schmidt Sciences will build a dataset of at least 100,000 broken objects, real and simulated, and a model that suggests where each fragment belongs and what the whole object looked like. Data and models will be released under open licenses.", "details": "הפרויקט Fragmented Legacy מובל על ידי Chen Feng מ-NYU Tandon, יחד עם המחלקה לאנתרופולוגיה של NYU ואוניברסיטת Tübingen, ובשיתוף Leiden, Arizona State ו-Max Planck. המערכת אמורה לזהות היכן כל שבר של כלי אבן, חרס או עצם מתאים, ולהציע גרסה סבירה של האובייקט השלם תוך פסילת שחזורים לא סבירים לפי ידע ארכאולוגי. הארכאולוג משווה בין שחזורים חלופיים ומכוון את המערכת. המאגר יכלול לפחות 100,000 אובייקטים, עם מודלים תלת-ממדיים, תמונות ונתוני קטלוג, ושברים מדומים שמחקים את אופן השבירה של אבן, חרס ועצם. לפי הכתבה, שיעורי ההצלחה הנוכחיים בהרכבה נמוכים מאוד, כאחוז אחד בקרמיקה. זה פרויקט בתחילתו ואין עדיין כלי לשימוש, אבל המאגר והמודלים הפתוחים עשויים להיות שימושיים למחסני ממצאים ולמעבדות שימור.", "details_en": "Fragmented Legacy is led by Chen Feng of NYU Tandon, with NYU's anthropology department and the University of Tübingen, and partners at Leiden, Arizona State and the Max Planck Institute. The system aims to find where each fragment of stone, pottery or bone fits, and to propose a plausible complete object while ruling out unlikely reconstructions using archaeological knowledge. The archaeologist compares alternative reconstructions and guides the system. The dataset will hold at least 100,000 objects with 3D models, photos and catalog data, plus simulated breaks that mimic how stone, clay and bone fracture. According to the article, current refitting success rates are very low, about one percent for ceramics. The project is just starting and there is no usable tool yet, but the open dataset and models could be useful for finds stores and conservation labs.", "speech_he": "הפרויקט Fragmented Legacy ילמד בינה מלאכותית להרכיב ממצאים שבורים. את הפרויקט מובילים חוקרים מאוניברסיטת NYU ומאוניברסיטת Tübingen. המימון הוא לשלוש שנים, מהקרן Schmidt Sciences. המערכת תציע איפה כל שבר מתאים, ואיך נראה הכלי השלם. הארכאולוג ישווה בין שחזורים שונים ויכוון את המערכת. החוקרים יבנו מאגר של לפחות מאה אלף אובייקטים שבורים. המאגר יכלול מודלים תלת ממדיים, תמונות ונתוני קטלוג. היום שיעור ההצלחה בהרכבת חרסים נמוך מאוד, כאחוז אחד. הנתונים והמודלים ישוחררו בקוד פתוח.", "speech_en": "The Fragmented Legacy project will teach AI to reassemble broken finds. It is led by researchers from NYU and the University of Tübingen. It is funded for three years by Schmidt Sciences. The system will suggest where each fragment fits and what the whole object looked like. The archaeologist will compare reconstructions and guide the system. The team will build a dataset of at least 100,000 broken objects. It will include 3D models, photos and catalog data. Today the success rate for refitting pottery is very low, about one percent. The data and models will be released as open source.", "url": "https://www.archaeology.wiki/blog/2026/10/16/ai-to-piece-together-broken-archaeological-finds/", "sourceName": "Archaeology Wiki", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Chen Feng", "Radu Iovita"], "published": "2026-10-16", "readTime": "4 דק׳"}, {"id": "2026-10-24-origins-eu-inclusive-xr", "date": "2026-10-24", "kind": "news", "topicId": "heritage", "title": "ORIGINS: פרויקט Horizon חדש של 5 מיליון אירו למרחבי XR מכילים, עם מורשת תרבות כמקרה בוחן", "summary": "פרויקט אירופי בהובלת i2CAT מברצלונה, שהחל באוגוסט 2026, יפתח הולופורטציה משופרת ב-AI, ממשק רב-חושי נגיש ועולמות נרטיביים גנרטיביים, ויבחן אותם במורשת, תיירות וירטואלית, חינוך ושיקום. כדאי לעקוב כמקור לכלים ולמדדי נגישות ל-XR.", "title_en": "ORIGINS: a new €5 million Horizon project for inclusive XR spaces, with cultural heritage as a test case", "summary_en": "An EU project led by i2CAT in Barcelona, which started in August 2026, will develop AI-enhanced holoportation, accessible multimodal interaction and generative narrative worlds, and test them in heritage, virtual tourism, education and rehabilitation. Worth following as a source of XR tools and accessibility metrics.", "details": "הפרויקט ORIGINS הוא פעולת חדשנות במסגרת Horizon Europe, עם תקציב כולל של כ-4.99 מיליון אירו, מתוכם כ-4.34 מיליון אירו מימון אירופי. הוא החל ב-1 באוגוסט 2026 ויסתיים ב-31 ביולי 2029, ומרכז אותו המכון i2CAT מברצלונה עם תשעה שותפים. הפרויקט מתמקד בשלושה אתגרים: הולופורטציה, כלומר העברת אדם בתלת-ממד בזמן אמת, שמשופרת ב-AI ושומרת על הבעות פנים, מחוות ומבט; אינטראקציה רב-חושית מכילה שמשלבת דיבור, מחוות, מבט, תרגום וממשקים נגישים; ועולמות נרטיביים גנרטיביים עם אווטארים מסתגלים. מורשת תרבות היא אחד מארבעה מקרי בוחן, לצד הדרכה, תיירות וירטואלית ובריאות. הפרויקט מצהיר שיעריך את הטכנולוגיות במדדי נגישות כדי שיתאימו לבעלי יכולות ושפות שונות. עמוד CORDIS עדיין לא מפרט אתרי מורשת, תוצרים או לוחות זמנים לפיילוטים. הפרויקט רלוונטי כמקור עתידי לשיטות מדידה של נגישות ב-XR ולשאלה איך משלבים תרגום ודיבור בחוויות מורשת.", "details_en": "ORIGINS is a Horizon Europe innovation action with a total budget of about €4.99 million, of which about €4.34 million is EU funding. It started on August 1, 2026 and ends on July 31, 2029, and is coordinated by i2CAT in Barcelona with nine participants. The project tackles three challenges: AI-enhanced holoportation, meaning real-time 3D transmission of a person that preserves facial dynamics, gesture and gaze; inclusive multimodal interaction combining speech, gesture, gaze, translation and accessible interfaces; and generative narrative worlds with adaptive avatars. Cultural heritage is one of four use cases, alongside training, virtual tourism and health. The project says it will assess its technologies with accessibility metrics so they work across abilities and languages. The CORDIS page does not yet list heritage sites, deliverables or pilot timelines. It is relevant as a future source of XR accessibility measurement methods and of ways to combine translation and speech in heritage experiences.", "speech_he": "הפרויקט ORIGINS הוא פרויקט אירופי חדש למרחבי מציאות מעורבת מכילים. התקציב הכולל הוא כחמישה מיליון אירו. הפרויקט החל באוגוסט 2026 ויימשך שלוש שנים. את הפרויקט מוביל המכון i2CAT מברצלונה, עם תשעה שותפים. הפרויקט יפתח העברה תלת ממדית של אנשים בזמן אמת, בעזרת בינה מלאכותית. הוא יפתח גם ממשק שמשלב דיבור, מחוות, מבט ותרגום, בצורה נגישה. מורשת תרבות היא אחד מארבעה מקרי בוחן, לצד תיירות וירטואלית, חינוך ובריאות. הפרויקט מתחייב למדוד את הטכנולוגיות במדדי נגישות. עדיין לא פורסמו אתרי מורשת או תוצרים. כדאי לעקוב אחריו כמקור לשיטות מדידה של הַנְגָּשָׁה.", "speech_en": "ORIGINS is a new European project for inclusive mixed reality spaces. Its total budget is about five million euros. It started in August 2026 and will run for three years. It is led by i2CAT in Barcelona, with nine partners. The project will develop real-time 3D transmission of people, enhanced by AI. It will also develop an interface that combines speech, gesture, gaze and translation in an accessible way. Cultural heritage is one of four test cases, alongside virtual tourism, education and health. The project commits to measuring its technologies with accessibility metrics. No heritage sites or results have been published yet. It is worth following as a source of accessibility measurement methods.", "url": "https://cordis.europa.eu/project/id/101298582", "sourceName": "CORDIS", "relevance": 3, "heritage": true, "discovery": true, "isUpdate": false, "people": [], "published": "2026-08-01", "readTime": "3 דק׳"}, {"id": "2026-10-24-p-xrai-multiset-vps", "date": "2026-10-24", "kind": "media", "topicId": "webxr", "title": "XR AI Spotlight: מיקום חזותי כשכבה החסרה, ואיך סריקה אחת מייצרת גם splat לאנשים וגם מפה למכונות", "summary": "שיחה עם מנכ״ל Multiset AI על מיקום חזותי שנותן למקום מערכת קואורדינטות משותפת לטלפונים, משקפיים ורחפנים. רלוונטי ישירות ל-AR מבוסס מיקום באתרי מורשת, שבהם GPS לבדו לא מספיק לעיגון מדויק.", "title_en": "XR AI Spotlight: visual positioning as the missing layer, and how one walkthrough yields a splat for people and a map for machines", "summary_en": "A conversation with Multiset AI's CEO on visual positioning that gives a place a shared coordinate system for phones, headsets and drones. Directly relevant to location-based AR at heritage sites, where GPS alone is not precise enough for anchoring.", "details": "הפרק עלה ב-7 באוקטובר 2026 בפודקאסט XR AI Spotlight, והאורח הוא Shadnam Khan, מייסד שותף ומנכ״ל Multiset AI. השיחה עוסקת במיקום חזותי, כלומר זיהוי מיקום וכיוון המכשיר לפי מה שהמצלמה רואה, כדרך לתת למרחב פיזי מערכת קואורדינטות משותפת לטלפונים, משקפיים, רחפנים ורובוטים. Khan מסביר למה מפות רבות נכשלות בגלל תוכנית הצילום ולא בגלל הסורק, ולמה מפה יפה יותר לא בהכרח מאפשרת מיקום טוב יותר. נידון גם איך הליכה אחת במקום יכולה להפיק גם מודל Gaussian splat לצפייה של אנשים וגם מפה שמכונות מתמקמות לפיה. הפרק מתאר גם את המגבלות של מיקום חזותי ואת היתרונות והחסרונות של פורמטי צילום שונים. משך הפרק לא צוין בעמוד. הנושא קריטי לחוויות AR באתרי מורשת, שבהן סטייה של כמה מטרים ב-GPS הופכת שחזור על קיר או חזית לבלתי שמיש.", "details_en": "The episode was released on October 7, 2026 on the XR AI Spotlight podcast, with guest Shadnam Khan, co-founder and CEO of Multiset AI. It covers visual positioning, meaning working out a device's position and orientation from what its camera sees, as a way to give a physical space a shared coordinate system for phones, headsets, drones and robots. Khan explains why many maps fail because of the capture plan rather than the scanner, and why a better-looking map does not necessarily localise better. The episode also discusses how a single walkthrough can produce both a Gaussian splat for people to view and a map machines localise against. It also covers the limits of visual positioning and the trade-offs of different capture formats. The episode length is not stated on the page. The topic is critical for AR at heritage sites, where a GPS error of a few metres makes an overlay on a wall or facade unusable.", "speech_he": "פרק בפודקאסט XR AI Spotlight, מ-7 באוקטובר 2026. האורח הוא Shadnam Khan, מנכ״ל החברה Multiset AI. השיחה עוסקת במיקום חזותי, כלומר זיהוי המיקום של המכשיר לפי מה שהמצלמה רואה. כך מקום פיזי מקבל מערכת קואורדינטות משותפת לטלפונים, למשקפיים ולרַחְפָנִים. לדבריו, מפות רבות נכשלות בגלל תוכנית הצילום ולא בגלל הסורק. מפה יפה יותר לא בהכרח מאפשרת מיקום טוב יותר. הליכה אחת במקום יכולה להפיק גם מודל צפייה לאנשים וגם מפת התמצאות למכונות. הנושא קריטי למציאות רבודה באתרי מורשת. שם סטייה של כמה מטרים במיקום הופכת שחזור על קיר לבלתי שמיש.", "speech_en": "An episode of the XR AI Spotlight podcast, from October 7, 2026. The guest is Shadnam Khan, CEO of Multiset AI. The conversation is about visual positioning, meaning locating a device from what its camera sees. This gives a physical place a shared coordinate system for phones, glasses and drones. He says many maps fail because of the capture plan, not the scanner. A better looking map does not necessarily localise better. One walkthrough can produce both a viewing model for people and a positioning map for machines. The topic is critical for augmented reality at heritage sites. There, an error of a few metres makes an overlay on a wall unusable.", "listenUrl": "https://d3ctxlq1ktw2nl.cloudfront.net/staging/2026-9-3/433218118-44100-2-a1129d70e24ec.mp3", "url": "https://www.xraispotlight.com/the-missing-layer-for-physical-ai/", "sourceName": "XR AI Spotlight (podcast)", "relevance": 4, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Shadnam Khan"], "published": "2026-10-07", "mediaType": "podcast", "duration": "משך לא צוין"}, {"id": "2026-10-24-p-xrai-treeview-enterprise", "date": "2026-10-24", "kind": "media", "topicId": "hardware", "title": "XR AI Spotlight: מה עובד ב-XR ארגוני ב-2026, עם מנכ״ל Treeview", "summary": "שיחה עם מייסד הסטודיו Treeview על עשור של שינויים בחומרה ובפלטפורמות, על יישומי XR ארגוניים שתופסים, על splats ב-Meta Quest ועל המעבר למשקפיים חכמים. מבט מעשי על מה ששורד מעבר לתצוגות.", "title_en": "XR AI Spotlight: what is working in enterprise XR in 2026, with Treeview's CEO", "summary_en": "A conversation with the founder of studio Treeview on a decade of shifting hardware and platforms, enterprise XR apps that are gaining traction, splats on Meta Quest and the move to smart glasses. A practical look at what survives beyond demos.", "details": "הפרק עלה ב-21 באוקטובר 2026 בפודקאסט XR AI Spotlight, והאורח הוא Horacio Torrendell, מייסד ומנכ״ל הסטודיו Treeview שמפתח יישומי XR לארגונים. השיחה סוקרת היכן עומד מחשוב מרחבי אחרי עשור של חילופי חומרה, פלטפורמות וציפיות, ואילו יישומים ארגוניים באמת תופסים. Torrendell מתאר איך הסטודיו שרד את העליות והמורדות של התחום. נידונות גם זרימות עבודה של Gaussian Splatting ב-Meta Quest, והעתיד של כלים ארגוניים אחרי HoloLens, מקומו של Apple Vision Pro בארגונים והמיקוד של Treeview במשקפיים חכמים. בחודשים האחרונים Treeview גם שיתפה פעולה בפיתוח יישומים למשקפי XREAL Aura. משך הפרק לא צוין בעמוד. השיחה עוזרת להבין אילו פלטפורמות כדאי לבחור לפרויקט הנגשה שצריך לחיות כמה שנים.", "details_en": "The episode was released on October 21, 2026 on the XR AI Spotlight podcast, with guest Horacio Torrendell, founder and CEO of Treeview, a studio that builds enterprise XR apps. It reviews where spatial computing stands after a decade of changing hardware, platforms and expectations, and which enterprise applications are really gaining traction. Torrendell describes how the studio weathered the field's ups and downs. It also discusses Gaussian splatting workflows on Meta Quest, and the future of enterprise tools after HoloLens, Apple Vision Pro's position in enterprise and Treeview's focus on smart glasses. In recent months Treeview has also partnered on apps for XREAL Aura glasses. The episode length is not stated on the page. The conversation helps in choosing platforms for an accessibility project that needs to last several years.", "speech_he": "פרק בפודקאסט XR AI Spotlight, מ-21 באוקטובר 2026. האורח הוא Horacio Torrendell, מנכ״ל הסטודיו Treeview. הסטודיו מפתח יישומי מציאות מעורבת לארגונים. השיחה סוקרת עשור של שינויים בחומרה ובפלטפורמות, ואילו יישומים באמת תופסים. נידונות גם זרימות עבודה עם Gaussian Splatting במשקפי Meta Quest. הוא מדבר גם על העתיד אחרי HoloLens, ועל המעבר של הסטודיו למשקפיים חכמים. השיחה עוזרת לבחור פלטפורמה לפרויקט הַנְגָּשָׁה שצריך לחיות כמה שנים.", "speech_en": "An episode of the XR AI Spotlight podcast, from October 21, 2026. The guest is Horacio Torrendell, CEO of the studio Treeview. The studio builds mixed reality apps for businesses. The conversation reviews a decade of changes in hardware and platforms, and which apps really catch on. It also covers Gaussian splatting workflows on Meta Quest. He talks about the future after HoloLens, and the studio's move to smart glasses. The conversation helps in choosing a platform for an accessibility project that needs to last several years.", "listenUrl": "https://anchor.fm/s/edd12700/podcast/play/126605782/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fstaging%2F2026-9-1%2F433057022-44100-2-c8d08e804197.mp3", "url": "https://www.xraispotlight.com/enterprise-xr-in-2026-whats-working/", "sourceName": "XR AI Spotlight (podcast)", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Horacio Torrendell"], "published": "2026-10-21", "mediaType": "podcast", "duration": "משך לא צוין"}, {"id": "2026-10-24-pypottery-ai-drawings", "date": "2026-10-24", "kind": "news", "topicId": "research", "title": "PyPottery: חבילת AI פתוחה שהופכת שרטוטי חרסים בעיפרון לשרטוטים וקטוריים ולוחות פרסום", "summary": "מאמר מ-1.10 מציג ארבעה מודולים פתוחים שמחלצים שרטוטים מדפים סרוקים, מדיו אותם, ממירים לווקטור ומסדרים לוחות פרסום. בבדיקה על 240 שרטוטים דווחה האצה חציונית של פי 40 בתחושת המשתמשים. דוגמה מעשית לעדיפות של הפקת שרטוט וקטורי בעזרת AI.", "title_en": "PyPottery: an open-source AI suite that turns pencil pottery drawings into vector drawings and publication plates", "summary_en": "A paper from October 1 presents four open modules that extract drawings from scanned sheets, ink them, vectorize them and lay out publication plates. In a test on 240 drawings, users reported a median perceived speedup of 40 times. A practical example of AI-assisted vector drawing production.", "details": "Lorenzo Cardarelli מציג את PyPottery כחבילה שמכסה את כל שרשרת התיעוד הגרפי של קרמיקה ארכאולוגית. המודול PyPotteryScan מחלץ את השרטוטים מגיליונות סרוקים ומזהה כתב יד, PyPotteryInk מדיו שרטוטי עיפרון באופן אוטומטי, PyPotteryTrace ממיר לווקטור תוך הבנה של חלקי השרטוט, ו-PyPotteryLayout מסדר לוחות לפרסום. ההערכה נעשתה על 50 גיליונות עם 240 שרטוטים מאתר Terramara di Montale באיטליה. המשתתפים דיווחו על האצה חציונית של פי 40, בטווח שבין פי 17.5 לפי 120, אבל אלה הערכות של המשתמשים ולא מדידת זמן ישירה. הכלי מתאים כרגע לשרטוטי כלים ולא לשרטוטי מבנים או חתכים מתוך סריקות. עם זאת, הרעיון של וקטוריזציה שמבינה את סוגי הקווים ושל הפקת לוח מוכן לפרסום רלוונטי לכל מחלקת תיעוד שמייצרת שרטוטים בהיקף גדול.", "details_en": "Lorenzo Cardarelli presents PyPottery as a suite covering the whole graphic documentation chain for archaeological ceramics. PyPotteryScan extracts drawings from scanned sheets and recognizes handwriting, PyPotteryInk automatically inks pencil drawings, PyPotteryTrace performs semantically aware vectorization, and PyPotteryLayout lays out publication plates. The evaluation used 50 sheets with 240 drawings from Terramara di Montale in Italy. Participants reported a median speedup of 40 times, ranging from 17.5 to 120 times, but these are users' perceptions rather than direct timing. The tool currently targets artefact drawings, not architectural drawings or sections from scans. Still, semantically aware vectorization and ready-to-publish plates are relevant to any documentation department that produces drawings at scale.", "speech_he": "PyPottery, חבילת בינה מלאכותית פתוחה לשרטוטי חרסים. המאמר פורסם בתחילת אוקטובר. החבילה כוללת ארבעה מודולים. הראשון מחלץ שרטוטים מדפים סרוקים ומזהה כתב יד. השני מדיו שרטוטי עיפרון באופן אוטומטי. השלישי ממיר את השרטוט לקווים וקטוריים. הרביעי מסדר לוחות מוכנים לפרסום. הבדיקה נעשתה על מאתיים וארבעים שרטוטים מאתר באיטליה. המשתמשים דיווחו שהעבודה מהירה פי ארבעים בערך. אלה הערכות של המשתמשים, ולא מדידה ישירה. הכלי מיועד לשרטוטי כלים ולא לשרטוטי מבנים. אבל הרעיון רלוונטי לכל מחלקת תיעוד שמייצרת הרבה שרטוטים.", "speech_en": "PyPottery, an open AI suite for pottery drawings. The paper was published in early October. The suite has four modules. The first extracts drawings from scanned sheets and reads handwriting. The second inks pencil drawings automatically. The third converts the drawing into vector lines. The fourth lays out plates ready for publication. It was tested on 240 drawings from a site in Italy. Users reported work about 40 times faster. These are user estimates, not direct measurements. The tool targets artefact drawings, not building drawings. But the idea is relevant to any documentation team that produces many drawings.", "url": "https://arxiv.org/html/2610.02072", "sourceName": "arXiv", "relevance": 4, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Lorenzo Cardarelli"], "published": "2026-10-01"}, {"id": "2026-10-24-tutticam-multicam-sync", "date": "2026-10-24", "kind": "news", "topicId": "splats", "title": "TuttiCam: אפליקציה חינמית שמסנכרנת עד 8 טלפונים ומצלמות לצילום מערכי נתונים ל-splats", "summary": "אפליקציה ל-iOS וגרסת קוד פתוח ל-Android מפעילות כמה מכשירים בבת אחת, iPhone, Android, מצלמות אקשן ומצלמות ללא מראה, כדי לקצר צילום של חפצים וחללים. שימושי לתיעוד מהיר של מוצגים או חדרים, אך הסנכרון אינו מדויק ברמת החומרה.", "title_en": "TuttiCam: a free app that syncs up to 8 phones and cameras to capture splat datasets", "summary_en": "An iOS app with an open-source Android port triggers several devices at once, iPhones, Android phones, action cameras and mirrorless cameras, to speed up capture of objects and spaces. Useful for quick documentation of artefacts or rooms, though sync is not hardware-precise.", "details": "TuttiCam היא אפליקציה שמתאמת צילום בכמה מכשירים בבת אחת לצורך בניית מערכי נתונים ל-Gaussian Splatting, אבל היא לא מאמנת ולא משחזרת מודלים בעצמה. היא חינמית ב-iOS, וגרסת Android שלה פורסמה ב-GitHub בקוד פתוח ברישיון GPL-3.0. טלפונים מסוגים שונים יכולים לצלם יחד דרך Wi-Fi משותף, ומכשירי iPhone מתחברים ישירות זה לזה בלי ראוטר. דגמים נבחרים של DJI, GoPro, Sony, Canon, Fujifilm, Nikon ו-Ricoh מופעלים ב-Bluetooth. הגרסה החינמית מוגבלת לשלושה מכשירים, וגרסת Pro, הנדרשת רק במכשיר המארח, מאפשרת עד שמונה עם שליטה ידנית בתריס וב-ISO; המחיר לא פורסם. הסטייה בתזמון היא 15 עד 35 אלפיות שנייה ב-iPhone 14 Pro, ויותר בתאורה חלשה, כך שאין חשיפה מסונכרנת ברמת החומרה. RAW נשמר רק בחלק מהמכשירים, וקובצי המטא-דאטה אינם כיול מצלמה שנטען ישירות לתוכנות פוטוגרמטריה. לתיעוד מוצגים או חללים קטנים, זו דרך זולה לקצר את זמן הצילום בעזרת טלפונים קיימים.", "details_en": "TuttiCam coordinates capture across several devices at once to build Gaussian splatting datasets, but it does not train or reconstruct models itself. It is free on iOS, and its Android port is open source on GitHub under GPL-3.0. Phones of different types can shoot together over shared Wi-Fi, and iPhones connect directly to each other without a router. Selected DJI, GoPro, Sony, Canon, Fujifilm, Nikon and Ricoh models are triggered over Bluetooth. The free tier is limited to three devices, and Pro, needed only on the host device, allows up to eight with manual shutter and ISO; the price was not published. Timing jitter is 15 to 35 milliseconds on an iPhone 14 Pro, more in low light, so exposure is not hardware-synchronised. RAW is saved only on some devices, and the metadata files are not camera calibration that loads directly into photogrammetry software. For documenting artefacts or small spaces, it is a cheap way to shorten capture time using existing phones.", "speech_he": "האפליקציה TuttiCam מסנכרנת עד שמונה טלפונים ומצלמות לצילום אחד. המטרה היא לבנות מערכי תמונות למודלים של Gaussian Splatting. האפליקציה חינמית במכשירי iPhone, וגרסת Android שלה פתוחה. היא מפעילה גם מצלמות של DJI, GoPro, Sony ו-Canon דרך Bluetooth. הגרסה החינמית מוגבלת לשלושה מכשירים. גרסה בתשלום מאפשרת עד שמונה, והמחיר שלה לא פורסם. הסנכרון אינו מדויק לגמרי, והסטייה מגיעה לעשרות אלפיות שנייה. האפליקציה לא בונה את המודל בעצמה. לתיעוד מֻצָּגִים וחללים קטנים, זו דרך זולה לקצר את זמן הצילום.", "speech_en": "The TuttiCam app syncs up to eight phones and cameras into one capture. The goal is to build image sets for Gaussian splat models. It is free on iPhone, and its Android version is open source. It also triggers DJI, GoPro, Sony and Canon cameras over Bluetooth. The free version is limited to three devices. A paid version allows up to eight, and its price was not published. Sync is not perfect, with timing differences of tens of milliseconds. The app does not build the model itself. For documenting artefacts and small spaces, it is a cheap way to shorten capture time.", "url": "https://radiancefields.com/tutticam-syncs-up-to-8-cameras-for-gaussian-splat-capture", "sourceName": "Radiance Fields", "relevance": 3, "discovery": false, "isUpdate": false, "people": ["Michael Rubloff"], "published": "2026-10-23", "readTime": "2 דק׳"}, {"id": "2026-10-24-v-3dgs-weekly-oct12", "date": "2026-10-24", "kind": "media", "topicId": "splats", "title": "סיכום שבועי ב-3DGS: LichtFeld Studio מהיר פי 3, FARO ו-splats כתוצר סורק, ומשרד התשתיות היפני", "summary": "סרטון הסיכום השבועי של Radiance Fields מ-12 באוקטובר מרכז את ההתפתחויות בתחום: האצה באימון ב-LichtFeld Studio 0.5.4, Spark.js ב-WebGPU, Splat Toolbox של AWS בקוד פתוח, ואימוץ splats בידי FARO ומשרד התשתיות היפני. דרך מהירה להתעדכן בעשר דקות.", "title_en": "Weekly 3DGS recap: LichtFeld Studio 3x faster, FARO lists splats as a scanner output, and Japan's infrastructure ministry", "summary_en": "Radiance Fields' weekly recap from October 12 covers the field's developments: faster training in LichtFeld Studio 0.5.4, Spark.js on WebGPU, AWS's open-source Splat Toolbox, and splat adoption by FARO and Japan's infrastructure ministry. A quick way to catch up.", "details": "הסרטון עלה ב-12 באוקטובר 2026 בערוץ Radiance Fields, שמפעיל Michael Rubloff, והוא חלק מסדרת סיכומים שבועית. הנושא המרכזי הוא LichtFeld Studio 0.5.4, שלפי המפתחים מאמן מהר עד פי שלושה מהגרסה הקודמת. עוד נסקרים אימון מתוך סריקות לייזר ב-Spirula Studio, התוסף SplatGen בתוך Blender 5.3, תוספים ל-Cinema 4D ול-Redshift, ריתאורה ב-Unreal Engine 5 ותצוגה מקדימה של Spark.js על WebGPU. בצד התעשייה מוזכרים FARO, שמציגה splats כתוצר של הסורקים שלה, ומשרד התשתיות היפני שרשם שיטת splatting במאגר הטכנולוגיות NETIS, וכן Splat Toolbox בקוד פתוח של AWS. הסרטון ממומן על ידי Miris ומסתיים במודעות דרושים. ההכרה של FARO ושל משרד ממשלתי היא סימן חשוב לבשלות הטכנולוגיה לשימוש בתיעוד רשמי.", "details_en": "The video was posted on October 12, 2026 on the Radiance Fields channel, run by Michael Rubloff, as part of a weekly recap series. The main story is LichtFeld Studio 0.5.4, which its developers say trains up to three times faster than the previous release. It also covers training from laser scans in Spirula Studio, the SplatGen add-on inside Blender 5.3, plugins for Cinema 4D and Redshift, relighting in Unreal Engine 5 and a WebGPU preview of Spark.js. On the industry side it mentions FARO listing splats as an output of its scanners, Japan's infrastructure ministry registering a splatting method in its NETIS technology database, and AWS's open-source Splat Toolbox. The video is sponsored by Miris and ends with job listings. Recognition by FARO and a government ministry is an important sign of the technology's maturity for official documentation.", "speech_he": "סרטון סיכום שבועי של הערוץ Radiance Fields, מ-12 באוקטובר 2026. הנושא המרכזי הוא התוכנה LichtFeld Studio בגרסה 0.5.4, שמאמנת מהר עד פי שלושה. נסקרים גם התוסף SplatGen בתוך Blender, והספרייה Spark.js שעוברת ל-WebGPU. החברה FARO מציגה עכשיו מודלים של Gaussian Splatting כתוצר של הסורקים שלה. גם משרד התשתיות היפני רשם שיטה כזו במאגר הטכנולוגיות הרשמי שלו. החברה AWS פרסמה ערכת כלים בקוד פתוח. הסרטון ממומן. ההכרה של יצרנית סורקים ושל משרד ממשלתי מעידה על בשלות הטכנולוגיה לתיעוד רשמי.", "speech_en": "A weekly recap video from the Radiance Fields channel, from October 12, 2026. The main story is LichtFeld Studio version 0.5.4, which trains up to three times faster. It also covers the SplatGen add-on inside Blender, and the Spark.js library moving to WebGPU. FARO now lists Gaussian splats as an output of its scanners. Japan's infrastructure ministry registered a splatting method in its official technology database. AWS released an open source toolkit. The video is sponsored. Recognition by a scanner maker and a government ministry shows the technology is maturing for official documentation.", "watchUrl": "https://www.youtube.com/watch?v=t94mmLvgEXE", "url": "https://www.youtube.com/watch?v=t94mmLvgEXE", "sourceName": "Radiance Fields (YouTube)", "relevance": 4, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Michael Rubloff"], "published": "2026-10-12", "mediaType": "video", "duration": "משך לא צוין"}, {"id": "2026-10-24-v-3dgs-weekly-sep28", "date": "2026-10-24", "kind": "media", "topicId": "splats", "title": "סיכום שבועי ב-3DGS מ-28 בספטמבר: Spirula Studio החינמי, Insta360 Spatial Capture ו-268 מיליון splats ב-Unreal", "summary": "סרטון סיכום שבועי שמציג את Spirula Studio, פלטפורמת אימון חינמית בקוד פתוח, את Insta360 Spatial Capture למצלמות 360, ואת זרימות העבודה עם splats ב-Houdini 22. רלוונטי לבחירת כלי לכידה זולים לתיעוד.", "title_en": "Weekly 3DGS recap, September 28: free Spirula Studio, Insta360 Spatial Capture and 268 million splats in Unreal", "summary_en": "A weekly recap video featuring Spirula Studio, a free open-source training platform, Insta360 Spatial Capture for 360 cameras, and splat workflows in Houdini 22. Relevant to choosing low-cost capture tools for documentation.", "details": "הסרטון עלה ב-28 בספטמבר 2026 בערוץ Radiance Fields במסגרת הסיכום השבועי. הנושא המרכזי הוא Spirula Studio, פלטפורמת אימון חינמית בקוד פתוח למודלי Gaussian splats, שבהמשך הוסיפה גם אימון מתוך סריקות לייזר. עוד נסקרים השקת Insta360 Spatial Capture בארצות הברית למצלמות X6, X5 ו-X4 Air, צילום 4D של סיומי מרוצים בלונדון, מערך של 12 מכשירי iPhone מסונכרנים, זרימות עבודה עם splats ב-Houdini 22, תצוגות מקדימות של LichtFeld Studio, והצגה של 268 מיליון splats ב-Unreal Engine על ידי Magnopus. משך הסרטון לא היה זמין. הסרטון שימושי להשוואה בין אפשרויות לכידה זולות במצלמות 360 לבין כלי אימון חינמיים, לפני שבוחרים צנרת עבודה לתיעוד שוטף.", "details_en": "The video was posted on September 28, 2026 on the Radiance Fields channel as part of the weekly recap. The main story is Spirula Studio, a free open-source training platform for Gaussian splat models, which later added training from laser scans. It also covers the US launch of Insta360 Spatial Capture for the X6, X5 and X4 Air cameras, 4D capture of race finishes in London, a rig of 12 synchronised iPhones, splat workflows in Houdini 22, LichtFeld Studio previews, and Magnopus rendering 268 million splats in Unreal Engine. The video length was not available. It is useful for comparing low-cost 360 camera capture with free training tools before choosing a pipeline for routine documentation.", "speech_he": "סרטון סיכום שבועי של הערוץ Radiance Fields, מ-28 בספטמבר 2026. הנושא המרכזי הוא Spirula Studio, פלטפורמה חינמית בקוד פתוח לאימון מודלים של Gaussian Splatting. נסקרת גם השקה של Insta360 Spatial Capture למצלמות שלוש מאות ושישים מעלות. מוצגים גם זרימות עבודה בתוכנה Houdini 22, והצגה של 268 מיליון splats בתוכנה Unreal Engine. הסרטון עוזר להשוות בין לכידה זולה במצלמות 360 לבין כלי אימון חינמיים.", "speech_en": "A weekly recap video from the Radiance Fields channel, from September 28, 2026. The main story is Spirula Studio, a free open source platform for training Gaussian splat models. It also covers the launch of Insta360 Spatial Capture for 360 degree cameras. It shows workflows in Houdini 22, and 268 million splats rendered in Unreal Engine. The video helps compare low-cost 360 camera capture with free training tools.", "watchUrl": "https://www.youtube.com/watch?v=D79F5vnEboM", "url": "https://www.youtube.com/watch?v=D79F5vnEboM", "sourceName": "Radiance Fields (YouTube)", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Michael Rubloff"], "published": "2026-09-28", "mediaType": "video", "duration": "משך לא צוין"}, {"id": "2026-10-24-v-bcon26-ai-tools-sig", "date": "2026-10-24", "kind": "media", "topicId": "claude", "title": "מושב BCON26 על כלים מבוססי AI ב-Blender: מה קיים היום וההנחיות הרשמיות למפתחים", "summary": "מושב קבוצת עניין של 50 דקות שסוקר שימושים נוכחיים בלמידת מכונה וב-AI בתוך Blender, את הנחיות העיצוב שפרסמו מפתחי Blender לכלים כאלה, ודיון בניסויים פתוחים. רקע שימושי לפני חיבור Claude ל-Blender דרך MCP.", "title_en": "BCON26 session on AI-enabled tools in Blender: what exists today and the official developer guideline", "summary_en": "A 50-minute special interest group session reviewing current machine learning and AI uses inside Blender, the design guideline Blender's developers published for such tools, and a discussion of open experiments. Useful background before connecting Claude to Blender through MCP.", "details": "המושב התקיים ב-24 בספטמבר 2026 בכנס Blender Conference באמסטרדם ונמשך 50 דקות. מנחה אותו Oscar Baechler, סגן נשיא למוצר ושיווק ב-UnrealizeX. המושב סוקר את השימושים הקיימים בלמידת מכונה וב-AI בתוך Blender, ומציג את הנחיות העיצוב שמפתחי Blender פרסמו לכלים מבוססי AI. בחלק השני נפתח דיון בניסויים ובמחקרים שנמצאים בעבודה בקהילה. זו לא הדרכה מעשית אלא דיון על הכיוון ועל הכללים. ההנחיות של Blender חשובות למי שמשתמש בשרתי MCP כדי לתת ל-Claude לשלוט בסצנה, כי הן מראות מה הקהילה מוכנה לקבל ומה עלול להיתקל בהתנגדות. כדאי לצפות לפני שבונים צנרת עבודה שתלויה בתוסף AI לא רשמי.", "details_en": "The session took place on September 24, 2026 at Blender Conference in Amsterdam and lasted 50 minutes. It is led by Oscar Baechler, VP of Product and Marketing at UnrealizeX. It reviews current uses of machine learning and AI inside Blender and presents the design guideline Blender's developers published for AI-enabled tools. The second part opens a discussion of experiments and research under way in the community. It is not a hands-on tutorial but a discussion of direction and rules. Blender's guideline matters for anyone using MCP servers to let Claude control a scene, because it shows what the community will accept and what may meet resistance. Worth watching before building a pipeline that depends on an unofficial AI add-on.", "speech_he": "מושב מכנס Blender Conference 2026, באורך 50 דקות. את המושב מנחה Oscar Baechler מהחברה UnrealizeX. הוא סוקר את השימושים הקיימים בבינה מלאכותית בתוך התוכנה Blender. הוא מציג את ההנחיות שמפתחי Blender פרסמו לכלים כאלה. בחלק השני יש דיון בניסויים פתוחים בקהילה. זו לא הדרכה מעשית אלא דיון על הכיוון. כדאי לצפות לפני שמחברים את Claude ל-Blender דרך שרת MCP.", "speech_en": "A session from Blender Conference 2026, 50 minutes long. It is led by Oscar Baechler from UnrealizeX. He reviews current uses of artificial intelligence inside Blender. He presents the guideline Blender's developers published for such tools. The second part is a discussion of open experiments in the community. It is not a hands-on tutorial but a discussion of direction. Worth watching before connecting Claude to Blender through an MCP server.", "watchUrl": "https://www.youtube.com/watch?v=fwpdDKbwA08", "url": "https://conference.blender.org/2026/presentations/4227/", "sourceName": "Blender Conference 2026", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Oscar Baechler"], "published": "2026-09-24", "mediaType": "talk", "duration": "50 דק׳"}, {"id": "2026-10-24-v-bcon26-xr-bridge", "date": "2026-10-24", "kind": "media", "topicId": "webxr", "title": "הרצאה מ-Blender Conference 2026: גשר XR לעבודה מרחבית ב-Blender עם משקפי PICO", "summary": "שני מפתחים מ-PICO שב-ByteDance מציגים את התקדמות XR ב-Blender בשנה האחרונה וזרימת עבודה שהופכת משקפי VR לעמדת עבודה מלאה, עם מעבר בין שולחנות עבודה וירטואליים. מעניין לבדיקת מודלים של אתרים בקנה מידה אמיתי.", "title_en": "Blender Conference 2026 talk: a practical XR bridge for spatial workflows in Blender with PICO headsets", "summary_en": "Two developers from PICO at ByteDance present the past year's progress in Blender XR and a workflow that turns a VR headset into a full workstation, switching between virtual desktops. Interesting for reviewing site models at true scale.", "details": "ההרצאה ניתנה ב-25 בספטמבר 2026 בכנס Blender Conference באמסטרדם ונמשכה 25 דקות. המרצים הם Ruoya Sheng, מנהלת מוצר ב-PICO OS Foundation של ByteDance, ו-Junfeng She, מהנדס תוכנה שעובד על OpenXR ואינטראקציה סוחפת. הם סוקרים את ההתקדמות של תמיכת XR ב-Blender בשנה האחרונה ומציגים זרימת עבודה של PCVR במשקפי PICO שהופכת אותם לעמדת עבודה מרחבית. בהדגמה עוברים בין שולחנות עבודה וירטואליים ושולטים בציוד היקפי מתוך המציאות המדומה, בלי להוריד את המשקפיים. הטענה המרכזית היא שהסרת המחסום בין עבודה במציאות מדומה לעבודה במחשב מאפשרת איטרציה רציפה יותר. ההרצאה מבוססת על ציוד של יצרן אחד, אבל העקרונות נשענים על OpenXR. לצוות תיעוד, זו דרך לבחון מודלים של אתרים ומבנים בקנה מידה אמיתי תוך כדי עריכה.", "details_en": "The talk was given on September 25, 2026 at Blender Conference in Amsterdam and lasted 25 minutes. The speakers are Ruoya Sheng, product manager at ByteDance's PICO OS Foundation, and Junfeng She, a software engineer working on OpenXR and immersive interaction. They review the past year's progress in Blender's XR support and show a PCVR workflow on PICO headsets that turns them into a spatial workstation. The demo switches between virtual desktops and controls peripherals from inside virtual reality without removing the headset. The main argument is that removing the barrier between VR and desktop work allows more continuous iteration. The talk relies on one vendor's hardware, but the principles rest on OpenXR. For a documentation team it is a way to review site and building models at true scale while editing.", "speech_he": "הרצאה מכנס Blender Conference 2026, באורך 25 דקות. המרצים הם Ruoya Sheng ו-Junfeng She, מהחברה PICO של ByteDance. הם סוקרים את ההתקדמות של מציאות מעורבת בתוכנה Blender בשנה האחרונה. הם מציגים זרימת עבודה שהופכת משקפי מציאות מדומה לעמדת עבודה מלאה. אפשר לעבור בין שולחנות עבודה וירטואליים בלי להוריד את המשקפיים. ההרצאה מבוססת על ציוד של יצרן אחד, אבל העקרונות נשענים על התקן OpenXR. לצוות תיעוד, זו דרך לבחון מודלים של אתרים בקנה מידה אמיתי תוך כדי עריכה.", "speech_en": "A talk from Blender Conference 2026, 25 minutes long. The speakers are Ruoya Sheng and Junfeng She, from PICO at ByteDance. They review the past year's progress in mixed reality support in Blender. They show a workflow that turns a VR headset into a full workstation. You can switch between virtual desktops without taking off the headset. The talk relies on one vendor's hardware, but the principles rest on the OpenXR standard. For a documentation team, it is a way to review site models at true scale while editing.", "watchUrl": "https://www.youtube.com/watch?v=6mYP51QcD3Y", "url": "https://conference.blender.org/2026/presentations/4310/", "sourceName": "Blender Conference 2026", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Ruoya Sheng", "Junfeng She"], "published": "2026-09-25", "mediaType": "talk", "duration": "25 דק׳"}, {"id": "2026-10-24-v-claude-threejs-motion", "date": "2026-10-24", "kind": "media", "topicId": "claude", "title": "Claude עם Three.js: איך משדרגים אנימציות תלת-ממדיות שנוצרות בקוד", "summary": "מדריך וידאו מ-15 באוקטובר שמראה איך שילוב Three.js משפר את אנימציות התלת-ממד ש-Claude מייצר בקוד. שימושי להפקת סרטוני הסבר קצרים לאתרים ולמוצגים בלי תוכנת אנימציה.", "title_en": "Claude with Three.js: upgrading code-generated 3D motion graphics", "summary_en": "A video tutorial from October 15 showing how adding Three.js improves the 3D motion graphics Claude produces in code. Useful for producing short explainer videos for sites and exhibits without animation software.", "details": "הסרטון עלה ב-15 באוקטובר 2026 בערוץ Matt Penny, Applied AI. הוא מתמקד בשימוש בספרייה Three.js כדי לשפר את איכות אנימציות התלת-ממד ש-Claude יוצר באמצעות קוד, בהמשך לגל הסרטונים על יצירת וידאו בקוד עם Claude Opus 5.5. התיאור מפנה לקהילה בתשלום של היוצר, ואין גילוי נאות על חסות, כך שכדאי לראות בו הדגמה ולא מדריך מקיף. משך הסרטון לא היה זמין. הרעיון רלוונטי להפקת סרטוני הסבר קצרים, למשל מעבר מצלמה סביב מודל של ממצא או אנימציה של שלבי בנייה, ישירות מתוך Claude ובלי תוכנת אנימציה ייעודית.", "details_en": "The video was posted on October 15, 2026 on the Matt Penny, Applied AI channel. It focuses on using the Three.js library to improve the quality of 3D motion graphics that Claude creates in code, following the wave of videos on code-based video creation with Claude Opus 5.5. The description points to the creator's paid community and there is no sponsorship disclosure, so treat it as a demonstration rather than a full tutorial. The video length was not available. The idea is relevant for producing short explainer videos, such as a camera move around a model of a find or an animation of construction phases, directly from Claude without dedicated animation software.", "speech_he": "סרטון מ-15 באוקטובר 2026, בערוץ Matt Penny. הסרטון מראה איך הספרייה Three.js משפרת אנימציות תלת ממדיות ש-Claude יוצר בקוד. התיאור מפנה לקהילה בתשלום של היוצר, ולכן כדאי לראות בו הדגמה ולא מדריך מלא. הרעיון שימושי להפקת סרטוני הסבר קצרים. למשל, תנועת מצלמה סביב מודל של ממצא, או אנימציה של שלבי בנייה. כל זה נעשה בלי תוכנת אנימציה ייעודית.", "speech_en": "A video from October 15, 2026, on the Matt Penny channel. It shows how the Three.js library improves 3D animations that Claude creates in code. The description points to the creator's paid community, so treat it as a demonstration rather than a full tutorial. The idea is useful for making short explainer videos. For example, a camera move around a model of a find, or an animation of construction phases. All this without dedicated animation software.", "watchUrl": "https://www.youtube.com/watch?v=CCUSpJkAfgU", "url": "https://www.youtube.com/watch?v=CCUSpJkAfgU", "sourceName": "Matt Penny | Applied AI (YouTube)", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-15", "mediaType": "video", "duration": "משך לא צוין"}, {"id": "2026-10-24-v-cyark-millbern-interview", "date": "2026-10-24", "kind": "media", "topicId": "heritage", "title": "ראיון עם Chris Millbern מ-CyArk: תיעוד באוקראינה ובפטרה, ופוטוגרמטריה מול LiDAR מול splats", "summary": "ראיון ארוך עם ראש צוות הלכידה בשטח של CyArk על בחירת אתרים, תיעוד מורשת באוקראינה בזמן מלחמה, לחץ התיירות בפטרה, והשוואה מעשית בין פוטוגרמטריה, LiDAR ו-Gaussian splats. מבט מבפנים של ארגון התיעוד המוביל בעולם.", "title_en": "Interview with CyArk's Chris Millbern: documentation in Ukraine and Petra, and photogrammetry vs LiDAR vs splats", "summary_en": "A long interview with CyArk's head of field capture on site selection, wartime heritage documentation in Ukraine, tourism pressure at Petra, and a practical comparison of photogrammetry, LiDAR and Gaussian splats. An inside view from the world's leading documentation organisation.", "details": "הראיון עלה ב-10 בפברואר 2026 בערוץ Reality Capture Network, והוא מובא כאן כתוכן מקצועי שלא דווח בעבר. Chris Millbern הוא ראש צוות הלכידה בשטח בארגון CyArk, ועובד על מיפוי תלת-ממדי ושימור באתרים מרוחקים ומסוכנים. פרקי הראיון עוסקים באופן שבו CyArk בוחר אתרים, בתיעוד מורשת באוקראינה בזמן המלחמה, בלחץ התיירות על פטרה ובעבודה ברפובליקה הדמוקרטית של קונגו. חלק מרכזי מוקדש להשוואה בין פוטוגרמטריה, LiDAR ו-Gaussian splats ומתי להשתמש בכל אחת, ולצידו הוראת תלת-ממד ומסלול הקריירה שלו. משך הסרטון לא היה זמין. עבור רשות שמתעדת אתרים רבים בתנאי שטח, זו הזדמנות לשמוע איך ארגון בינלאומי מחליט על שיטת לכידה ומתמודד עם תיעוד בחירום.", "details_en": "The interview was posted on February 10, 2026 on the Reality Capture Network channel and is included here as professional content not reported before. Chris Millbern is head of field capture at CyArk and works on 3D mapping and preservation at remote and hazardous sites. The chapters cover how CyArk selects sites, heritage documentation in Ukraine during the war, tourism pressure on Petra and work in the Democratic Republic of Congo. A central section compares photogrammetry, LiDAR and Gaussian splats and when to use each, along with teaching 3D and his career path. The video length was not available. For an authority documenting many sites in field conditions, it is a chance to hear how an international organisation chooses a capture method and handles emergency documentation.", "speech_he": "ראיון עם Chris Millbern, ראש צוות הלכידה בשטח בארגון CyArk. הראיון עלה בפברואר 2026 בערוץ Reality Capture Network. הוא מספר איך CyArk בוחר אתרים לתיעוד. הוא מתאר תיעוד מורשת באוקראינה בזמן המלחמה, ואת לחץ התיירות בפטרה. חלק מרכזי מוקדש להשוואה בין פוטוגרמטריה, סורק לייזר ו-Gaussian Splatting. הוא מסביר מתי מתאימה כל שיטה. זו הזדמנות לשמוע איך ארגון תיעוד בינלאומי מחליט על שיטת לכידה, ואיך הוא מתעד בחירום.", "speech_en": "An interview with Chris Millbern, head of field capture at CyArk. It was posted in February 2026 on the Reality Capture Network channel. He explains how CyArk chooses sites to document. He describes heritage documentation in Ukraine during the war, and tourism pressure at Petra. A central part compares photogrammetry, laser scanning and Gaussian splatting. He explains when each method fits. It is a chance to hear how an international documentation organisation chooses a capture method, and how it documents in emergencies.", "watchUrl": "https://www.youtube.com/watch?v=8AV7LEIOt6Q", "url": "https://www.youtube.com/watch?v=8AV7LEIOt6Q", "sourceName": "Reality Capture Network (YouTube)", "relevance": 4, "heritage": true, "discovery": true, "isUpdate": false, "people": ["Chris Millbern"], "published": "2026-02-10", "mediaType": "video", "duration": "משך לא צוין"}, {"id": "2026-10-24-v-miladi-claude-3d-site", "date": "2026-10-24", "kind": "media", "topicId": "claude", "title": "מדריך: אתר תלת-ממדי אינטראקטיבי עם Claude Code ו-Opus 5.5, מתמונה למודל GLB מונפש ובדיקות אוטומטיות", "summary": "מדריך מלא מ-6 באוקטובר שבונה אתר תלת-ממדי: הפיכת תמונה למודל GLB, הנפשה, תנועת מצלמה לפי גלילה וגלריה סביב אובייקט, ובסוף בדיקה ותיקון אוטומטיים. תבנית שאפשר להתאים להצגת ממצא או מבנה; הסרטון כולל קישורי קידום.", "title_en": "Tutorial: an interactive 3D website with Claude Code and Opus 5.5, from an image to an animated GLB model and automated tests", "summary_en": "A full tutorial from October 6 building a 3D website: turning an image into a GLB model, animation, scroll-driven camera movement and a gallery around an object, then automated testing and fixing. A template that can be adapted to present a find or building; the video includes promotional links.", "details": "הסרטון עלה ב-6 באוקטובר 2026 בערוץ MiladiCode. המדריך בונה בעזרת Claude Code ו-Claude Opus 5.5 אתר תלת-ממדי אינטראקטיבי. השלבים כוללים הכנת תמונת דמות והמרתה למודל תלת-ממדי, הנפשה של קובץ GLB, שימוש בסרטוני ייחוס כדי לתכנן תנועת מצלמה לפי גלילה, ובניית גלריית כרטיסים שמסתובבת סביב אובייקט מרכזי. בסוף מוצג שימוש בכלי בדיקות אוטומטי לאיתור תקלות בממשק, תיקון שלהן ב-Claude Code והרצה חוזרת של הבדיקות. קובצי הפרויקט, כולל ההנחיות והמודל, זמינים להורדה. התיאור כולל קישורים לכלים שנראים כקידום בתשלום, אף שאין גילוי מפורש. את המבנה, אובייקט במרכז וגלריה וגלילה מסביבו, אפשר להתאים להצגת ממצא ארכאולוגי או מבנה עם מידע נלווה.", "details_en": "The video was posted on October 6, 2026 on the MiladiCode channel. The tutorial uses Claude Code and Claude Opus 5.5 to build an interactive 3D website. Steps include preparing a character image and converting it to a 3D model, animating a GLB file, using reference videos to plan scroll-driven camera movement, and building a card gallery that spirals around a central object. At the end it shows an automated testing tool finding interface issues, fixing them with Claude Code and rerunning the tests. Project files, including prompts and the model, are available to download. The description includes links to tools that look like paid promotion, though there is no explicit disclosure. The structure, an object in the centre with a gallery and scrolling around it, can be adapted to present an archaeological find or building with accompanying information.", "speech_he": "מדריך וידאו מ-6 באוקטובר 2026, בערוץ MiladiCode. המדריך בונה אתר תלת ממדי אינטראקטיבי בעזרת Claude Code והמודל Opus 5.5. בשלב הראשון הופכים תמונה למודל תלת ממדי, ומנפישים אותו. אחר כך מתכננים תנועת מצלמה שמשתנה לפי הגלילה בדף. נבנית גם גלריה שמסתובבת סביב אובייקט במרכז המסך. בסוף כלי בדיקות אוטומטי מוצא תקלות, ו-Claude Code מתקן אותן. הסרטון כולל קישורי קידום לכלים. את המבנה אפשר להתאים להצגת ממצא ארכאולוגי או מבנה, עם מידע נלווה.", "speech_en": "A video tutorial from October 6, 2026, on the MiladiCode channel. It builds an interactive 3D website with Claude Code and the Opus 5.5 model. First, an image is turned into a 3D model and animated. Then a camera move is planned that changes as the page scrolls. A gallery is built that spins around an object in the centre of the screen. Finally, an automated testing tool finds bugs, and Claude Code fixes them. The video includes promotional links to tools. The layout can be adapted to present an archaeological find or a building, with accompanying information.", "watchUrl": "https://www.youtube.com/watch?v=TnduiS4kyg8", "url": "https://www.youtube.com/watch?v=TnduiS4kyg8", "sourceName": "MiladiCode (YouTube)", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-06", "mediaType": "video", "duration": "משך לא צוין"}], "sources": [{"name": "AIMused", "url": "https://aimused.eu/", "type": "project", "topics": ["heritage"], "people": [], "expertise": 3, "relevance": 5, "notes": "פרויקט Interreg ל-AI והנגשה במוזיאונים, 2025–2028."}, {"name": "Anthropic News", "url": "https://www.anthropic.com/news", "type": "docs", "topics": ["claude"], "people": [], "expertise": 5, "relevance": 4, "notes": "הכרזות רשמיות על מודלים ומוצרים."}, {"name": "Archaeology Wiki (Archaeology Newsroom)", "url": "https://www.archaeology.wiki/", "type": "site", "topics": ["research", "heritage"], "people": [], "expertise": 3, "relevance": 3, "notes": "חדשות ארכאולוגיה, כולל פרויקטים של AI ותיעוד תלת-ממדי של ממצאים."}, {"name": "arXiv (cs.CV, cs.HC, cs.GR)", "url": "https://arxiv.org/", "type": "database", "topics": ["research", "splats"], "people":   function themeBtn(){const d=effTheme()==="dark";return `<button type="button" class="iconbtn" data-theme-toggle aria-label="${d?"מעבר לרקע בהיר":"מעבר לרקע כהה"}">${d?IC.sun:IC.moon}<span>${d?"רקע בהיר":"רקע כהה"}</span></button>`}
  function refreshThemeBtns(){document.querySelectorAll("[data-theme-toggle]").forEach(b=>{b.outerHTML=themeBtn()})}
  /* ---------- events ---------- */
  function init(){
    const saved=store.get("radarTheme");if(saved)applyTheme(saved);
    const s=synth();if(s){if("onvoiceschanged" in s)s.onvoiceschanged=()=>refreshVoiceUI();try{s.getVoices()}catch(e){}}
    document.addEventListener("change",e=>{const id=e.target.id;
      if(id==="vsHe"||id==="vsEn"){store.set("radarTtsVoice_"+(id==="vsHe"?"he":"en"),e.target.value);if(tts.on)stopSpeak();toast("הקול נשמר במכשיר הזה")}
      else if(id==="vsMix"){store.set("radarTtsMix2",e.target.checked?"1":"0");if(tts.on)stopSpeak()}
      else if(id==="vsRate"){store.set("radarTtsRate2",e.target.value);if(tts.on)stopSpeak()}});
    document.addEventListener("input",e=>{if(e.target.id==="vsRate"){const o=document.getElementById("vsRateVal");if(o)o.textContent=(+e.target.value).toFixed(2)}});
    document.addEventListener("toggle",e=>{if(e.target.classList&&e.target.classList.contains("vset")){store.set("radarVsetOpen",e.target.open?"1":"0");if(e.target.open)refreshVoiceUI()}},true);
    document.addEventListener("click",e=>{
      const sv=e.target.closest("[data-save-item],[data-copy-save]");
      if(sv){if(sv.hasAttribute("data-copy-save"))copy(saveMsg());else{markOpened(sv.dataset.saveItem);openSave(sv.dataset.saveItem)}return}
      const pv=e.target.closest("[data-preview],[data-ext-open],[data-speak-minute]");
      const vt=e.target.closest("[data-vtest]");if(vt){if(tts.on)stopSpeak();else voiceTest();return}
      if(pv){if(pv.dataset.preview){openPreview(pv.dataset.preview,pv.dataset.pk);return}
        if(pv.hasAttribute("data-ext-open")){leftForLink=true;if(pv.dataset.openId)markOpened(pv.dataset.openId);return}
        if(pv.hasAttribute("data-speak-minute")){speakText(pv.dataset.speakMinute,pv);return}}
      const t=e.target.closest("[data-read],[data-listen],[data-play],[data-lang],[data-share-item],[data-share-report],[data-close-sheet],[data-theme-toggle],[data-copy],[data-sheet-bg]");if(!t)return;
      if(t.hasAttribute("data-sheet-bg")){if(e.target===t)closeSheet();return}
      if(t.dataset.read){openReader(t.dataset.read,false);return}
      if(t.dataset.listen){openReader(t.dataset.listen,true);return}
      if(t.dataset.play){if(t.hasAttribute("disabled"))return;if(tts.on)stopSpeak();else speak(t.dataset.play);return}
      if(t.dataset.lang){lang=t.dataset.lang;store.set("radarLang",lang);const id=document.getElementById("rdPlay")?.dataset.play;const was=tts.on;stopSpeak();rerenderReader(id);if(was)speak(id);return}
      if(t.dataset.shareItem){const it=find(t.dataset.shareItem);if(it)shareSheet(it.title+(safeUrl(it.url)?"\n"+it.url:""),"i-"+it.id);return}
      if(t.dataset.shareReport){shareSheet(t.dataset.shareText||"מכ״ם מורשת TEC","d-"+t.dataset.shareReport);return}
      if(t.hasAttribute("data-close-sheet")){closeSheet();return}
      if(t.hasAttribute("data-theme-toggle")){const n=effTheme()==="dark"?"light":"dark";applyTheme(n);store.set("radarTheme",n);refreshThemeBtns();return}
      if(t.dataset.copy!=null){copy(t.dataset.copy);return}
    });
    document.addEventListener("input",e=>{if(e.target.id==="svNote"||e.target.id==="svMe")updSave()});
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&leftForLink){leftForLink=false;toast("חזרתם למכ״ם")}});
    loadSeen();
    document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.getElementById("rsheet"))closeSheet()});
  }
  return {esc,safeUrl,fmt,IC,MEDIA,configure,card,toast,copy,openSheet,closeSheet,shareSheet,themeBtn,init,openReader,markVisit,isNew,newCount};
})();

<script>

const {esc,safeUrl,fmt,IC}=RUI;

const cardOf=(i,o={})=>RUI.card(i,{...o,flash:S.flash===i.id});
function byTopic(list,opts){const out=[];const seen=new Set();
  for(const t of sortedTopics()){const its=list.filter(i=>i.topicId===t.id).sort(itemSort);if(!its.length)continue;seen.add(t.id);out.push(`<section class="topic"><h4>${esc(t.name)} · ${its.length}</h4><div class="nlist">${its.map(i=>cardOf(i,opts)).join("")}</div></section>`)}
  const rest=list.filter(i=>!seen.has(i.topicId));if(rest.length)out.push(`<section class="topic"><h4>תחומים נוספים</h4><div class="nlist">${rest.sort(itemSort).map(i=>cardOf(i,opts)).join("")}</div></section>`);

  return `<div class="controls"><input type="search" id="q" placeholder="חיפוש בכל הדו״חות, בעברית או באנגלית…" value="${esc(S.q)}" aria-label="חיפוש">
    <select id="qt" aria-label="תחום"><option value="">כל התחומים</option>${sortedTopics().map(t=>`<option value="${esc(t.id)}" ${S.topic===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select>

  <div class="sub">${res.length} תוצאות${DATA.archiveDays?` · ארכיון של ${DATA.archiveDays} הימים האחרונים`:""}</div>

function vAbout(){

  return `<div class="prose">
  <h3>מה זה</h3>
  <p>מכ״ם מורשת TEC הוא כלי שיתוף ידע מקצועי. בכל בוקר נסרקים אתרי חדשות, כתבי עת, ערוצי וידאו ופודקאסטים, ונבחרים החידושים המשמעותיים בתחומים: בינה מלאכותית ליצירת חוויות מציאות רבודה ומעורבת, Gaussian Splatting ולכידה תלת-ממדית, הנגשת אתרי מורשת ותיירות לציבור, ובניית אפליקציות עם Claude.</p>
  <p>לכל פריט יש שלושה כפתורים: <strong>לקרוא</strong> פותח תקציר בעברית או באנגלית, <strong>לשמוע</strong> מקריא אותו בקול, ו<strong>קישור</strong> מוביל למקור המלא. בסרטונים ובפודקאסטים הכפתורים הם <strong>לראות</strong>, <strong>לשמוע</strong> ו<strong>קישור</strong>.</p>

  <div class="row">${n?`<a class="btn wa" href="https://wa.me/${n}?text=${encodeURIComponent(join)}" target="_blank" rel="noopener">${IC.wa}<span>הצטרפות בוואטסאפ</span></a>`:`<span class="sub">ההצטרפות בוואטסאפ תיפתח בקרוב.</span>`}${OWNER.email?`<span class="sub">או במייל: <span class="mono" style="user-select:all">${esc(OWNER.email)}</span></span>`:""}</div>

  <p><strong>הקראה:</strong> כפתור ״לשמוע״ משתמש בקולות של המכשיר. עברית נקראת בקול עברי, ושמות ומונחים באנגלית נקראים בקול אנגלי. לקול הטבעי והברור ביותר במחשב Windows, פתחו את המכ״ם בדפדפן Edge. בטלפון אפשר להוריד קול עברי וקול אנגלי משופרים בהגדרות הנגישות או ההקראה. את הקולות והמהירות בוחרים ב״הגדרות קול והקראה״ שבתוך כל תקציר.</p>
  ${PUBLIC_URL?`<div class="row"><span class="mono" style="user-select:all;direction:ltr">${esc(PUBLIC_URL)}</span><button class="btn" data-copy="${esc(PUBLIC_URL)}">${IC.link}<span>העתקת הקישור</span></button></div>`:""}
  <h3 id="terms">תנאי שימוש</h3>
  <p>${esc(DISCLAIMER)}</p>
  <h3>איך נכתב המכ״ם</h3>
  <p>בכל בוקר Claude, כלי בינה מלאכותית, סורק מקורות פומביים לפי התחומים והמקורות שדוד צל קבע, וכותב לכל פריט כותרת ותקציר במילים שלו. הפריטים לא נבדקים אחד-אחד לפני הפרסום. פריט שגוי מתוקן או מוסר כשמתגלה. המכ״ם לא מעתיק טקסטים או תמונות מהמקורות, ולכל פריט יש קישור למקור המלא.</p>
  <h3>בקשת תיקון או הסרה</h3>
  <p>בעלי זכויות שמבקשים לתקן או להסיר תקציר מוזמנים לפנות בוואטסאפ${OWNER.email?" או במייל":""}, עם הקישור לפריט ופרטי היצירה. פניות נבדקות תוך 3 ימי עבודה, ועד הבדיקה הפריט מוסתר. אפשר לפנות גם מתוך כל פריט, בקישור ״בקשת תיקון או הסרה״ שבתחתית התקציר.</p>
  <div class="row">${n?`<a class="btn" href="https://wa.me/${n}?text=${encodeURIComponent("בקשת תיקון או הסרה ממכ״ם מורשת TEC\nקישור לפריט:\nפרטי היצירה:\nמה צריך לתקן או להסיר:")}" target="_blank" rel="noopener">${IC.wa}<span>פנייה בוואטסאפ</span></a>`:""}${OWNER.email?`<span class="sub">מייל: <span class="mono" style="user-select:all">${esc(OWNER.email)}</span></span>`:""}</div>
  <h3>פרטיות</h3>
  <p>פרטי המנויים (שם, טלפון או מייל, תחום עיסוק) נשמרים רק אצל דוד צל, משמשים רק לשליחת העדכון היומי ואינם מועברים לאיש. אפשר להסיר אותם בכל עת בהודעה ״הסר״. המכ״ם עצמו לא אוסף מידע על הקוראים. הגדרות כמו רקע, שפה ופריטים שנפתחו נשמרות רק במכשיר שלכם.</p>
  </div>`;
}
function renderTabs(){const nc=RUI.newCount(ITEMS);
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.view===k}">${l}${k==="today"&&nc?`<span class="count" aria-label="${nc} חדשים">${nc}</span>`:""}</button>`).join("")}
function render(){
  renderTabs();
  const n=waNum();
  $("#themeSlot").innerHTML=RUI.themeBtn();
  $("#mastactions").innerHTML=`<button class="btn primary" data-tab="suggest">${IC.plus}<span>הציעו מקור או מידע</span></button>${n?`<a class="btn wa" href="https://wa.me/${n}?text=${encodeURIComponent("שלום דוד, אשמח לקבל את העדכון היומי של מכ״ם מורשת TEC.\nשם:\nאיך לשלוח לי: וואטסאפ / מייל")}" target="_blank" rel="noopener">${IC.wa}<span>קבלת העדכון היומי</span></a>`:`<button class="btn" data-tab="about">קבלת העדכון היומי</button>`}${PUBLIC_URL?`<button class="btn" data-copy="${esc(PUBLIC_URL)}">${IC.link}<span>העתקת קישור למכ״ם</span></button>`:""}`;
  $("#view").innerHTML={today:vToday,archive:vArchive,sources:vSources,suggest:vSuggest,about:vAbout}[S.view]();
  $("#disclaimer").innerHTML=`<p class="ailabel" style="margin:0 0 6px">${esc(AI_LINE)}</p>${esc("כלי שיתוף ידע ביוזמה אישית של דוד צל, שאינו מייצג גוף כלשהו")} · <button class="linkbtn" data-terms>תנאי שימוש ובקשת הסרה</button>${DATA.generatedAt?`<div class="mono" style="margin-top:6px">עודכן ${esc(fmt(DATA.generatedAt.slice(0,10)))}</div>`:""}`;
  if(S.view==="suggest")updWa();
}
function updWa(){const a=$("#sendWa");if(a)a.href=`https://wa.me/${waNum()}?text=${encodeURIComponent(sugText())}`}
document.addEventListener("click",e=>{const t=e.target.closest("[data-tab],[data-copy-sug],[data-terms]");if(!t)return;
  if(t.hasAttribute("data-terms")){S.view="about";render();const el=document.getElementById("terms");if(el)el.scrollIntoView({block:"start"});return}
  if(t.hasAttribute("data-copy-sug")){RUI.copy(sugText());return}
  S.view=t.dataset.tab;S.flash=null;render();window.scrollTo(0,0)});
document.addEventListener("input",e=>{if(["sUrl","sNote","sName","sContact"].includes(e.target.id))updWa();
  if(e.target.id==="q"){S.q=e.target.value;clearTimeout(window._qt);window._qt=setTimeout(()=>{render();const q=$("#q");q.focus();q.setSelectionRange(q.value.length,q.value.length)},220)}});
document.addEventListener("change",e=>{const id=e.target.id,v=e.target.value;
  if(e.target.name==="sType"){S.sType=v;updWa();return}
  if(id==="dateSel"){S.date=v;render()}else if(id==="qt"){S.topic=v;render()}else if(id==="qk"){S.kind=v;render()}else if(id==="st"){S.srcTopic=v;render()}});
(function route(){const h=(location.hash||"").slice(1);
  if(h.startsWith("i-")){const it=ITEMS.find(i=>"i-"+i.id===h);if(it){S.date=it.date;S.flash=it.id}}
  else if(h.startsWith("d-")){const d=h.slice(2);if(REPORTS.some(r=>r.date===d))S.date=d}
  else if(h==="about"||h==="join"){S.view="about"}
  else if(TABS.some(([k])=>k===h))S.view=h;
  render();
  if(S.flash){const el=document.getElementById("i-"+S.flash);if(el)el.scrollIntoView({block:"start"})}})();
</script>
