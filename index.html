<title>מכ״ם מורשת TEC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: field-survey logbook — masthead with byline, sticky tab strip, morning watch/listen grid first, then findings as action cards */
:root{
  --listen-soft:#E2E4F6;
  --bg:#E8EBE6;--surface:#FFFFFF;--surface-2:#F3F5F2;--ink:#10161C;--muted:#434D57;--line:#BFC7BE;
  --accent:#0A5C5C;--on-accent:#FFFFFF;--accent-soft:#D3E8E4;
  --listen:#343B99;--on-listen:#FFFFFF;
  --heritage:#87530A;--heritage-soft:#F2E1BF;--update:#4F2F9E;--update-soft:#E3DAF5;
  --wa:#13703B;--on-wa:#FFFFFF;--good:#1F6B35;--bad:#9E2C21;
  --f-display:"Frank Ruhl Libre","David","Times New Roman",serif;
  --f-body:"Assistant","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1317;--surface:#19212A;--surface-2:#141B22;--ink:#F0F3F1;--muted:#B4BFC6;--line:#36434E;
  --accent:#5FCCC3;--on-accent:#04201E;--accent-soft:#16383A;--listen:#AEB5FF;--on-listen:#10143A;--listen-soft:#262B4D;
  --heritage:#EDBE6E;--heritage-soft:#3A2B12;--update:#C7B6F7;--update-soft:#2C2546;
  --wa:#5FD898;--on-wa:#062414;--good:#72CC80;--bad:#F2907F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1317;--surface:#19212A;--surface-2:#141B22;--ink:#F0F3F1;--muted:#B4BFC6;--line:#36434E;
  --accent:#5FCCC3;--on-accent:#04201E;--accent-soft:#16383A;--listen:#AEB5FF;--on-listen:#10143A;--listen-soft:#262B4D;
  --heritage:#EDBE6E;--heritage-soft:#3A2B12;--update:#C7B6F7;--update-soft:#2C2546;
  --wa:#5FD898;--on-wa:#062414;--good:#72CC80;--bad:#F2907F;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{direction:rtl;max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{flex:none}
/* masthead */
.mast{display:grid;gap:6px;padding-bottom:14px;border-bottom:3px solid var(--ink)}
.mastrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.kicker{font-size:.8rem;letter-spacing:.08em;color:var(--accent);font-weight:700}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.05;margin:0}
.byline{color:var(--muted);max-width:64ch}
.byline strong{color:var(--ink)}
.mastactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.iconbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:40px}
.iconbtn svg{width:18px;height:18px}
/* tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:4px solid transparent;padding:12px 14px;cursor:pointer;color:var(--muted);font-weight:700;white-space:nowrap;font-size:.98rem}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .count{display:inline-block;min-width:1.4em;padding:0 5px;margin-inline-start:4px;border-radius:999px;background:var(--bad);color:var(--surface);font-size:.75rem;line-height:1.5}
/* generic buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:.95rem;text-decoration:none;color:var(--ink);min-height:40px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--on-wa)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:3px 10px;font-size:.85rem;min-height:32px}
.btn svg{width:18px;height:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sub{color:var(--muted);font-size:.93rem}
.mono{font-family:var(--f-mono);font-size:.82rem;font-variant-numeric:tabular-nums}
input[type=text],input[type=search],input[type=url],input[type=date],select,textarea{background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;box-sizing:border-box;min-height:42px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{width:100%;line-height:1.55}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:.8rem;background:var(--surface);white-space:nowrap;font-weight:600}
.chip.h{background:var(--heritage-soft);border-color:transparent;color:var(--heritage)}
.chip.u{background:var(--update-soft);border-color:transparent;color:var(--update)}
.chip.a{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
/* report head + parts */
.reporthead{display:grid;gap:8px;margin-bottom:6px}
.reporthead h2{font-family:var(--f-display);font-size:clamp(1.35rem,3.4vw,1.85rem);margin:0;line-height:1.25;text-wrap:balance}
.overview{max-width:70ch;margin:0}
.part{margin-top:26px}
.parthead{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:12px;flex-wrap:wrap}
.parthead h3{font-family:var(--f-display);font-size:1.4rem;margin:0}
.parthead .sub{margin-inline-start:auto}
.topic{margin-top:18px}
.topic h4{font-size:.85rem;letter-spacing:.05em;color:var(--muted);margin:0 0 8px;font-weight:700}
.empty{color:var(--muted);padding:18px 0}
/* cards */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.nlist{display:grid;gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;align-content:start;min-width:0;scroll-margin-top:70px}
.rcard.heritage{border-inline-start:6px solid var(--heritage)}
.rcard.flash{box-shadow:0 0 0 3px var(--accent)}
.rkind{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:.82rem;color:var(--muted)}
.rkind .k{font-family:var(--f-mono);font-size:.75rem;color:var(--accent);font-weight:500;text-transform:uppercase}
.rtitle{all:unset;cursor:pointer;font-weight:700;font-size:1.12rem;line-height:1.38;color:var(--ink);text-wrap:pretty}
.rtitle:hover{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.rtitle:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.acts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.nlist .acts{max-width:560px}
.mgrid .act{flex-direction:column;gap:4px;min-height:66px;padding:8px 6px}
.mgrid .act svg{width:22px;height:22px}
.sheet .acts{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.act{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 18px;border-radius:10px;font-weight:700;font-size:1rem;border:2px solid transparent;cursor:pointer;text-decoration:none;line-height:1.2}
.act svg{width:20px;height:20px}
.act.a1{background:var(--accent);color:var(--on-accent)}
.act.a2{background:var(--listen-soft);color:var(--listen)}
.act.a3{background:var(--surface);color:var(--ink);border:1.5px solid var(--muted)}
.act:hover{filter:brightness(1.08)}
.act.a3:hover{background:var(--surface-2)}
.act[aria-disabled="true"]{opacity:.35;cursor:not-allowed;filter:none}
.rfoot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.rfoot .badges{display:flex;flex-wrap:wrap;gap:6px}
.rfoot .tools{display:flex;gap:6px;align-items:center;margin-inline-start:auto}
.minibtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 10px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted);min-height:32px}
.minibtn svg{width:15px;height:15px}
.minibtn:hover{color:var(--ink);border-color:var(--ink)}
.minibtn[aria-pressed="true"].up{background:var(--good);color:var(--surface);border-color:var(--good)}
.minibtn[aria-pressed="true"].down{background:var(--bad);color:var(--surface);border-color:var(--bad)}
/* sheet */
.sheet-ov{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,#000 55%,transparent);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.sheet{direction:rtl;background:var(--surface);color:var(--ink);border-radius:14px;width:min(720px,100%);max-height:88vh;overflow:auto;box-sizing:border-box;padding:18px 20px;display:grid;gap:14px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet h3{font-family:var(--f-display);font-size:1.4rem;margin:0;line-height:1.3;text-wrap:balance}
.closebtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--ink)}
.closebtn svg{width:18px;height:18px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 16px;font-weight:700;cursor:pointer;min-height:40px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.readtext{font-size:1.1rem;line-height:1.75;max-width:68ch;margin:0;white-space:pre-line}
.readtext[dir="ltr"]{text-align:left}
.vset{border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.vset summary{display:flex;align-items:center;gap:8px;cursor:pointer;padding:10px 14px;font-weight:700;color:var(--muted);min-height:24px}
.vset summary svg{width:18px;height:18px}
.vset[open] summary{color:var(--ink);border-bottom:1px solid var(--line)}
.vsetbody{display:grid;gap:10px;padding:12px 14px}
.vsetbody select{width:100%}
.vsetbody input[type=range]{width:100%;accent-color:var(--accent)}
.readnote{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.sheet.wide{width:min(960px,100%)}
.bigopen{width:100%;box-sizing:border-box;min-height:62px;font-size:1.12rem}
.chip.new{background:var(--accent);color:var(--on-accent);border-color:transparent}
.minute{background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--accent);border-radius:12px;padding:12px 16px;display:grid;gap:8px}
.minute h3{margin:0;font-size:1rem;font-weight:700}
.minute ol{margin:0;padding-inline-start:1.3em;display:grid;gap:4px}
.minute .mhead{margin:0;font-size:1.05rem;font-weight:600;line-height:1.5}
.mline{all:unset;cursor:pointer;display:inline;line-height:1.6;border-radius:6px;padding:2px 0}
.mline:hover,.mline:focus-visible{text-decoration:underline;text-underline-offset:3px;color:var(--accent)}
.mline:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msrc{font-size:.8rem;color:var(--accent);margin-inline-start:.5em;white-space:nowrap;font-weight:600}
.ailabel{font-size:.86rem;color:var(--muted);margin:0}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.linkbtn:focus-visible{outline:3px solid var(--accent)}
.sharegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.sharegrid .act{width:100%;box-sizing:border-box}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;direction:rtl;font-weight:600;max-width:calc(100% - 32px)}
.disclaimer{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:.86rem;max-width:80ch}
/* tables & panels */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:.92rem}
th,td{text-align:start;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.76rem;letter-spacing:.05em;color:var(--muted);background:var(--surface-2)}
th button{background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit;letter-spacing:inherit}
td.name{font-weight:700;min-width:11rem}
.dots{font-family:var(--f-mono);letter-spacing:1px;color:var(--accent);white-space:nowrap}
.dots i{color:var(--line);font-style:normal}
.inactive{opacity:.5}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.controls input[type=search]{flex:1 1 220px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:12px;max-width:680px}
.panel h3{font-family:var(--f-display);margin:0;font-size:1.3rem}
.field{display:grid;gap:4px}
.field label,.field .lbl{font-size:.86rem;font-weight:700;color:var(--muted)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice label{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{margin-top:5px;accent-color:var(--accent)}
.choice b{display:block}
.prose{max-width:70ch}
.prose h3{font-family:var(--f-display);font-size:1.35rem;margin:1.2em 0 .3em}
.prose p{margin:.4em 0}
/* phones */
@media (max-width:640px){
  body{font-size:17px}
  .mast{gap:4px;padding-bottom:10px}
  .mast .kicker,.mast .byline,#status{display:none}
  h1{font-size:1.5rem}
  .mastrow{align-items:center}
  .iconbtn span{display:none}
  .iconbtn{padding:6px 10px;min-height:42px}
  .mastactions{margin-top:4px}
  .mastactions .btn:not(.primary){display:none}
  .ownerbar .btn:not(.primary){display:none}
  .acts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
  .act{flex-direction:column;gap:4px;min-height:68px;padding:8px 4px;font-size:1.02rem;border-radius:12px}
  .act svg{width:24px;height:24px}
  .rtitle{font-size:1.15rem}
  .mgrid{grid-template-columns:1fr}
  nav.tabs button{padding:14px 12px;font-size:1.02rem}
  .sheet-ov{align-items:flex-end;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-height:92vh;width:100%;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));}
  .sheet .acts .act{min-height:60px}
  .readtext{font-size:1.15rem}
  .choice{grid-template-columns:1fr}
  .mastactions .btn,.mastactions .iconbtn{min-height:46px}
  .btn{min-height:46px}
  .minibtn{min-height:38px;padding:4px 12px}
}
@media (prefers-reduced-motion:no-preference){.rcard{animation:rin .22s ease-out both}@keyframes rin{from{transform:translateY(3px)}to{transform:none}}}

/* ===== Unified button language: light palette, two hues (teal + indigo), soft translucency, linked button stack ===== */
:root:not([data-theme="dark"]){--bg:#F1F3F5;--surface:#FFFFFF;--surface-2:#F7F8FA;--line:#D7DCE1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1317;--surface:#19212A;--surface-2:#141B22;--line:#36434E}}
:root{--hueA:var(--accent);--hueB:var(--listen)}
/* the stack: title + action buttons sit on one tinted rail, so they read as one connected unit */
.stack{position:relative;display:grid;gap:8px;padding:8px;border-radius:14px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--hueA) 7%,transparent),color-mix(in srgb,var(--hueB) 7%,transparent));
  border:1px solid color-mix(in srgb,var(--hueA) 16%,transparent)}
.stack::before{content:"";position:absolute;inset-block:14px;inset-inline-start:-1px;width:3px;border-radius:3px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--hueA) 70%,transparent),color-mix(in srgb,var(--hueB) 60%,transparent))}
/* title as a wide button */
.rtitle{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;cursor:pointer;
  padding:12px 14px;border-radius:10px;font-weight:700;font-size:1.1rem;line-height:1.38;color:var(--ink);text-wrap:pretty;
  background:color-mix(in srgb,var(--surface) 72%,transparent);border:1.5px solid color-mix(in srgb,var(--hueA) 28%,transparent);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .15s,border-color .15s}
.rtitle .tt{flex:1;min-width:0}
.rtitle .tgo{flex:none;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;
  background:color-mix(in srgb,var(--hueA) 14%,transparent);color:var(--hueA)}
.rtitle .tgo svg{width:16px;height:16px}
.rtitle:hover{background:color-mix(in srgb,var(--hueA) 10%,var(--surface));border-color:color-mix(in srgb,var(--hueA) 55%,transparent);text-decoration:none}
.rtitle:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* action buttons: translucent fills in the two hues */
.act{transition:background .15s,border-color .15s,transform .1s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.act:active{transform:scale(.98)}
.act.a1{background:color-mix(in srgb,var(--hueA) 86%,transparent);color:var(--on-accent);border-color:color-mix(in srgb,var(--hueA) 40%,transparent)}
.act.a1:hover{background:var(--hueA);filter:none}
.act.a2{background:color-mix(in srgb,var(--hueB) 13%,transparent);color:var(--hueB);border:1.5px solid color-mix(in srgb,var(--hueB) 26%,transparent)}
.act.a2:hover{background:color-mix(in srgb,var(--hueB) 22%,transparent);filter:none}
.act.a3{background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--ink);border:1.5px solid color-mix(in srgb,var(--hueA) 30%,transparent)}
.act.a3:hover{background:color-mix(in srgb,var(--hueA) 8%,var(--surface))}
.act svg{opacity:.9}

ed for November 10)", "summary_en": "Version 5.3 adds built-in import and rendering of splats, including PLY and Geometry Nodes workflows. The official page still lists November 10 as the release date. This removes the need for third-party add-ons to bring splats into scenes and animation.", "speech_he": "גרסה חדשה של התוכנה Blender 5.3 תתמוך באופן מובנה בשיטה Gaussian Splatting. השחרור מתוכנן לעשרה בנובמבר. הגרסה מוסיפה ייבוא ותצוגה מובנים של splats, כולל עבודה עם קבצי PLY ועם Geometry Nodes. כך לא יהיה צורך בתוספים חיצוניים כדי לשלב splats בסצנות ובאנימציה.", "url": "https://www.aiposthub.com/blender-53-gaussian-splatting-native-preview/", "sourceName": "AI Post Hub", "relevance": 4, "heritage": false, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-21"}, {"id": "2026-10-21-chm-aria", "date": "2026-10-21", "kind": "news", "topicId": "heritage", "title": "מוזיאון היסטוריית המחשב ו-Meta Project Aria: סיור מודרך במשקפי AI להנגשה", "summary": "המוזיאון בקליפורניה בנה עם Project Aria של Meta סיור מוזיאוני במשקפי AI: ניווט בגלריה באמצעות צליל ושאלות חופשיות שנענות מתוך הידע של המוזיאון. הטכנולוגיה צמחה ממחקר עם קהילות עיוורים ולקויי ראייה. הדמו עדיין מחקרי, אבל תערוכת ה-XR של המוזיאון פתוחה לציבור עד מרץ 2027. מודל רלוונטי ישירות להנגשת אתרים לקהל עם מוגבלות ראייה.", "title_en": "Computer History Museum and Meta Project Aria: an AI-glasses guided tour built for accessibility", "summary_en": "The Mountain View museum worked with Meta's Project Aria to build a museum tour on AI glasses: visitors navigate the gallery by sound and ask free-form questions answered from the museum's own knowledge. The technology grew out of research with blind and low-vision communities. The demo is still a research project, but the museum's XR exhibition is open to the public until March 2027. A directly relevant model for making sites accessible to visitors with visual impairments.", "speech_he": "מוזיאון היסטוריית המחשב בקליפורניה בנה עם החברה Meta סיור מודרך במִשְׁקְפֵי בינה מלאכותית, במסגרת הפרויקט Project Aria. המבקר מנווט בגלריה בעזרת צלילים, ושואל שאלות חופשיות שנענות מתוך הידע של המוזיאון. הטכנולוגיה צמחה ממחקר עם קהילות של עִוְּרִים ולִקּוּיֵי רְאִיָּה. ההדגמה עדיין מחקרית, אבל תערוכת המציאות המעורבת של המוזיאון פתוחה לציבור עד מרץ 2027. זה מודל ישיר להַנְגָּשַׁת אתרים לקהל עם מוגבלות ראייה.", "url": "https://computerhistory.org/blog/ai-guided-tour-project/", "sourceName": "Computer History Museum", "relevance": 5, "heritage": true, "discovery": false, "isUpdate": false, "people": ["Kirsten Tashev"], "published": "2026-10-08"}, {"id": "2026-10-21-claude-mods", "date": "2026-10-21", "kind": "news", "topicId": "claude", "title": "Claude Code: מערכת Mods, פורטל לפלאגינים ו-/auto-mode-setup", "summary": "ב-1 באוקטובר נוספו ל-Claude Code ה-Mods: פונקציות TypeScript קטנות שמשנות פרומפטים, מוסיפות ממשק ומחליפות יכולות מובנות. נוסף פורטל להגשת פלאגינים לספריית Claude, ובגרסה 2.1.304 (19 באוקטובר) הגדרה מודרכת ל-auto mode שלומדת את הסביבה שלך. שימושי לבניית סביבת עבודה קבועה לפרויקטי AR.", "title_en": "Claude Code: Mods, a plugin portal and /auto-mode-setup", "summary_en": "On October 1 Claude Code gained Mods: small TypeScript functions that rewrite prompts, add UI and replace built-in features. A portal for submitting plugins to the Claude directory was added, and version 2.1.304 (October 19) brought a guided auto-mode setup that learns your environment. Useful for building a stable workspace for AR projects.", "speech_he": "חידושים בכלי Claude Code. בראשון באוקטובר נוספה מערכת הרחבות בשם Mods. אלה פונקציות קטנות שמשנות הנחיות, מוסיפות ממשק ומחליפות יכולות מובנות. נוסף גם פורטל להגשת תוספים לספרייה הרשמית. בגרסה מהתשעה עשר באוקטובר נוספה הגדרה מודרכת למצב העבודה האוטומטי, שלומדת את סביבת העבודה שלך. זה שימושי לבניית סביבת עבודה קבועה לפרויקטים של מציאות רבודה.", "url": "https://code.claude.com/docs/en/changelog", "sourceName": "Claude Code changelog", "relevance": 4, "heritage": false, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-19"}, {"id": "2026-10-21-claude-webxr-skills", "date": "2026-10-21", "kind": "news", "topicId": "claude", "title": "Skills מוכנים ל-Claude Code לבניית WebXR עם A-Frame", "summary": "בספריות הסקילים הקהילתיות יש כבר כמה Skills ל-A-Frame ו-WebXR (סצנות, hit-test, ממשקי AR) שאפשר להתקין ל-Claude Code בפקודה אחת. נקודת פתיחה טובה לבנייה מהירה של אב-טיפוס AR בדפדפן, אבל כדאי לבדוק את איכות הקוד לפני שימוש.", "title_en": "Ready-made Claude Code Skills for building WebXR with A-Frame", "summary_en": "Community skill libraries already include several A-Frame and WebXR Skills (scenes, hit-test, AR interfaces) that install into Claude Code with one command. A good starting point for quickly prototyping browser AR, though the code quality should be checked before use.", "speech_he": "יכולות מוכנות לכלי Claude Code, לבניית חוויות WebXR עם הספרייה A-Frame. בספריות הקהילתיות כבר יש כמה כאלה, לבניית סצנות וממשקי מציאות רבודה בדפדפן. אפשר להתקין אותן בפקודה אחת. זו נקודת פתיחה טובה לבנייה מהירה של אב טיפוס, אבל כדאי לבדוק את איכות הקוד לפני שימוש.", "url": "https://claudemarketplaces.com/skills/freshtechbro/claudedesignskills/aframe-webxr", "sourceName": "Claude Code Marketplaces", "relevance": 4, "heritage": false, "discovery": true, "isUpdate": false, "people": []}, {"id": "2026-10-21-esri-drone-splats", "date": "2026-10-21", "kind": "news", "topicId": "splats", "title": "Esri מכניסה splats ל-ArcGIS: עיר שלמה מרחפן, ואצטדיון מנתוני רחפן קיימים", "summary": "שני מקרים מאותו שבוע: העיר Gretna בלואיזיאנה צולמה במלואה מהאוויר והפכה ל-splats ב-ArcGIS Reality, ואוניברסיטת Clemson עיבדה מחדש צילומי רחפן ישנים של אצטדיון ל-splat ולרשת ב-Drone2Map בכ-13 שעות. רלוונטי לצנרת הרחפן שלך: עיבוד מחדש של ארכיוני צילום קיימים לתוך סביבת GIS.", "title_en": "Esri brings splats into ArcGIS: a whole city from the air, and a stadium from existing drone imagery", "summary_en": "Two cases from the same week: the city of Gretna, Louisiana was flown in full and turned into splats in ArcGIS Reality, and Clemson University reprocessed old drone imagery of its stadium into a splat and a mesh in Drone2Map in about 13 hours. Relevant to drone pipelines: reprocessing existing photo archives inside a GIS environment.", "speech_he": "החברה Esri מכניסה splats לתוכנה ArcGIS. שני מקרים מאותו שבוע. העיר Gretna שבמדינת לואיזיאנה צולמה במלואה מהאוויר, והפכה ל-splats בתוכנה ArcGIS Reality. האוניברסיטה Clemson עיבדה מחדש צילומי רַחְפָן ישנים של אצטדיון, בכשלוש עשרה שעות. זה רלוונטי לעבודה עם רחפנים: עיבוד מחדש של ארכיוני צילום קיימים בתוך סביבת מערכות מידע גאוגרפי.", "url": "https://radiancefields.com/", "sourceName": "Radiance Fields", "relevance": 5, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Michael Rubloff"], "published": "2026-10-17"}, {"id": "2026-10-21-frontiers-xr-ch", "date": "2026-10-21", "kind": "news", "topicId": "heritage", "title": "Frontiers in Virtual Reality: אוסף מאמרים על יישומי XR מבוססי AI במורשת", "summary": "מאמר העורכים של אוסף 'AI-driven XR applications in cultural heritage' מסכם את הכיוונים המרכזיים: התאמה רגשית של חוויות AR, נרטיבים אינטראקטיביים ושחזורים. האוסף עצמו הוא מקור טוב לקריאה ממוקדת, והעורכים חוקרים פעילים בתחום.", "title_en": "Frontiers in Virtual Reality: a research collection on AI-driven XR in cultural heritage", "summary_en": "The editorial for the collection 'AI-driven XR applications in cultural heritage' summarizes the main directions: emotion-adaptive AR experiences, interactive narratives and reconstructions. The collection itself is a good source for focused reading, and its editors are active researchers in the field.", "speech_he": "אוסף מאמרים חדש בכתב העת Frontiers in Virtual Reality, על יישומי מציאות מעורבת מבוססי בינה מלאכותית במורשת. מאמר העורכים מסכם את הכיוונים המרכזיים: התאמה רגשית של חוויות מציאות רבודה, סיפורים אינטראקטיביים ושחזורים. האוסף עצמו הוא מקור טוב לקריאה ממוקדת, והעורכים חוקרים פעילים בתחום.", "url": "https://www.frontiersin.org/journals/virtual-reality/articles/10.3389/frvir.2026.1990419/full", "sourceName": "Frontiers in Virtual Reality", "relevance": 4, "heritage": true, "discovery": false, "isUpdate": false, "people": ["Eslam Nofal", "Rehab Hammady", "Raffaele De Marco"], "published": "2026-09-25"}, {"id": "2026-10-21-glasses-fall", "date": "2026-10-21", "kind": "news", "topicId": "hardware", "title": "סתיו משקפי XR: Meta VR Glasses, Xreal Aura על Android XR ודליפת המשקפיים של Samsung", "summary": "ב-Meta Connect הוצגו Meta VR Glasses ב-1,299 דולר ודור שלישי ל-Ray-Ban Meta. Xreal Aura על Android XR תימכר ב-1,279 דולר בשבועות הקרובים, ודליפה מ-13 באוקטובר מפרטת את משקפי Samsung (41 גרם, מצלמה 12MP). לאתרי מורשת זה מסמן חלון ריאלי לחוויות AR במשקפיים קלים.", "title_en": "XR glasses season: Meta VR Glasses, Xreal Aura on Android XR, and Samsung's leaked glasses", "summary_en": "Meta Connect introduced Meta VR Glasses at $1,299 and a third-generation Ray-Ban Meta. Xreal Aura on Android XR will sell for $1,279 in the coming weeks, and an October 13 leak details Samsung's glasses (41 g, 12 MP camera). For heritage sites this marks a realistic window for AR experiences on lightweight glasses.", "speech_he": "סתיו של משקפי מציאות מעורבת. בכנס של החברה Meta הוצגו המשקפיים Meta VR Glasses, במחיר של 1,299 דולר, ודור שלישי של המשקפיים Ray-Ban Meta. המשקפיים Xreal Aura, שפועלים על Android XR, יימכרו ב-1,279 דולר בשבועות הקרובים. דליפה מהשלושה עשר באוקטובר מפרטת את משקפי Samsung, במשקל ארבעים ואחד גרם. לאתרי מורשת זה מסמן חלון ריאלי לחוויות מציאות רבודה במשקפיים קלים.", "url": "https://www.tomsguide.com/computing/smart-glasses/xreal-aura-glasses-start-at-usd1-279-and-orders-start-in-coming-weeks", "sourceName": "Tom's Guide", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-07"}, {"id": "2026-10-21-glasses-privacy", "date": "2026-10-21", "kind": "news", "topicId": "hardware", "title": "פרטיות במשקפי AI: הקלטות לא מבוקשות ב-Ray-Ban Meta והצעת איסור בנורווגיה", "summary": "משתמשים דיווחו שמשקפי Ray-Ban Meta שמרו שיחות בלי פקודת הפעלה, ו-Meta טוענת שהבעיה נפתרה. בנורווגיה הוצעה חקיקה שמגבילה משקפי AI במקומות מסוימים, ובהולנד רשתות הפסיקו למכור אותם. שיקול ממשי לכל פריסה של משקפי AI במוזיאונים ובאתרים ציבוריים.", "title_en": "Privacy and AI glasses: unprompted recordings on Ray-Ban Meta and a proposed ban in Norway", "summary_en": "Users reported Ray-Ban Meta glasses saving conversations without a wake word, and Meta says the issue is resolved. Norway proposed legislation restricting AI glasses in certain places, and Dutch retailers stopped selling them. A real consideration for any deployment of AI glasses in museums and public sites.", "speech_he": "פרטיות במִשְׁקְפֵי בינה מלאכותית. משתמשים דיווחו שהמשקפיים Ray-Ban Meta שמרו שיחות בלי פקודת הפעלה, והחברה טוענת שהבעיה נפתרה. בנורווגיה הוצעה חקיקה שמגבילה משקפיים כאלה במקומות מסוימים, ובהולנד רשתות חנויות הפסיקו למכור אותם. זה שיקול ממשי לכל הפעלה של משקפיים כאלה במוזיאונים ובאתרים ציבוריים.", "url": "https://vr.org/ar", "sourceName": "VR.org", "relevance": 3, "heritage": true, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-16"}, {"id": "2026-10-21-iham-accessibility", "date": "2026-10-21", "kind": "news", "topicId": "research", "title": "האם AI משפר נגישות בתיירות מורשת? סקירה ומסגרת IHAM", "summary": "סקירה ב-Information Technology & Tourism מוצאת ש-AI נכנס לאתרי מורשת ומוזיאונים, אבל הנגשה מטופלת באופן לא אחיד וחסרה חשיבה על ממשל ומערכת אקולוגית. המאמר מציע מסגרת לתיווך מכיל בין אדם ל-AI. שימושי לבניית קריטריונים לפיילוט הנגשה.", "title_en": "Does AI improve accessibility in heritage tourism? A review and the IHAM framework", "summary_en": "A review in Information Technology & Tourism finds that AI is entering heritage sites and museums, but accessibility is handled unevenly and lacks thinking about governance and the wider ecosystem. The paper proposes a framework for inclusive human–AI mediation. Useful for building criteria for an accessibility pilot.", "speech_he": "האם בינה מלאכותית משפרת נגישות בתיירות מורשת? סקירה בכתב העת Information Technology and Tourism מוצאת שהבינה המלאכותית נכנסת לאתרי מורשת ולמוזיאונים, אבל הנגישות מטופלת באופן לא אחיד. חסרה חשיבה על ניהול ועל המערכת הרחבה. המאמר מציע מסגרת לתיווך מכיל בין אדם למכונה. זה שימושי לבניית קריטריונים לפִּיילוֹט הַנְגָּשָׁה.", "url": "https://link.springer.com/article/10.1007/s40558-026-00384-0", "sourceName": "Information Technology & Tourism", "relevance": 5, "heritage": true, "discovery": true, "isUpdate": false, "people": []}, {"id": "2026-10-21-inclusive-ai-museums", "date": "2026-10-21", "kind": "news", "topicId": "heritage", "title": "קריטריונים ל-AI מכיל במוזיאונים: מחקר חדש עם ניתוח מקרים", "summary": "מאמר ב-Frontiers in Human Dynamics גוזר קריטריונים ל-AI מכיל בסביבה מוזיאלית ובוחן מקרים כמו מדריך האודיו של הסמיתסוניאן, Clio של מוזיאון לונדון, האוסף הפתוח של הרייקסמוזיאום עם Copilot והסיור הווירטואלי עם אווטאר בבית אנה פרנק. שימושי כמסגרת הערכה לפיילוט הנגשה.", "title_en": "Criteria for inclusive AI in museums: a new study with case analyses", "summary_en": "A paper in Frontiers in Human Dynamics derives criteria for inclusive AI in museum settings and examines cases such as the Smithsonian's AI audio guide, the London Museum's Clio, the Rijksmuseum's open collection with Copilot, and the Anne Frank House's avatar-guided virtual tour. Useful as an evaluation framework for an accessibility pilot.", "speech_he": "קריטריונים לבינה מלאכותית מכילה במוזיאונים. מאמר חדש בכתב העת Frontiers in Human Dynamics גוזר קריטריונים כאלה ובוחן כמה מקרים. ביניהם מדריך האודיו של מוזיאון Smithsonian, העוזר Clio של מוזיאון לונדון, והסיור הווירטואלי עם דמות מונפשת בבית אנה פרנק. זה שימושי כמסגרת הערכה לפִּיילוֹט הַנְגָּשָׁה.", "url": "https://www.frontiersin.org/journals/human-dynamics/articles/10.3389/fhumd.2026.1799182/full", "sourceName": "Frontiers in Human Dynamics", "relevance": 5, "heritage": true, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-19"}, {"id": "2026-10-21-ismar-vr-tourism", "date": "2026-10-21", "kind": "news", "topicId": "research", "title": "מחקר ISMAR 2026: השוואת splats מול רשת בתאומים דיגיטליים לתיירות VR", "summary": "חוקרים מ-TU Berlin ושותפים השוו גרסת 3DGS וגרסת רשת של אותו תאום דיגיטלי באפליקציית תיירות VR ובדקו איכות חוויה ושמישות. מקור לנתונים אמפיריים בדיון splats מול mesh לחוויות קהל.", "title_en": "ISMAR 2026 study: splats versus meshes in digital twins for VR tourism", "summary_en": "Researchers from TU Berlin and partners compared a 3DGS version and a mesh version of the same digital twin in a VR tourism app, testing experience quality and usability. A source of empirical data for the splats-versus-mesh debate in public-facing experiences.", "speech_he": "מחקר שיוצג בכנס ISMAR 2026 משווה בין splats לבין רֶשֶׁת תלת ממדית, בתאומים דיגיטליים לתיירות במציאות מדומה. חוקרים מהאוניברסיטה הטכנית של ברלין בנו שתי גרסאות של אותו תאום דיגיטלי, ובדקו את איכות החוויה ואת קלות השימוש. זה מקור לנתונים אמפיריים בדיון על השיטה המתאימה לחוויות קהל.", "url": "https://arxiv.org/pdf/2608.01969", "sourceName": "arXiv / IEEE ISMAR 2026 Hype-XR", "relevance": 5, "heritage": true, "discovery": false, "isUpdate": false, "people": ["Maximilian Warsinke", "Jan-Niklas Voigt-Antons"]}, {"id": "2026-10-21-lichtfeld", "date": "2026-10-21", "kind": "news", "topicId": "splats", "title": "LichtFeld Studio 0.5.4.1: ייצוא ל-Blender, אימון מתוך רשת ופחות 'רעש' בקצוות", "summary": "הגרסה החדשה של הכלי הפתוח מאפשרת לגרור splats ישירות ל-Blender כ-PLY או SPZ, לאמן תיבת חיתוך חיה שמפחיתה floaters, ולאמן splat מתוך מודל רשת קיים. אפשרות האימון מרשת מעניינת להמרת מודלי פוטוגרמטריה ישנים.", "title_en": "LichtFeld Studio 0.5.4.1: export to Blender, training from a mesh, fewer floaters", "summary_en": "The new version of the open-source tool lets you drag splats straight into Blender as PLY or SPZ, train a live crop box that reduces floaters, and train a splat from an existing mesh. Training from a mesh is interesting for converting older photogrammetry models.", "speech_he": "גרסה חדשה של הכלי הפתוח LichtFeld Studio. אפשר עכשיו לגרור splats ישירות לתוכנה Blender. אפשר לאמן תיבת חיתוך חיה שמפחיתה רעש בקצוות, וגם לאמן מודל מתוך רֶשֶׁת תלת ממדית קיימת. האפשרות האחרונה מעניינת להמרה של מודלי פוטוגרמטריה ישנים.", "url": "https://radiancefields.com/", "sourceName": "Radiance Fields", "relevance": 4, "heritage": false, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-19"}, {"id": "2026-10-21-p-feifei", "date": "2026-10-21", "kind": "media", "topicId": "webxr", "title": "Fei-Fei Li על אינטליגנציה מרחבית ורובוטיקה (a16z)", "summary": "שיחה עם מייסדת World Labs על מודלי עולם ואינטליגנציה מרחבית. רקע חשוב להבנת הרכישה של World Labs על ידי AMD ולכיוון של יצירת עולמות תלת-ממדיים ב-AI.", "title_en": "Fei-Fei Li on spatial intelligence and robotics (a16z)", "summary_en": "A conversation with the founder of World Labs about world models and spatial intelligence. Important background for understanding AMD's acquisition of World Labs and the direction of AI-generated 3D worlds.", "speech_he": "פודקאסט: Fei-Fei Li על אינטליגנציה מרחבית ורובוטיקה. שיחה עם מייסדת החברה World Labs, על מודלים של עולם ועל אינטליגנציה מרחבית. זה רקע חשוב להבנת הרכישה של החברה על ידי AMD, ולכיוון של יצירת עולמות תלת ממדיים בבינה מלאכותית.", "url": "https://a16z.com/podcasts/a16z-show/", "sourceName": "a16z Show", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Fei-Fei Li"], "published": "2026-07-28", "mediaType": "podcast"}, {"id": "2026-10-21-p-mapscaping", "date": "2026-10-21", "kind": "media", "topicId": "research", "title": "MapScaping פרק 271: ענני נקודות חכמים, כשכל נקודה יודעת מה היא", "summary": "פרק פודקאסט על סגמנטציה סמנטית של ענני נקודות. קשור ישירות לשכבת הידע הסמנטית שאתה מפתח לתיעוד תלת-ממדי.", "title_en": "MapScaping episode 271: smart point clouds, where every point knows what it is", "summary_en": "A podcast episode on semantic segmentation of point clouds. Directly related to building a semantic knowledge layer for 3D documentation.", "speech_he": "פודקאסט MapScaping, פרק מאתיים שבעים ואחד: ענני נקודות חכמים, שבהם כל נקודה יודעת מה היא. הפרק עוסק בסיווג סמנטי של ענני נקודות. הוא קשור ישירות לשכבת הידע הסמנטית בתיעוד תלת ממדי.", "url": "https://mapscaping.com/podcasts/", "sourceName": "MapScaping Podcast", "relevance": 4, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Daniel O'Donohue"], "published": "2026-10-01", "mediaType": "podcast"}, {"id": "2026-10-21-p-spatial-realities", "date": "2026-10-21", "kind": "media", "topicId": "hardware", "title": "Spatial Realities: פיתוח למשקפי AI (פרק 134, בגרמנית)", "summary": "פודקאסט גרמני ותיק על XR ומשקפי AI. בפרק הזה שיחה על פיתוח אפליקציות למשקפי AI ועדכוני השוק. מתאים אם גרמנית נוחה לך.", "title_en": "Spatial Realities: developing for AI glasses (episode 134, in German)", "summary_en": "A long-running German podcast on XR and AI glasses. This episode discusses developing apps for AI glasses plus market news. Worth it if you're comfortable with German.", "speech_he": "פודקאסט Spatial Realities, פרק מאה שלושים וארבע, בגרמנית. פודקאסט גרמני ותיק על מציאות מעורבת ועל מִשְׁקְפֵי בינה מלאכותית. בפרק הזה שיחה על פיתוח אפליקציות למשקפיים כאלה, ועדכוני שוק. מתאים אם גרמנית נוחה לך.", "url": "https://podcasts.apple.com/us/podcast/spatial-realities/id1594874758", "sourceName": "Apple Podcasts · Spatial Realities", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Thomas Riedel"], "mediaType": "podcast"}, {"id": "2026-10-21-quest-roomscan", "date": "2026-10-21", "kind": "news", "topicId": "webxr", "title": "Quest 3 הופך סריקות חדרים ל-splats: Room Scan Exporter ו-QuestRoomScan", "summary": "כלי בשם Room Scan Exporter (גרסה 0.3) ממיר את סריקות החדר של Meta Quest 3 ל-splats, וספריית Unity הפתוחה QuestRoomScan 1.0 מוסיפה סריקה בזמן אמת עם צנרת splat. כיוון מעניין ללכידה מהירה של חללים פנימיים במבנים היסטוריים.", "title_en": "Quest 3 turns room scans into splats: Room Scan Exporter and QuestRoomScan", "summary_en": "A tool called Room Scan Exporter (v0.3) converts Meta Quest 3 room scans into splats, and the open-source Unity library QuestRoomScan 1.0 adds real-time scanning with a splat pipeline. An interesting direction for quick capture of interiors in historic buildings.", "speech_he": "המשקפיים Meta Quest 3 הופכים סריקות של חדרים ל-splats. כלי בשם Room Scan Exporter ממיר את סריקות החדר של המשקפיים. ספרייה פתוחה בשם QuestRoomScan מוסיפה סריקה בזמן אמת. זה כיוון מעניין ללכידה מהירה של חללים פנימיים במבנים היסטוריים.", "url": "https://github.com/genesisinteractive/QuestRoomScan/releases/tag/v1.0.0", "sourceName": "GitHub", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-18"}, {"id": "2026-10-21-sceneview-mcp", "date": "2026-10-21", "kind": "news", "topicId": "claude", "title": "SceneView: ערכת פיתוח 3D ו-AR עם שרת MCP שנבנתה במיוחד ל-Claude Code", "summary": "SceneView מציעה ספריית 3D ו-AR ל-Android, iOS ו-Web (כולל WebXR עם anchors ו-hit-test, ו-AR גיאו-מרחבי) ושרת MCP שמתקינים ב-Claude Code בפקודה אחת, כדי ש-Claude יכתוב קוד AR נכון כבר בניסיון הראשון. רלוונטי מאוד לאפליקציית ה-AR שאתה בונה.", "title_en": "SceneView: a 3D and AR SDK with an MCP server built for Claude Code", "summary_en": "SceneView offers a 3D and AR library for Android, iOS and the web (including WebXR with anchors, hit-test and geospatial AR) plus an MCP server you install in Claude Code with one command, so Claude writes correct AR code on the first try. Highly relevant for anyone building an AR app with Claude.", "speech_he": "ערכת הפיתוח SceneView, לתלת ממד ולמציאות רבודה, עם שרת MCP שנבנה במיוחד לכלי Claude Code. הערכה עובדת במכשירי Android, במכשירי iPhone ובדפדפן, כולל WebXR ומציאות רבודה מבוססת מיקום. את השרת מתקינים בפקודה אחת, כדי ש-Claude יכתוב קוד נכון כבר בניסיון הראשון. זה רלוונטי מאוד לאפליקציית המציאות הרבוד eads splats, SuperSplat 3.0", "summary_en": "Radiance Fields' monthly newsletter lists major moves: AMD is acquiring World Labs, Blender is going native, Apple's Photos app supports splats, and SuperSplat 3.0 shipped. Meanwhile MPEG is moving toward a standard for streaming dynamic splats. The picture: splats are becoming an ordinary media format.", "speech_he": "סיכום ספטמבר בעולם ה-splats. הניוזלטר החודשי של Radiance Fields מונה מהלכים גדולים. החברה AMD רוכשת את World Labs. התוכנה Blender עוברת לתמיכה מובנית. אפליקציית התמונות של Apple תומכת בפורמט, והכלי SuperSplat 3.0 יצא. במקביל מתקדם תקן לשידור של מודלים דינמיים. התמונה הכללית: splats הופכים לפורמט מדיה רגיל.", "url": "https://radiancefields.substack.com/p/gaussian-splatting-in-september-2026", "sourceName": "Gaussian Splatting Newsletter", "relevance": 4, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Michael Rubloff"], "published": "2026-10-01"}, {"id": "2026-10-21-v-bcon", "date": "2026-10-21", "kind": "media", "topicId": "splats", "title": "הרצאה מ-Blender Conference 2026: זרימות עבודה פרוצדורליות עם splats", "summary": "הרצאה מ-BCON26 על שילוב splats בעבודה פרוצדורלית ב-Blender. מתאימה במיוחד לקראת שחרור Blender 5.3 עם התמיכה המובנית.", "title_en": "Blender Conference 2026 talk: procedural workflows with splats", "summary_en": "A BCON26 talk on bringing splats into procedural work in Blender. Especially timely ahead of the Blender 5.3 release with native support.", "speech_he": "הרצאה מהכנס Blender Conference 2026, על זרימות עבודה פרוצדורליות עם splats. ההרצאה מתאימה במיוחד לקראת שחרור הגרסה Blender 5.3, עם התמיכה המובנית.", "url": "https://www.youtube.com/watch?v=gVP1FWXJ1P4", "sourceName": "YouTube · Blender", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Sören Schmidt-Clausen"], "published": "2026-09-24", "mediaType": "talk"}, {"id": "2026-10-21-v-claude-build", "date": "2026-10-21", "kind": "media", "topicId": "claude", "title": "Claude Co es. הפיילוט נבנה עם ארגוני העיוורים באיטליה ומשתלב באפליקציית המוזיאון הקיימת. זה אחד הפיילוטים הראשונים שפתוחים לציבור (לא דמו מחקרי), ומודל ישיר להנגשת אתרים ומוצגים בארץ.", "title_en": "Pinacoteca di Brera in Milan: a Ray-Ban Meta glasses tour for blind and low-vision visitors", "summary_en": "Since October 13 visitors to the Brera museum can book Meta and EssilorLuxottica AI glasses that recognize 8 artworks and play an audio description of the composition and details, with orientation guidance between works and access to Be My Eyes. The pilot was built with Italy's blind associations and integrates with the museum's existing app. One of the first such pilots open to the public rather than a research demo, and a direct model for making sites and exhibits accessible.", "speech_he": "מוזיאון Pinacoteca di Brera במילאנו: סיור במִשְׁקְפֵי בינה מלאכותית לעִוְּרִים ולִקּוּיֵי רְאִיָּה. מהשלושה עשר באוקטובר אפשר להזמין במוזיאון את המשקפיים Ray-Ban Meta. הם מזהים שמונה יצירות, ומשמיעים תיאור קולי של הקומפוזיציה ושל הפרטים. הם גם מנחים את המבקר בדרך בין היצירות, ונותנים גישה לשירות Be My Eyes. הפִּיילוֹט נבנה עם ארגוני העיוורים באיטליה. זה אחד הפיילוטים הראשונים שפתוחים לציבור, ומודל ישיר להַנְגָּשַׁת אתרים ומֻצָּגִים בארץ.", "url": "https://about.fb.com/news/2026/10/meta-milans-pinacoteca-di-brera-and-essilorluxottica-expand-access-to-art-through-ai-glasses/", "sourceName": "Meta Newsroom", "relevance": 5, "heritage": true, "discovery": false, "isUpdate": false, "people": ["Maxine Williams"], "published": "2026-10-14"}, {"id": "2026-10-22-claude-code-oct", "date": "2026-10-22", "kind": "news", "topicId": "claude", "title": "Claude Code 2.1.299–2.1.306: סוכני משנה ברקע, רמות Code Review ודחיסת שיחות לא פעילות", "summary": "בשבוע האחרון נוספו דחיסה אוטומטית של שיחות ארוכות שעומדות בהמתנה, סוכני משנה (fork) שפועלים כברירת מחדל ברקע בדסקטופ וב-VS Code, ורמות Quick/Standard/Deep ל-Code Review. נוספו גם אזהרות ב-/usage עם תיקון בלחיצה והרחבות ל-Mods. שיפורים שמקלים על עבודה ארוכה על פרויקט אפליקציה אחד.", "title_en": "Claude Code 2.1.299–2.1.306: background subagents, Code Review levels and idle compaction", "summary_en": "In the past week Claude Code added automatic compaction of long idle conversations, fork subagents that run in the background by default on desktop and in VS Code, and Quick/Standard/Deep levels for Code Review. It also added /usage warnings with one-click fixes and extensions to Mods. Improvements that make long work on a single app project easier.", "speech_he": "עדכונים בכלי Claude Code מהשבוע האחרון. שיחות ארוכות שעומדות בהמתנה נדחסות עכשיו אוטומטית. סוכני משנה פועלים כברירת מחדל ברקע, בגרסה למחשב ובתוסף לעורך הקוד. לבדיקת קוד נוספו שלוש רמות: מהירה, רגילה ומעמיקה. אלה שיפורים שמקלים על עבודה ארוכה על פרויקט אפליקציה אחד.", "url": "https://releasebot.io/updates/anthropic/claude-code", "sourceName": "Releasebot: Anthropic", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-21"}, {"id": "2026-10-22-hesai-kosmo", "date": "2026-10-22", "kind": "news", "topicId": "splats", "title": "Hesai מציגה את Kosmo: סורק כף-יד שמשלב LiDAR עם צילום 8K ליצירת splats", "summary": "Kosmo One משלב LiDAR (טווח 40 מ׳) עם חיישן 8K, ופלטפורמת הענן Kosmo World מפיקה ממנו splats, רשת ומפות עומק מיושרים, עם ייצוא ל-PLY, SOG, OBJ ו-USDZ. היצרנית טוענת לדיוק מילימטרי ולסריקה של חדר 100 מ״ר בכ-15 דקות; מחיר לא פורסם. שילוב גאומטריה מדויקת עם splat מראה רציף הוא בדיוק מה שחסר בתיעוד פנים מבנים היסטוריים.", "title_en": "Hesai unveils Kosmo: a handheld scanner combining LiDAR with 8K capture for splats", "summary_en": "Kosmo One combines LiDAR (40 m range) with an 8K sensor, and the Kosmo World cloud platform produces aligned splats, meshes and depth maps, exporting to PLY, SOG, OBJ and USDZ. The maker claims millimeter accuracy and scanning a 100 m² room in about 15 minutes; no price yet. Combining accurate geometry with a continuous splat appearance is exactly what interior documentation of historic buildings needs.", "speech_he": "החברה Hesai מציגה את Kosmo One, סורק כף יד שמשלב סורק לייזר עם צילום ברזולוציה גבוהה מאוד. פלטפורמת הענן של החברה מפיקה ממנו splats, רֶשֶׁת ומפות עומק מיושרים. היצרנית טוענת לדיוק של מילימטרים, ולסריקה של חדר בגודל מאה מטר רבוע בכחמש עשרה דקות. המחיר עוד לא פורסם. שילוב של גאומטריה מדויקת עם מראה רציף הוא בדיוק מה שחסר בתיעוד פנים של מבנים היסטוריים.", "url": "https://radiancefields.com/hesai-launches-kosmo-lidar-and-8k-capture-system-for-gaussian-splatting", "sourceName": "Radiance Fields", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-15"}, {"id": "2026-10-22-liangzhu-digital", "date": "2026-10-22", "kind": "news", "topicId": "heritage", "title": "אתר המורשת Liangzhu בסין: משקפי AR, מדריך AI ותאום דיגיטלי לניהול האתר", "summary": "באתר הארכאולוגי Liangzhu (מורשת עולמית) מבקרים מסובבים באוויר כלי ירקן וירטואלי במשקפי AR, ומשקפי AI מזהים מוצגים ועונים על שאלות. במקביל, תאום דיגיטלי מדמה סופות וגשמים כדי לאתר נקודות תורפה, ורשת חיישנים קיצרה את זמן התגובה משלושה ימים ל-30 דקות. דוגמה לשילוב בין הנגשה למבקר לבין ניטור ושימור באותה תשתית דיגיטלית.", "title_en": "Liangzhu heritage site in China: AR glasses, an AI guide and a digital twin for site management", "summary_en": "At the Liangzhu archaeological site (World Heritage), visitors rotate a virtual jade object in mid-air with AR glasses, and AI glasses recognize exhibits and answer questions. A digital twin simulates storms and rain to find weak points, and a sensor network cut response time from three days to 30 minutes. An example of visitor accessibility and conservation monitoring sharing one digital infrastructure.", "speech_he": "אתר המורשת Liangzhu בסין משלב מִשְׁקְפֵי מציאות רבודה, מדריך בינה מלאכותית ותְאוֹם דיגיטלי. באתר הארכאולוגי, שהוא אתר מורשת עולמית, מבקרים מסובבים באוויר כלי יַרְקָן וירטואלי. משקפיים חכמים מזהים מֻצָּגִים ועונים על שאלות. במקביל, התאום הדיגיטלי מדמה סופות וגשמים כדי לאתר נקודות תורפה. רשת חיישנים קיצרה את זמן התגובה משלושה ימים לשלושים דקות. זו דוגמה לשילוב בין הַנְגָּשָׁה למבקר לבין ניטור ושימור, באותה תשתית דיגיטלית.", "url": "https://en.gmw.cn/2026-10/20/content_39054906.htm", "sourceName": "Guangming Online (Xinhua)", "relevance": 4, "heritage": true, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-20"}, {"id": "2026-10-22-offlinetools-colmap", "date": "2026-10-22", "kind": "news", "topicId": "splats", "title": "OfflineTools: COLMAP שרץ כולו בדפדפן (WebAssembly ו-WebGPU)", "summary": "גרסת דפדפן חינמית של COLMAP מפיקה מיקומי מצלמה וענן נקודות דליל, הקלט הדרוש לאימון splats, בלי התקנה ובלי להעלות תמונות לשרת. לפי מדידות המפתח, חילוץ התכונות מהיר מ-COLMAP הרגיל. פותח אפשרות לשלב שלב עיבוד ראשוני בתוך אפליקציות web שבונים עם Claude, למשל כלי איסוף מהשטח.", "title_en": "OfflineTools: COLMAP running entirely in the browser (WebAssembly and WebGPU)", "summary_en": "A free browser version of COLMAP produces camera poses and a sparse point cloud, the input needed to train splats, with no installation and no uploading of images to a server. By the developer's measurements, feature extraction is faster than native COLMAP. It opens the possibility of building a first processing step into web apps made with Claude, such as field-collection tools.", "speech_he": "הכלי OfflineTools מריץ את התוכנה COLMAP כולה בדפדפן. זו גרסה חינמית שמפיקה מיקומי מצלמה וענן נקודות, הקלט הדרוש לאימון splats. היא עובדת בלי התקנה ובלי להעלות תמונות לשרת. לפי המפתח, שלב חילוץ התכונות מהיר יותר מהתוכנה הרגילה. זה פותח אפשרות לשלב עיבוד ראשוני בתוך אפליקציות דפדפן שבונים עם Claude, למשל כלי איסוף מהשטח.", "url": "https://radiancefields.com/offlinetools-runs-colmap-in-the-browser-beats-native-sift", "sourceName": "Radiance Fields", "relevance": 3, "heritage": false, "discovery": true, "isUpdate": false, "people": ["Rafael Spring"], "published": "2026-09-15"}, {"id": "2026-10-22-p-latent-thariq", "date": "2026-10-22", "kind": "media", "topicId": "claude", "title": "Latent Space: העידן הבא של Claude Code, עם Thariq Shihipar מ-Anthropic", "summary": "שיחה ארוכה על האופן שבו משתמשים מתקדמים עובדים עם Claude Code: ניסוח בקשות, רמות effort, Mods ו-Projects, והאם CLAUDE.md עוד יהיה נחוץ. מסתיים בדיון על אבטחת סוכנים. כדאי למי שבונה כלים פנימיים עם Claude באופן קבוע.", "title_en": "Latent Space: the next era of Claude Code, with Anthropic's Thariq Shihipar", "summary_en": "A long conversation about how advanced users work with Claude Code: phrasing requests, effort levels, Mods and Projects, and whether CLAUDE.md will still be needed. It ends with a discussion of agent security. Worthwhile for anyone regularly building internal tools with Claude.", "speech_he": "פודקאסט Latent Space: העידן הבא של Claude Code, עם Thariq Shihipar מהחברה Anthropic. שיחה ארוכה על האופן שבו משתמשים מתקדמים עובדים עם הכלי: ניסוח בקשות, רמות מאמץ, הרחבות ופרויקטים. השיחה מסתיימת בדיון על אבטחת סוכנים. כדאי למי שבונה כלים פנימיים עם Claude באופן קבוע.", "url": "https://www.latent.space/p/thariq", "sourceName": "Latent Space", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Thariq Shihipar"], "published": "2026-09-29", "mediaType": "podcast", "duration": "92 דק׳"}, {"id": "2026-10-22-samsung-glasses-nov", "date": "2026-10-22", "kind": "news", "topicId": "hardware", "title": "עדכון: משקפי ה-Android XR של Samsung צפויים לצאת בנובמבר", "summary": "לפי בכיר ב-Samsung שצוטט ב-Korea Herald, המשקפים הראשונים (ללא מסך, עם מצלמה, רמקולים ו-Gemini) יושקו בנובמבר; מחיר ותאריך מדויק עוד לא פורסמו. רישומי FCC כבר הופיעו, והמסגרות מפותחות עם Gentle Monster ו-Warby Parker.", "title_en": "Update: Samsung's Android XR glasses expected in November", "summary_en": "According to a Samsung executive quoted by the Korea Herald, the first glasses (no display, with camera, speakers and Gemini) will launch in November; price and exact date are not yet published. FCC filings have already appeared, and the frames are being developed with Gentle Monster and Warby Parker.", "speech_he": "עדכון: משקפי Samsung למערכת Android XR צפויים לצאת בנובמבר. לפי בכיר בחברה, שצוטט בעיתון Korea Herald, המשקפיים הראשונים יהיו בלי מסך, עם מצלמה, רמקולים והעוזר Gemini. המחיר והתאריך המדויק עוד לא פורסמו. המסגרות מפותחות יחד עם החברות Gentle Monster ו-Warby Parker.", "url": "https://www.androidauthority.com/samsung-smart-glasses-launch-date-3717873/", "sourceName": "Android Authority", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": true, "people": [], "published": "2026-10-01"}, {"id": "2026-10-22-storysplat-25", "date": "2026-10-22", "kind": "news", "topicId": "splats", "title": "StorySplat 2.5: עורך splats מלא, ייצוא סיורי וידאו וסוכן AI שמנוהל דרך WebMCP", "summary": "הגרסה מוסיפה צללים ועננים מ-splats, עורך שמנקה floaters בכל פורמט, ייצוא מסלול סיור ל-MP4 (כולל 360°), ותמיכת VR שיצאה מבטא. החידוש המעניין הוא Scene Agent שמציב נקודות עניין, אודיו ותאורה, וחשוף לסוכני AI בדפדפן דרך WebMCP (עם אישור ידני לפני פרסום). רלוונטי לבניית סיורים וירטואליים מודרכים באתרים מתועדים בלי כתיבת קוד.", "title_en": "StorySplat 2.5: a full splat editor, video tour export and an AI agent driven through WebMCP", "summary_en": "The release adds splat-based shadows and clouds, an editor that cleans floaters in any format, export of tour paths to MP4 (including 360°), and VR support out of beta. The interesting addition is a Scene Agent that places points of interest, audio and lighting, exposed to in-browser AI agents through WebMCP (with manual approval before publishing). Relevant for building guided virtual tours of documented sites without writing code.", "speech_he": "גרסה חדשה של הכלי StorySplat 2.5. נוספו בה עורך שמנקה רעש במודלים, ייצוא של מסלול סיור לסרטון וידאו, ותמיכה במציאות מדומה. החידוש המעניין הוא סוכן בינה מלאכותית שמציב נקודות עניין, אודיו ותאורה. הוא נגיש לסוכנים בדפדפן, עם אישור ידני לפני פרסום. זה רלוונטי לבניית סיורים וירטואליים מודרכים באתרים מתועדים, בלי כתיבת קוד.", "url": "https://radiancefields.com/storysplat-2-5-adds-splat-clouds-light-shadows-and-a-webmcp-scene-agent", "sourceName": "Radiance Fields", "relevance": 4, "heritage": false, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-20"}, {"id": "2026-10-22-uav-splats-venaria", "date": "2026-10-22", "kind": "news", "topicId": "research", "title": "מחקר: תיעוד מורשת מהיר ב-3DGS עם רחפן צרכני (DJI Mini 5 Pro) וכלים חינמיים", "summary": "חוקרי הפוליטכניקו של טורינו תיעדו מזרקה באתר מורשת עולמית Venaria Reale בתהליך גרפי מלא (RealityScan ו-LichtFeld Studio), מצילום ועד מודל ניווט בפחות משעתיים. נמצא שאיכות ה-splat תלויה מאוד במיקומי המצלמה שמזינים לאימון, ו-LichtFeld החינמי הניב תוצאות יציבות יותר מ-Postshot. מתכון מעשי ובעלות נמוכה לתיעוד שטח מהיר.", "title_en": "Study: fast heritage documentation in 3DGS with a consumer drone (DJI Mini 5 Pro) and free tools", "summary_en": "Researchers at Politecnico di Torino documented a fountain at the Venaria Reale World Heritage site with a fully graphical workflow (RealityScan and LichtFeld Studio), from capture to a navigable model in under two hours. Splat quality depended heavily on the camera poses fed into training, and the free LichtFeld gave more stable results than Postshot. A practical, low-cost recipe for rapid field documentation.", "speech_he": "מחקר: תיעוד מורשת מהיר עם רַחְפָן צרכני וכלים חינמיים. חוקרים מטורינו תיעדו מזרקה באתר המורשת העולמית Venaria Reale. הם השתמשו ברחפן DJI Mini 5 Pro ובכלים RealityScan ו-LichtFeld Studio. מהצילום ועד מודל שאפשר לנווט בו עברו פחות משעתיים. נמצא שאיכות המודל תלויה מאוד במיקומי המצלמה שמזינים לאימון. הכלי החינמי הניב תוצאות יציבות יותר מהתוכנה Postshot. זה מתכון מעשי ובעלות נמוכה לתיעוד שטח מהיר.", "url": "https://www.mdpi.com/2571-9408/9/8/328", "sourceName": "MDPI Heritage", "relevance": 5, "heritage": true, "discovery": true, "isUpdate": false, "people": ["Filiberto Chiabrando", "Alessio Martino"], "published": "2026-08-19"}, {"id": "2026-10-22-v-claude-context", "date": "2026-10-22", "kind": "media", "topicId": "claude", "title": "איך לרזות את ההקשר של Claude Code: CLAUDE.md, Skills ו-/doctor", "summary": "סרטון מעשי שמיישם את הנחיות Anthropic להנדסת הקשר: מה להשאיר ב-CLAUDE.md, מה להעביר ל-Skills שנטענים לפי צורך, ואיך לבדוק את ההגדרות עם /doctor. שימושי למי שמתחזק כמה פרויקטים במקביל.", "title_en": "Trimming Claude Code's context: CLAUDE.md, Skills and /doctor", "summary_en": "A practical video applying Anthropic's context-engineering guidance: what to keep in CLAUDE.md, what to move into Skills that load on demand, and how to check your setup with /doctor. Useful for anyone maintaining several projects at once.", "speech_he": "סרטון: איך לצמצם את ההקשר בכלי Claude Code. סרטון מעשי שמיישם את ההנחיות של Anthropic: מה להשאיר בקובץ ההוראות הראשי, מה להעביר ליכולות שנטענות לפי צורך, ואיך לבדוק את ההגדרות. שימושי למי שמתחזק כמה פרויקטים במקביל.", "url": "https://www.youtube.com/watch?v=oz2CwrPV2Rg", "sourceName": "Nate Herk (YouTube)", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Nate Herk"], "published": "2026-10-08", "mediaType": "video", "duration": "12 דק׳"}, {"id": "2026-10-22-v-threejs-cinematic", "date": "2026-10-22", "kind": "media", "topicId": "claude", "title": "בניית אתר תלת-ממדי קולנועי עם Opus 5.5 ו-Three.js", "summary": "הדגמה מלאה של בניית אתר עם מודל GLB, מעברי מצלמה לפי גלילה ואפקטי ריחוף, עד בדיקת מובייל ופריסה. ההדגמה רצה בכלי צד שלישי ולא ב-Claude Code, אבל דפוסי ה-Three.js שבה (טעינת מודל, תנועת מצלמה בגלילה) מתאימים ישירות להצגת ממצאים ואתרים מתועדים באתר.", "title_en": "Building a cinematic 3D website with Opus 5.5 and Three.js", "summary_en": "A full demo of building a site with a GLB model, scroll-driven camera moves and hover effects, through mobile testing and deployment. The demo runs in a third-party tool rather than Claude Code, but its Three.js patterns (model loading, scroll-based camera motion) apply directly to presenting finds and documented sites on the web.", "speech_he": "סרטון: בניית אתר תלת ממדי קולנועי עם Opus 5.5 ו-Three.js. הדגמה מלאה של בניית אתר עם מודל תלת ממדי, מעברי מצלמה לפי גלילה ואפקטים, עד בדיקה בטלפון ופריסה. ההדגמה רצה בכלי חיצוני, אבל הדפוסים שבה מתאימים ישירות להצגת ממצאים ואתרים מתועדים באתר.", "url": "https://www.youtube.com/watch?v=1dvdXWmQXM8", "sourceName": "MiladiCode (YouTube)", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-16", "mediaType": "video", "duration": "משך לא ידוע"}, {"id": "2026-10-22-xr-blocks-022", "date": "2026-10-22", "kind": "news", "topicId": "webxr", "title": "Google XR Blocks 0.22: דוגמאות AI שרצות על המכשיר ותמיכה ראשונית ב-WebGPU", "summary": "הגרסה מוסיפה דוגמאות שרצות מקומית, בהן עוזר מבוסס Gemma 4, כיתוב ותרגום אופליין, שחזור תלת-ממדי מתמונה ועומק מתמונה בודדת. WebGPU עובד רק בסימולטור ועוד לא בממשק המרחבי. תרגום וכיתוב אופליין בתוך חוויית WebXR רלוונטיים במיוחד להנגשה רב-לשונית באתרים בלי קליטה טובה.", "title_en": "Google XR Blocks 0.22: on-device AI samples and early WebGPU support", "summary_en": "The release adds samples that run locally, including a Gemma 4–based assistant, offline captioning and translation, 3D reconstruction from an image, and single-image depth. WebGPU works only in the simulator, not yet in the spatial UI. Offline captioning and translation inside a WebXR experience are especially relevant for multilingual accessibility at sites with poor connectivity.", "speech_he": "גרסה חדשה של ערכת הפיתוח Google XR Blocks. נוספו דוגמאות שרצות על המכשיר עצמו, בהן עוזר חכם, כתוביות ותרגום בלי חיבור לרשת, ושחזור תלת ממדי מתמונה אחת. תמיכה בעיבוד גרפי מתקדם קיימת בינתיים רק בסימולטור. כתוביות ותרגום בלי חיבור לרשת רלוונטיים במיוחד להַנְגָּשָׁה רב לשונית באתרים בלי קליטה טובה.", "url": "https://vr.org/articles/xr-blocks-0-22-0-webgpu-simulator-spatial-ui-gemma-4-2026", "sourceName": "VR.org", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-12"}, {"id": "2026-10-23-agent-skills-aaif", "date": "2026-10-23", "kind": "news", "topicId": "claude", "title": "Anthropic מעבירה את תקן Agent Skills לקרן Agentic AI Foundation שבלינוקס פאונדיישן", "summary": "ב-22 באוקטובר הודיעה Anthropic שהיא תורמת את תקן ה-Skills (תיקייה עם קובץ SKILL.md) לקרן AAIF, שכבר מחזיקה את MCP. למי שבונה Skills ל-Claude זה אומר שמה שנכתב היום יעבוד גם ב-ChatGPT, Cursor, Copilot ו-VS Code, תחת תקן ניטרלי עם תהליך גרסאות מסודר.", "title_en": "Anthropic donates the Agent Skills standard to the Agentic AI Foundation at the Linux Foundation", "summary_en": "On October 22 Anthropic announced it is donating the Skills standard (a folder with a SKILL.md file) to the AAIF, which already hosts MCP. For anyone building skills for Claude, what is written today will also work in ChatGPT, Cursor, Copilot and VS Code, under a neutral standard with an orderly versioning process.", "details": "Anthropic הודיעה ב-22 באוקטובר 2026 שהיא מעבירה את תקן Agent Skills לקרן Agentic AI Foundation, שפועלת תחת Linux Foundation ושייסדו Anthropic, Block ו-OpenAI. Skill הוא תיקייה שבמרכזה קובץ SKILL.md, שמלמדת סוכן משימה או תחום מסוים ויכולה לכלול סקריפטים וחומרי עזר. ההעברה כוללת את התקן, השם והלוגו, ארגון ה-GitHub והדומיין agentskills.io. לפי Anthropic, יותר מ-70 פלטפורמות סוכנים כבר משלבות את התקן, ובהן ChatGPT, Cursor, GitHub Copilot ו-VS Code, ופורסמו כמיליון Skills עם כ-280 מיליון התקנות. הקרן מתכננת גרסאות ממוספרות, תהליך הצעות רשמי והנחיות אבטחה למי שכותב ומתקין Skills. לא מתוארים שינויים באופן שבו Skills קיימים נבנים או רצים. עבור מי שבונה Skills לעבודת תיעוד ומורשת, זו ודאות גבוהה יותר שההשקעה תהיה ניידת בין כלים.", "details_en": "Anthropic announced on October 22, 2026 that it is transferring the Agent Skills standard to the Agentic AI Foundation, which operates under the Linux Foundation and was co-founded by Anthropic, Block and OpenAI. A skill is a folder built around a SKILL.md file that teaches an agent a task or domain and can include scripts and reference material. The transfer covers the standard, the name and logo, the GitHub organization and the agentskills.io domain. According to Anthropic, more than 70 agent platforms already integrate the standard, including ChatGPT, Cursor, GitHub Copilot and VS Code, and about one million skills have been published with nearly 280 million installs. The foundation plans versioned releases, a formal proposal process and security guidance for people who write and install skills. No changes to how existing skills are built or run are described. For anyone building skills for documentation and heritage work, it adds confidence that the investment will be portable across tools.", "speech_he": "החברה Anthropic מעבירה את תקן Agent Skills לקרן ניטרלית. ההודעה פורסמה ב-22 באוקטובר 2026. הקרן נקראת Agentic AI Foundation, והיא פועלת תחת Linux Foundation. היא כבר מחזיקה גם את הפרוטוקול MCP. Skill הוא תיקייה עם קובץ הוראות, שמלמדת סוכן בינה מלאכותית משימה מסוימת. לפי Anthropic, יותר משבעים פלטפורמות כבר תומכות בתקן. ביניהן ChatGPT, Cursor, GitHub Copilot ו-VS Code. פורסמו כמיליון מיומנויות כאלה, עם כ-280 מיליון התקנות. הקרן מתכננת גרסאות ממוספרות, תהליך הצעות מסודר והנחיות אבטחה. לא מתוארים שינויים במיומנויות הקיימות. למי שבונה מיומנויות לעבודת תיעוד ומורשת, זו ודאות שההשקעה תעבוד בכלים רבים.", "speech_en": "Anthropic is handing the Agent Skills standard to a neutral foundation. The announcement came on October 22, 2026. The foundation is the Agentic AI Foundation, which operates under the Linux Foundation. It already hosts the Model Context Protocol. A skill is a folder with an instruction file that teaches an AI agent a specific task. According to Anthropic, more than seventy platforms already support the standard. They include ChatGPT, Cursor, GitHub Copilot and VS Code. About one million skills have been published, with around 280 million installs. The foundation plans versioned releases, a formal proposal process and security guidance. No changes to existing skills are described. For anyone building skills for documentation and heritage work, this means the effort will carry across many tools.", "url": "https://www.anthropic.com/news/donating-agent-skills-to-the-agentic-ai-foundation", "sourceName": "Anthropic", "relevance": 4, "heritage": false, "discovery": false, "isUpdate": false, "people": ["David Soria Parra", "Mahesh Murag"], "published": "2026-10-22", "readTime": "3 דק׳"}, {"id": "2026-10-23-bavart-sncf-memorial-ar", "date": "2026-10-23", "kind": "news", "topicId": "heritage", "title": "תחנות רכבת בצרפת כשער לאתרי זיכרון: 50 נקודות AR עם שמע וחידון בארבע שפות", "summary": "BavAR[t], משרד הכוחות המזוינים הצרפתי ו-SNCF מציבים בתחנות רכבת תערוכות צילום עם חוויות AR שמובילות לאתרי זיכרון סמוכים, והשלב בטולון נפתח באוקטובר 2026. מודל מעניין לחיבור בין מרחב ציבורי עמוס לאתר מורשת, בצרפתית, אנגלית, ספרדית וגרמנית.", "title_en": "French train stations as gateways to memorial sites: 50 AR points with audio and quizzes in four languages", "summary_en": "BavAR[t], the French Ministry of Armed Forces and SNCF place photo exhibitions with AR experiences in train stations that lead to nearby memorial sites; the Toulon phase opened in October 2026. An interesting model for linking a busy public space to a heritage site, in French, English, Spanish and German.", "details": "BavAR[t] מפעילה עם משרד הכוחות המזוינים של צרפת ועם SNCF Gares & Connexions תוכנית של חוויות מציאות רבודה חינמיות בתחנות רכבת. בכל תחנה מוצבת תערוכת צילום פיזית, וחוויית ה-AR מרחיבה אותה ומקשרת לאתר זיכרון סמוך. התוכנית כוללת 50 נקודות עניין דיגיטליות, ובכל אחת אנימציית AR, שמע, חידון וטקסט תיאורי, בצרפתית, אנגלית, ספרדית וגרמנית. התחנות הן Lyon-Part-Dieu, Saint-Raphaël, Verdun, Toulon שנפתחה באוקטובר 2026, ו-Strasbourg שמתוכננת למרץ 2027, עם אתרי זיכרון כמו כלא Montluc ו-Natzweiler-Struthof. הכתבה ב-Auganix פורסמה ביולי 2026 ואינה מבהירה אם מדובר ב-WebAR או באפליקציה ייעודית. המודל של שער במרחב תחבורה ציבורית שמוביל לאתר מורשת יכול להתאים גם לתחנות ומרכזי מבקרים בישראל.", "details_en": "BavAR[t] runs a programme of free augmented reality experiences in train stations with the French Ministry of Armed Forces and SNCF Gares & Connexions. Each station hosts a physical photo exhibition, and the AR experience extends it and links to a nearby memorial site. The programme has 50 digital points of interest, each with an AR animation, audio, a quiz and descriptive text, in French, English, Spanish and German. The stations are Lyon-Part-Dieu, Saint-Raphaël, Verdun, Toulon, which opened in October 2026, and Strasbourg, planned for March 2027, with memorials such as Montluc Prison and Natzweiler-Struthof. The Auganix article was published in July 2026 and does not say whether it is WebAR or a dedicated app. The idea of a gateway in a public transport hub that leads to a heritage site could also suit stations and visitor centres in Israel.", "speech_he": "תחנות רכבת בצרפת הופכות לשער לאתרי זיכרון, בעזרת מציאות רבודה. התוכנית מופעלת על ידי החברה BavArt, משרד הכוחות המזוינים הצרפתי ורשות התחנות של SNCF. בכל תחנה מוצבת תערוכת צילום, וחוויית מציאות רבודה מקשרת אותה לאתר זיכרון סמוך. יש בתוכנית חמישים נקודות עניין, ובכל אחת אנימציה, שמע, חידון וטקסט. התוכן זמין בצרפתית, אנגלית, ספרדית וגרמנית. השלב בתחנה בעיר Toulon נפתח באוקטובר 2026. השלב בעיר Strasbourg מתוכנן למרץ 2027. לא ברור מהכתבה אם החוויה עובדת בדפדפן או באפליקציה ייעודית. רעיון השער בתחנת תחבורה ציבורית יכול להתאים גם לאתרים בישראל.", "speech_en": "Train stations in France are becoming gateways to memorial sites through augmented reality. The program is run by BavArt, the French Ministry of Armed Forces and SNCF station services. Each station hosts a photo exhibition, and an augmented reality experience links it to a nearby memorial. There are fifty points of interest, each with an animation, audio, a quiz and text. Content is available in French, English, Spanish and German. The Toulon station phase opened in October 2026. The Strasbourg phase is planned for March 2027. The article does not say whether it runs in the browser or in a dedicated app. The gateway idea, in a public transport hub, could also suit heritage sites in Israel.", "url": "https://www.auganix.org/ar-news-bavart-sncf-memorial-experiences/", "sourceName": "Auganix", "relevance": 4, "heritage": true, "discovery": true, "isUpdate": false, "people": [], "published": "2026-07-14", "readTime": "3 דק׳"}, {"id": "2026-10-23-chm-xr-demo-days", "date": "2026-10-23", "kind": "news", "topicId": "heritage", "title": "עדכון: מוזיאון היסטוריית המחשב פותח חמש שבתות הדגמה של XR ומשקפי AI, החל מ-24 באוקטובר", "summary": "המוזיאון פרסם לוח של חמש שבתות הדגמה מעשית בתערוכת ה-XR, מ-24 באוקטובר 2026 ועד 2 בינואר 2027. לפי דיווח של Runtime Wire, Meta תאפשר בהן לנסות את משקפי ה-AI שלה עם קריינות שכתבו האוצרים, בעוד שסיור ההנגשה עם Project Aria נשאר מחקר סגור לציבור.", "title_en": "Update: Computer History Museum opens five XR and AI-glasses demo Saturdays, starting October 24", "summary_en": "The museum published a schedule of five hands-on demo Saturdays in its XR exhibition, from October 24, 2026 to January 2, 2027. According to Runtime Wire, Meta will let visitors try its AI glasses with curator-written narration, while the accessible Project Aria tour remains a research project closed to the public.", "details": "מה שהשתנה מאז הדיווח הקודם: המוזיאון פרסם לוח הדגמות מעשיות בתערוכה Extended Reality: Visions of the Future. ההדגמות יתקיימו בין 13:00 ל-16:00 בחמש שבתות: 24 באוקטובר, 7 ו-21 בנובמבר, 19 בדצמבר ו-2 בינואר 2027, וההשתתפות מגיל 13. לפי דיווח של Runtime Wire, Meta הודיעה שבימים אלה יוכלו מבקרים לנסות את משקפי ה-AI שלה עם קריינות שכתבו האוצרים ושאלות בדיבור, כשמצלמת המכשירים מנוטרלת ולא נשמר מידע. דף המוזיאון עצמו מזכיר את Ray-Ban Meta ואת מכשירי Aria כחלק מהתערוכה, אך אינו מפרט שהם זמינים לניסוי. סיור ההנגשה שנבנה עם Project Aria נשאר בשלב מחקר ואינו פתוח לציבור. זהו צעד ביניים חשוב, ממחקר סגור לניסוי עם קהל רחב, וכדאי לעקוב אחרי המשוב שיתקבל.", "details_en": "What changed since the previous report: the museum published a schedule of hands-on demonstrations in the exhibition Extended Reality: Visions of the Future. Demos run from 1 to 4 pm on five Saturdays: October 24, November 7 and 21, December 19 and January 2, 2027, for visitors aged 13 and up. According to Runtime Wire, Meta announced that visitors will be able to try its AI glasses on these days, with curator-written narration and spoken questions, with cameras disabled and no data recorded. The museum's own page mentions Ray-Ban Meta glasses and Aria devices as part of the exhibition but does not say they are available to try. The accessible tour built with Project Aria remains a research project and is not open to the public. It is an important intermediate step, from closed research to testing with a wide audience, and the feedback is worth following.", "speech_he": "עדכון ממוזיאון היסטוריית המחשב בקליפורניה. המוזיאון פרסם לוח של חמש שבתות הדגמה בתערוכת המציאות המעורבת. ההדגמה הראשונה תתקיים ב-24 באוקטובר, והאחרונה ב-2 בינואר 2027. ההדגמות מתקיימות בין אחת לארבע אחר הצהריים, מגיל 13 ומעלה. לפי דיווח באתר Runtime Wire, החברה Meta תאפשר בהן לנסות את משקפי הבינה המלאכותית שלה. המבקרים ישמעו קריינות שכתבו אוצרי המוזיאון, ויוכלו לשאול שאלות בדיבור. לפי הדיווח, המצלמה במשקפים מנוטרלת ולא נשמר מידע. דף המוזיאון עצמו לא מפרט שהמשקפים זמינים לניסוי. סיור הַנְגָּשָׁה שנבנה עם Project Aria נשאר בשלב מחקר, וסגור לציבור. זה צעד ביניים חשוב, ממחקר סגור לניסוי עם קהל רחב.", "speech_en": "Update from the Computer History Museum in California. The museum published a schedule of five Saturday demo days in its extended reality exhibition. The first is on October 24, and the last on January 2, 2027. Demos run from one to four in the afternoon, for visitors aged thirteen and up. According to Runtime Wire, Meta will let visitors try its AI glasses during these sessions. Visitors will hear narration written by the museum's curators and can ask questions by voice. According to the report, the cameras are disabled and no data is recorded. The museum's own page does not say the glasses are available to try. The accessible tour built with Project Aria remains a research project, closed to the public. It is an important step from closed research to testing with a wide audience.", "url": "https://runtimewire.com/article/meta-ai-glasses-computer-history-museum-xr-exhibition", "sourceName": "Runtime Wire / Computer History Museum", "relevance": 3, "heritage": true, "discovery": false, "isUpdate": true, "people": [], "published": "2026-10-21", "readTime": "3 דק׳"}, {"id": "2026-10-23-euromed2026-online", "date": "2026-10-23", "kind": "news", "topicId": "heritage", "title": "EuroMed2026: כנס מורשת דיגיטלית מקוון וחינמי ב-2–4 בנובמבר, הרשמה עד 28 באוקטובר", "summary": "הכנס הבינלאומי ה-11 למורשת דיגיטלית, שמארגנת קתדרת UNESCO למורשת תרבות דיגיטלית בקפריסין, יתקיים כולו ברשת ובחינם, עם נושאים כמו לכידת נתונים, גרפי ידע ויישומי XR למורשת. הזדמנות זולה לצוות להתעדכן במה שקורה באירופה, וההרשמה נסגרת ב-28 באוקטובר.", "title_en": "EuroMed2026: a free online digital heritage conference on November 2–4, registration by October 28", "summary_en": "The 11th international digital heritage conference, organized by the UNESCO Chair on Digital Cultural Heritage in Cyprus, will be fully online and free, covering data capture, knowledge graphs and XR applications for heritage. A low-cost way for the team to keep up with European work; registration closes on October 28.", "details": "EuroMed2026 הוא הכנס הבינלאומי ה-11 למורשת דיגיטלית, והוא יתקיים ב-2 עד 4 בנובמבר 2026 באופן מקוון מלא, לפי שעון קפריסין. ההשתתפות חינמית אך מחייבת הרשמה דרך Crowdcast, והמועד הרגיל להרשמה הוא 28 באוקטובר. נושאי הכנס כוללים לכידת נתונים איכותית והוליסטית, מערכות ניהול ידע וגרפי ידע, עולמות וירטואליים ויישומי VR, MR ו-XR, ושימוש בטכנולוגיה נגד סחר לא חוקי בעתיקות. הכנס מציג גם מעבר מרעיון התאום הדיגיטלי לרעיון ה-MemoryTwin וכלכלה מעגלית של ידע בתיעוד מורשת. נאום הפתיחה יינתן על ידי David Frank Bugeja מ-Heritage Malta, והמאמרים שיתקבלו יפורסמו בסדרת LNCS של Springer. התוכנייה המפורטת עוד לא פורסמה, ולא צוין אם ההרצאות יוקלטו. לצוות גיאואינפורמטיקה זו דרך פשוטה להתעדכן בעבודה האירופית, ואולי להציג בכנסים הבאים.", "details_en": "EuroMed2026 is the 11th International Conference on Digital Heritage and will take place fully online on November 2–4, 2026, on Cyprus time. Attendance is free but requires registration through Crowdcast, with a standard deadline of October 28. Themes include high-quality holistic data acquisition, knowledge management systems and knowledge graphs, virtual worlds and VR, MR and XR applications, and the use of technology against illicit trafficking in antiquities. The conference also presents a shift from the Digital Twin to the MemoryTwin and a circular economy of knowledge in heritage documentation. The keynote will be given by David Frank Bugeja of Heritage Malta, and accepted papers will appear in Springer's LNCS series. The detailed program has not yet been published, and it is not stated whether talks will be recorded. For a geoinformatics team it is an easy way to follow European work, and perhaps to present at future editions.", "speech_he": "כנס מורשת דיגיטלית בינלאומי יתקיים ברשת ובחינם, בתחילת נובמבר. הכנס נקרא EuroMed2026, ומארגנת אותו קתדרת UNESCO למורשת דיגיטלית בקפריסין. הוא יתקיים בין השני לרביעי בנובמבר 2026. ההשתתפות חינמית, אבל צריך להירשם עד 28 באוקטובר. בין הנושאים יש לכידת נתונים, גרפי ידע ועולמות וירטואליים. נושא נוסף הוא שימוש בטכנולוגיה נגד סחר לא חוקי בעתיקות. הכנס מציע מעבר מהרעיון של תְאוֹם דיגיטלי לרעיון חדש שנקרא MemoryTwin. נאום הפתיחה יינתן על ידי נציג של הארגון Heritage Malta. התוכנייה המלאה עוד לא פורסמה, ולא ידוע אם ההרצאות יוקלטו. זו דרך פשוטה לצוות להתעדכן בעבודה האירופית בתחום.", "speech_en": "An international digital heritage conference will take place online and free of charge in early November. It is called EuroMed2026 and is organized by the UNESCO Chair on Digital Cultural Heritage in Cyprus. It runs from November 2 to 4, 2026. Attendance is free, but registration closes on October 28. Topics include data capture, knowledge graphs and virtual worlds. Another topic is the use of technology against illicit trafficking in antiquities. The conference proposes a shift from the digital twin to a new idea called the MemoryTwin. The keynote will be given by a representative of Heritage Malta. The full program has not been published, and it is not known whether talks will be recorded. It is an easy way for the team to keep up with European work in the field.", "url": "https://euromed2026.eu/", "sourceName": "EuroMed2026 / UNESCO Chair MNEMOSYNE", "relevance": 4, "heritage": true, "discovery": false, "isUpdate": false, "people": ["David Frank Bugeja"], "readTime": "3 דק׳"}, {"id": "2026-10-23-lewis-unearthed-ar", "date": "2026-10-23", "kind": "news", "topicId": "heritage", "title": "אפליקציית AR קהילתית באיי ההברידים משחזרת 5,000 שנות היסטוריה באתר Loch an Dùin", "summary": "לאפליקציה החינמית Outer Hebrides Unearthed נוסף פרק חדש, Lewis Unearthed, עם שחזורים בגודל טבעי של מבנים וחללי הפנים שלהם באי הקטן Loch an Dùin, מהתקופה הנאוליתית ועד ימי הביניים. היוזמה הגיעה מארגון קהילתי מקומי שעבד עם מכון הארכאולוגיה של UHI, מודל מעניין לשיתוף קהילה בהנגשת אתר קטן ומרוחק.", "title_en": "Community-led AR app in the Outer Hebrides reconstructs 5,000 years at Loch an Dùin", "summary_en": "The free Outer Hebrides Unearthed app gained a new chapter, Lewis Unearthed, with life-sized reconstructions of buildings and their interiors on the islet of Loch an Dùin, from the Neolithic to the medieval period. The initiative came from a local community organisation working with the UHI Archaeology Institute, an interesting model for involving a community in making a small, remote site accessible.", "details": "Lewis Unearthed הוא פרק חדש באפליקציה החינמית Outer Hebrides Unearthed, שהושק בסוף ספטמבר 2026 באירוע קהילתי בכפר Point ובסיור באתר. החוויה מציגה במציאות רבודה שחזורים בגודל טבעי של מבנים ושל חללי הפנים שלהם באי הקטן L
