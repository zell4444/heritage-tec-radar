och an Dùin שבאי Lewis, ומראה איך השתמשו באתר מהתקופה הנאוליתית, דרך תקופת הברזל ועד ימי הביניים. לשחזורים נוספו אפקטים קוליים כמו אש מפצפצת כדי להעצים את תחושת המקום. את הפיתוח הובילו ד״ר Rebecca Rennell וד״ר Emily Gal ממכון הארכאולוגיה של UHI, על בסיס המחקר של Carol Knott. הייחוד הוא שהיוזמה הגיעה מהקהילה: Point and Sandwick Trust ואגודת המורשת המקומית יזמו והובילו את השותפות, וכבר הוצע אתר נוסף לשלב הבא. הכתבה אינה מפרטת שפות, התאמות נגישות או מקורות מימון. הפרויקט ממשיך סדרה עטורת פרסים ומראה איך אפליקציה אחת יכולה לגדול אתר אחר אתר, מודל רלוונטי לאתרים קטנים ומרוחקים.", "details_en": "Lewis Unearthed is a new chapter in the free Outer Hebrides Unearthed app, launched in late September 2026 at a community event in Point followed by a site visit. The experience uses augmented reality to show life-sized reconstructions of buildings and their interiors on the islet of Loch an Dùin on Lewis, showing how the site was used from the Neolithic through the Iron Age to medieval times. Sound effects such as a crackling fire add to the sense of place. Development was led by Dr Rebecca Rennell and Dr Emily Gal of the UHI Archaeology Institute, based on research by Carol Knott. What stands out is that the initiative came from the community: the Point and Sandwick Trust and the local heritage society initiated and led the partnership, and a second site has already been proposed for a future phase. The article does not describe languages, accessibility features or funding. The project continues an award-winning series and shows how one app can grow site by site, a model relevant to small, remote sites.", "speech_he": "אפליקציית מציאות רבודה קהילתית באיי ההברידים משחזרת 5,000 שנות היסטוריה. פרק חדש בשם Lewis Unearthed נוסף לאפליקציה החינמית Outer Hebrides Unearthed. הוא הושק בסוף ספטמבר 2026 באירוע קהילתי ובסיור באתר. החוויה מציגה שחזורים בגודל טבעי של מבנים ושל חללי הפנים שלהם. השחזורים ממוקמים באי הקטן Loch an Dùin שבסקוטלנד. הם מראים איך השתמשו באתר מהתקופה הנאוליתית ועד ימי הביניים. לשחזורים נוספו צלילים, כמו אש מפצפצת, כדי להעצים את תחושת המקום. את הפיתוח הובילו חוקרות ממכון הארכאולוגיה של UHI. היוזמה הגיעה מהקהילה המקומית, שהובילה את השותפות מההתחלה. כבר הוצע אתר נוסף לשלב הבא. הכתבה לא מפרטת שפות, התאמות הַנְגָּשָׁה או מימון. זהו מודל מעניין לאתרים קטנים ומרוחקים, שגדל אתר אחר אתר.", "speech_en": "A community-led augmented reality app in the Outer Hebrides reconstructs five thousand years of history. A new chapter called Lewis Unearthed was added to the free Outer Hebrides Unearthed app. It launched in late September 2026 with a community event and a site visit. The experience shows life-sized reconstructions of buildings and their interiors. The reconstructions are placed at Loch an Dùin, a small islet in Scotland. They show how the site was used from the Neolithic to the medieval period. Sound effects, such as a crackling fire, add to the sense of place. Researchers from the UHI Archaeology Institute led the development. The initiative came from the local community, which led the partnership from the start. A second site has already been proposed for the next phase. The article does not mention languages, accessibility features or funding. It is a useful model for small, remote sites that can grow one site at a time.", "url": "https://archaeologyorkney.com/2026/10/05/lewis-unearthed/", "sourceName": "Archaeology Orkney (UHI)", "relevance": 5, "heritage": true, "discovery": false, "isUpdate": false, "people": ["Rebecca Rennell", "Emily Gal"], "published": "2026-10-05", "readTime": "3 דק׳"}, {"id": "2026-10-23-painterly-splat", "date": "2026-10-23", "kind": "news", "topicId": "splats", "title": "Painterly Splat: כלי דפדפן בקוד פתוח שמצייר סריקות splats במשיכות מכחול", "summary": "כלי חדש מרנדר סריקות splats אמיתיות כמשיכות מכחול וקווי מתאר, כשכל גאוסיאן מקבל אחד מ-18 סוגי מכחולים לפי צורתו ובהירותו. מעניין לפרשנות ויזואלית במוזיאונים ולהצגת שחזורים משוערים בסגנון שמבדיל אותם מתיעוד מדויק.", "title_en": "Painterly Splat: an open-source browser tool that paints splat scans as brush strokes", "summary_en": "A new tool renders real splat scans as brush strokes and line art, assigning each Gaussian one of 18 brush types by shape and brightness. Interesting for visual interpretation in museums and for presenting estimated reconstructions in a style that sets them apart from precise documentation.", "details": "Painterly Splat פותח על ידי Michael Culleton, טכנולוג יצירתי, ופורסם ב-GitHub; הדמו עלה בסוף ספטמבר והכתבה ב-22 באוקטובר 2026. הכלי מתאים לכל גאוסיאן אחת מ-18 משפחות מכחולים לפי הצורה המוקרנת, הרוחב, האטימות והבהירות, ומציע ארבעה מצבים: splats, היברידי, מכחול וקווים. שכבת קווי המתאר מבוססת על זיהוי קצוות Canny ומשתנה עם זווית הצפייה, ואינה רשת משוחזרת. יש גם סמן תלת-ממדי שקובע מישור מיקוד עם עדשות מדומות בין 35 ל-135 מ״מ. הכלי פותח קובצי PLY, splat ו-ksplat עד 1.5 ג׳יגה-בייט במחשבים חזקים, והקבצים לא מועלים לשרת. הרישיון לא צוין בכתבה. במוזיאון או באתר, סגנון ציורי כזה יכול לסמן לקהל מה הוא תיעוד ומה פרשנות, ולהפוך סריקה טכנית לחוויה אמנותית.", "details_en": "Painterly Splat was created by creative technologist Michael Culleton and published on GitHub; the demo went up in late September and the article on October 22, 2026. The tool matches each Gaussian to one of 18 brush families by projected shape, width, opacity and luminance, and offers four modes: splats, hybrid, brush and lines. The line-art pass uses Canny edge detection and changes with the viewing angle, rather than coming from a reconstructed mesh. A 3D cursor sets a focal plane with simulated lenses from 35 to 135 mm. It opens PLY, splat and ksplat files up to 1.5 GB on capable desktops, and files are not uploaded. The license is not stated in the article. In a museum or at a site, a painterly style can signal to visitors what is documentation and what is interpretation, and turn a technical scan into an artistic experience.", "speech_he": "כלי חדש בשם Painterly Splat מצייר סריקות Gaussian Splatting במשיכות מכחול. את הכלי פיתח הטכנולוג Michael Culleton, והקוד שלו זמין ברשת. כל נקודה בסריקה מקבלת אחד משמונה עשר סוגי מכחולים, לפי הצורה והבהירות שלה. יש ארבעה מצבי תצוגה, ביניהם מכחול וקווי מתאר. קווי המתאר משתנים לפי זווית הצפייה. אפשר גם לקבוע מישור מיקוד, כמו בעדשת מצלמה. הכלי עובד בדפדפן, והקבצים לא עולים לשרת. במוזיאון, סגנון ציורי כזה יכול להבדיל בין תיעוד מדויק לבין פרשנות או שחזור משוער.", "speech_en": "A new tool called Painterly Splat renders Gaussian Splatting scans as brush strokes. It was created by creative technologist Michael Culleton, and the code is available on GitHub. Each point in the scan gets one of eighteen brush types, based on its shape and brightness. There are four display modes, including brush and line art. The line art changes with the viewing angle. You can also set a focal plane, like a camera lens. The tool runs in the browser, and files are not uploaded. In a museum, a painterly style can separate precise documentation from interpretation or estimated reconstruction.", "url": "https://radiancefields.com/painterly-splat-paints-gaussian-splat-scans-in-the-browser", "sourceName": "Radiance Fields", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Michael Culleton", "Michael Rubloff"], "published": "2026-10-22", "readTime": "2 דק׳"}, {"id": "2026-10-23-portyl-pompeii-ar", "date": "2026-10-23", "kind": "news", "topicId": "heritage", "title": "פומפיי במציאות רבודה: אפליקציית Portyl משחזרת את העיר לפני ההתפרצות", "summary": "הפארק הארכאולוגי של פומפיי השיק ביוני 2026 את Portyl, אפליקציה שמזהה את מיקום המבקר ב-GPS ומציגה במקום שחזורים של מבנים, אנשים וחיי יום-יום לפני שנת 79. מקרה בוחן חשוב: שילוב LiDAR, פוטוגרמטריה ו-AI גנרטיבי, מודל תמחור היברידי, השכרת טאבלטים וגישה גם מרחוק.", "title_en": "Pompeii in AR: the Portyl app reconstructs the city before the eruption", "summary_en": "The Archaeological Park of Pompeii launched Portyl in June 2026, an app that detects the visitor's position by GPS and overlays reconstructions of buildings, people and daily life before 79 AD. An important case study: LiDAR, photogrammetry and generative AI combined, a hybrid pricing model, tablet rental and remote access.", "details": "Portyl פותחה על ידי Histoury Inc. עבור הפארק הארכאולוגי של פומפיי, בשיתוף אוניברסיטת סלרנו, הפוליטכניון של מילאנו ואוניברסיטת קיל. השחזורים מבוססים על סריקות LiDAR ופוטוגרמטריה מדויקות של כל אתר ועל מחקר ארכאולוגי, ונעזרים ב-AI גנרטיבי להוספת אנשים, בעלי חיים ופעילות יומיומית. האפליקציה משתמשת ב-geofencing מבוסס GPS כדי לזהות היכן המבקר עומד ולהציג את השחזור במקום, ואפשר להשתמש בה גם מרחוק. האתרים הראשונים כוללים את בית נגן הלירה, הפורום, התיאטרון הגדול, האודיאון והאמפיתיאטרון, לצד מופעים וירטואליים ושחזור ההתפרצות. ההורדה חינמית דרך קודי QR בכניסות, חלק מהמסלולים נשארו חינמיים, הגישה המלאה עולה 15 אירו ואפשר לשכור טאבלט ב-20 אירו. הכתבה אינה מפרטת שפות או התאמות נגישות בתוך האפליקציה, אף שבאתר עצמו מתבצעת עבודת הסרת מחסומים. זהו אחד הפרויקטים הגדולים של AR מבוסס מיקום באתר מורשת, ומודל התמחור והשכרת המכשירים רלוונטי לתכנון אפליקציה לאתר בישראל.", "details_en": "Portyl was developed by Histoury Inc. for the Archaeological Park of Pompeii, with the University of Salerno, the Polytechnic University of Milan and Kiel University. The reconstructions are based on precise LiDAR and photogrammetry scans of each site and on archaeological research, with generative AI adding people, animals and daily activity. The app uses GPS-based geofencing to detect where the visitor stands and show the reconstruction in place, and it can also be used remotely. The first sites include the House of the Lyre Player, the Forum, the Great Theater, the Odeon and the Amphitheater, along with virtual performances and a recreation of the eruption. Download is free via QR codes at the entrances, some routes remain free, full access costs 15 euros and tablets can be rented for 20 euros. The article does not describe languages or accessibility features within the app, although barrier-removal work is under way on the site itself. It is one of the largest location-based AR projects at a heritage site, and its pricing and device-rental model is relevant to planning an app for an Israeli site.", "speech_he": "פומפיי במציאות רבודה. האפליקציה Portyl משחזרת את העיר לפני ההתפרצות. הפארק הארכאולוגי של פומפיי השיק אותה ביוני 2026. את האפליקציה פיתחה החברה Histoury, בשיתוף שלוש אוניברסיטאות מאיטליה ומגרמניה. השחזורים מבוססים על סריקות לייזר ופוטוגרמטריה מדויקות של כל אתר ועל מחקר ארכאולוגי. בינה מלאכותית גנרטיבית מוסיפה אנשים, בעלי חיים וחיי יום יום. האפליקציה מזהה את מיקום המבקר בעזרת GPS ומציגה את השחזור בדיוק במקום. אפשר להשתמש בה גם מרחוק, מחוץ לאתר. בין האתרים הראשונים נמצאים הפורום, התיאטרון הגדול והאמפיתיאטרון. ההורדה חינמית דרך קוד QR בכניסה לאתר. חלק מהמסלולים חינמיים, והגישה המלאה עולה 15 אירו. אפשר גם לשכור טאבלט במקום ב-20 אירו. הכתבה לא מפרטת שפות או התאמות הַנְגָּשָׁה בתוך האפליקציה. מודל התמחור והשכרת המכשירים רלוונטי לתכנון אפליקציה לאתרים בישראל.", "speech_en": "Pompeii in augmented reality. The Portyl app reconstructs the city before the eruption. The Archaeological Park of Pompeii launched it in June 2026. It was developed by Histoury with universities in Salerno, Milan and Kiel. The reconstructions are based on precise LiDAR and photogrammetry scans and on archaeological research. Generative AI adds people, animals and daily life. The app uses GPS geofencing to place each reconstruction where the visitor stands. It can also be used remotely. Early sites include the Forum, the Great Theater and the Amphitheater. The app is free to download through QR codes at the entrances. Some routes stay free, and full access costs fifteen euros. Visitors can also rent a tablet on site for twenty euros. The article does not describe languages or accessibility features in the app. The pricing and device rental model is relevant for planning apps at heritage sites.", "url": "https://www.finestresullarte.info/en/museums/pompeii-in-augmented-reality-the-portyl-app-is-launched-showing-what-the-ancient-city-looked-like-before-the-eruption", "sourceName": "Finestre sull'Arte", "relevance": 4, "heritage": true, "discovery": true, "isUpdate": false, "people": ["Gabriel Zuchtriegel"], "published": "2026-06-24", "readTime": "5 דק׳"}, {"id": "2026-10-23-qatar-museums-ai-tour", "date": "2026-10-23", "kind": "news", "topicId": "heritage", "title": "Qatar Museums: מסלול AI לאומי בלי אפליקציה שמחבר מוזיאונים, אמנות ציבורית ואתרי מורשת", "summary": "רשות המוזיאונים של קטר בנתה פלטפורמה מבוססת רשת שמייצרת מסלול אישי לפי תחומי עניין, זמן, מיקום, ביקור עם ילדים וצורכי נגישות, עם צ׳טבוט שמזהה יצירות מתמונה. מקרה בוחן רלוונטי לגוף לאומי: תוכן אוצרותי מאומת, מנגנוני הגנה ולקחים מהשטח.", "title_en": "Qatar Museums: an app-free national AI route linking museums, public art and heritage sites", "summary_en": "Qatar Museums built a web-based platform that creates a personal route by interests, time, location, visiting with children and accessibility needs, with a chatbot that identifies artworks from a photo. A relevant case study for a national body: verified curatorial content, guardrails and lessons from the field.", "details": "Qatar Museums הציגה בכנס Museum AI Summit 2026 את AI Tour, פלטפורמה לאומית שאינה דורשת אפליקציה ומחברת מוזיאונים, אמנות ציבורית, אתרי מורשת ומרכזי יצירה למסלול אישי אחד. מחולל המסלולים בונה ביקור לפי תחומי עניין, זמן פנוי, מיקום, וביקור לבד או עם ילדים, ומתאים את המסלול גם לשפה ולצורכי נגישות. צ׳טבוט בשם Art Specialist עונה על שאלות על יצירות ומזהה אמנות ציבורית מתמונה, ולצדו מפה מודעת מיקום, מעבדה לעיבוד יצירות בסגנון אישי ודרכון ביקור דיגיטלי. הצוות מדגיש שהתוכן על היצירות והאתרים הוא חומר אוצרותי מאומת ולא טקסט שנוצר על ידי AI, עם מנגנוני הגנה ובחירת מודלים לשמירה על דיוק. הכתבה פורסמה ב-3 בספטמבר 2026 ואינה מביאה נתוני שימוש או הערכה, כך שקשה לשפוט הצלחה. הלקחים המרכזיים: מבקרים שואלים שאלות מעשיות ולא לפי קטגוריות מוסדיות, ו-AI תלוי בתוכן מסודר ובפיקוח מתמשך אחרי ההשקה.", "details_en": "Qatar Museums presented AI Tour at the Museum AI Summit 2026, an app-free national platform that links museums, public art, heritage sites and creative hubs into one personal route. The route generator builds a visit from interests, available time, location and whether the visitor comes alone or with children, and also adapts to language and accessibility needs. A chatbot called Art Specialist answers questions about artworks and identifies public art from a photo, alongside a location-aware map, a lab for restyling artworks and a digital visit passport. The team stresses that content about artworks and sites is verified curatorial material rather than AI-generated text, with guardrails and model selection to keep it accurate. The article was published on September 3, 2026 and gives no usage or evaluation data, so success is hard to judge. Key lessons: visitors ask practical questions rather than thinking in institutional categories, and AI depends on well-organized content and ongoing monitoring after launch.", "speech_he": "רשות המוזיאונים של קטר בנתה מסלול ביקור לאומי מבוסס בינה מלאכותית, בלי אפליקציה. הפלטפורמה נקראת AI Tour, והיא הוצגה בכנס מקצועי למוזיאונים ובינה מלאכותית. היא מחברת מוזיאונים, אמנות ציבורית ואתרי מורשת למסלול אישי אחד. המסלול נבנה לפי תחומי עניין, זמן פנוי, מיקום, וביקור לבד או עם ילדים. הוא מותאם גם לשפה ולצורכי הַנְגָּשָׁה. רובוט שיחה עונה על שאלות על יצירות, ומזהה אמנות ציבורית מתוך תמונה. הצוות מדגיש שהתוכן על היצירות מאומת על ידי אוצרים, ואינו נכתב על ידי הבינה המלאכותית. הכתבה לא מביאה נתוני שימוש או הערכה, ולכן קשה לשפוט את ההצלחה. לקח מרכזי הוא שמבקרים שואלים שאלות מעשיות, כמו מה יש בקרבת מקום. לקח נוסף הוא שבינה מלאכותית תלויה בתוכן מסודר ובפיקוח מתמשך.", "speech_en": "Qatar Museums built a national, app free visitor route powered by AI. The platform, called AI Tour, was presented at the Museum AI Summit 2026. It links museums, public art and heritage sites into one personal route. Routes are built from interests, available time, location, and whether visitors come alone or with children. They also adapt to language and accessibility needs. A chatbot answers questions about artworks and identifies public art from a photo. The team stresses that content about artworks is verified by curators, not written by AI. The article gives no usage data or evaluation, so success is hard to judge. One key lesson is that visitors ask practical questions, such as what is nearby. Another is that AI depends on well organized content and ongoing monitoring.", "url": "https://www.museumnext.com/article/how-qatar-museums-built-an-ai-tour-that-actually-reaches-visitors/", "sourceName": "MuseumNext", "relevance": 4, "heritage": true, "discovery": true, "isUpdate": false, "people": ["Vineetha Muringayil", "Asma Al-Jefairi"], "published": "2026-09-03", "readTime": "8 דק׳"}, {"id": "2026-10-23-splat-tour-phone", "date": "2026-10-23", "kind": "news", "topicId": "splats", "title": "Splat Tour: סיור תלת-ממדי בדפדפן מסרטון טלפון אחד לכל קומה, תוך פחות משעתיים", "summary": "שירות מברצלונה הופך סרטון טלפון אחד לכל קומה לסיור בדפדפן עם פנורמות 360, תוכנית קומה אוטומטית ותוספת splats לתנועה חופשית. השירות נבנה לנדל״ן, אבל זרימת העבודה (צילום בלולאות, עיבוד בענן, טעינה לפי חדר) מתאימה גם לביקור מרחוק במבני מורשת קטנים.", "title_en": "Splat Tour: a browser 3D tour from one phone video per floor, in under two hours", "summary_en": "A Barcelona service turns one phone video per floor into a browser tour with 360 panoramas, an automatic floor plan and an optional splat layer for free movement. It was built for real estate, but the workflow (loop capture, cloud processing, per-room loading) also suits remote visits to small heritage buildings.", "details": "Splat Tour הוא שירות רשת מברצלונה שבונה סיורים בדפדפן מסרטון טלפון אחד לכל קומה. הצילום נעשה בעדשה הרחבה במיוחד של טלפון חדש, באחיזה אנכית ובהליכה איטית: לולאה לאורך הקירות בכל חדר, לולאה הפוכה ושני אלכסונים. העיבוד בענן מפריד חדרים, מחשב את מסלול המצלמה ומאמן מודל תלת-ממדי, והתוצאה מגיעה תוך פחות משעתיים עם פנורמות 360, תוכנית קומה אוטומטית, קישור ציבורי וקוד הטמעה. תוספת ה-3D מחליפה קפיצות בין נקודות קבועות בתנועה חופשית, וכל חדר שוקל כ-5 עד 10 מגה-בייט ונטען רק כשנכנסים אליו. התמחור מבוסס קרדיטים, מ-19 אירו לחודש, עם מינימום של שלוש דקות וידאו לקומה ותקרה של עשר דקות לסרטון, וסיורים שפורסמו נשארים באוויר גם אחרי סיום המנוי. הכתבה אינה מציינת רמת דיוק, והשירות לא נבנה לתיעוד מדיד. לביקור מרחוק במבנים היסטוריים קטנים, זו דרך זולה ומהירה לנסות סיור splats בלי ציוד ייעודי.", "details_en": "Splat Tour is a Barcelona web service that builds browser tours from one phone video per floor. Capture uses the ultra-wide lens of a recent phone, held vertically while walking slowly: a loop along the walls of each room, a reverse loop and both diagonals. Cloud processing separates rooms, tracks the camera and trains a 3D model, delivering within two hours a tour with 360 panoramas, an automatic floor plan, a public link and an embed code. The 3D add-on replaces jumps between fixed points with free movement, and each room is about 5 to 10 MB and loads only when entered. Pricing is credit-based from 19 euros a month, with a three-minute minimum per floor and a ten-minute cap per video, and published tours stay online after a subscription ends. The article gives no accuracy figures, and the service is not built for measured documentation. For remote visits to small historic buildings, it is a cheap, fast way to try a splat tour without dedicated equipment.", "speech_he": "השירות Splat Tour הופך סרטון טלפון אחד לכל קומה לסיור תלת ממדי בדפדפן. השירות פועל מברצלונה, ונבנה בעיקר לשוק הדירות. מצלמים בעדשה הרחבה במיוחד של טלפון חדש, בהליכה איטית. בכל חדר עושים לולאה לאורך הקירות, לולאה הפוכה ושני אלכסונים. העיבוד נעשה בענן, והסיור מוכן תוך פחות משעתיים. הסיור כולל פנורמות של 360 מעלות, תוכנית קומה אוטומטית וקישור לשיתוף. תוספת תלת ממדית מבוססת Gaussian Splatting מאפשרת תנועה חופשית בין החדרים. כל חדר שוקל כחמישה עד עשרה מגה בייט, ונטען רק כשנכנסים אליו. המחיר מתחיל ב-19 אירו לחודש, לפי שיטת קרדיטים. השירות לא נבנה לתיעוד מדיד, והכתבה לא מציינת רמת דיוק. לביקור מרחוק במבנים היסטוריים קטנים, זו דרך זולה ומהירה לנסות סיור splats.", "speech_en": "Splat Tour turns one phone video per floor into a 3D tour in the browser. The service is based in Barcelona and was built mainly for real estate. You film with the ultra wide lens of a recent phone while walking slowly. In each room you walk a loop along the walls, a reverse loop, and both diagonals. Processing runs in the cloud, and the tour is ready in under two hours. It includes 360 degree panoramas, an automatic floor plan and a share link. An optional Gaussian Splatting add on allows free movement between rooms. Each room weighs about five to ten megabytes and loads only when entered. Pricing starts at nineteen euros a month, using credits. The service is not built for measured documentation, and the article gives no accuracy figures. For remote visits to small historic buildings, it is a cheap and fast way to try a splat tour.", "url": "https://radiancefields.com/splat-tour-turns-phone-video-into-3d-property-tours", "sourceName": "Radiance Fields", "relevance": 4, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Michael Rubloff"], "published": "2026-10-22", "readTime": "2 דק׳"}, {"id": "2026-10-23-splatxr-princeton", "date": "2026-10-23", "kind": "news", "topicId": "webxr", "title": "SplatXR מ-Princeton: ערכת Unity בקוד פתוח ל-splats במציאות מעורבת, עם פיזיקה ושילוב passthrough", "summary": "חוקרים מאוניברסיטת Princeton הציגו ב-UIST 2026 ערכת כלים בקוד פתוח (MIT) שמרנדרת splats על הקסדה עצמה, מוסיפה להם התנגשויות וצללים, ופותחת פורטלים שמשלבים סצנת splats עם העולם האמיתי. בסיס מוכן לבניית חוויות מורשת במציאות מעורבת מסריקות קיימות.", "title_en": "SplatXR from Princeton: an open-source Unity toolkit for splats in mixed reality, with physics and passthrough blending", "summary_en": "Princeton researchers presented at UIST 2026 an open-source (MIT) toolkit that renders splats on the headset itself, adds collisions and shadows, and opens portals that blend a splat scene with the real world. A ready foundation for mixed-reality heritage experiences built from existing scans.", "details": "SplatXR היא ערכת כלים ל-Unity שפיתחו Cyrus Vachha, Mohamed Kari ו-Parastoo Abtahi מאוניברסיטת Princeton, והוצגה בכנס ACM UIST 2026. הערכה בנויה מארבעה רכיבים: רינדור splats על המכשיר עם ניהול רמות פירוט, פיזיקה שמייצרת רשתות התנגשות מה-splats ומאפשרת צללים ותנועת גופים, אפקטים כמו התפוררות וחשיפה הדרגתית, ושילוב מרחבי splats עם תמונת ה-passthrough בצורת פורטלים. ההתקנה נעשית דרך Unity Package Manager, והקוד זמין ב-GitHub ברישיון MIT. דף הפרויקט אינו מציין דגמי קסדות או נתוני ביצועים, ולכן כדאי לבדוק בפועל על Quest לפני תכנון. הרעיון של פורטל שמציג אתר עתיק כפי שנסרק, בתוך החדר של המבקר או באתר עצמו, מתאים במיוחד להנגשה ולביקור מרחוק. זהו אחד הכלים הפתוחים הראשונים שמתייחסים ל-splats כאל אובייקטים אינטראקטיביים ולא רק כאל תמונה.", "details_en": "SplatXR is a Unity toolkit developed by Cyrus Vachha, Mohamed Kari and Parastoo Abtahi of Princeton University and presented at ACM UIST 2026. It has four building blocks: on-device splat rendering with level-of-detail management, physics that generates collision meshes from splats for shadows and rigid-body dynamics, effects such as disintegration and radial reveal, and portal-style blending of splat spaces with passthrough. It installs through the Unity Package Manager, and the code is on GitHub under the MIT license. The project page lists no headset models or performance figures, so it is worth testing on a Quest before planning. A portal that shows an ancient site as scanned, inside the visitor's room or at the site itself, is especially suited to accessibility and remote visits. It is one of the first open tools to treat splats as interactive objects rather than just an image.", "speech_he": "ערכת כלים חדשה בשם SplatXR מביאה את Gaussian Splatting למציאות מעורבת. את הערכה פיתחו חוקרים מאוניברסיטת Princeton, והיא הוצגה בכנס UIST 2026. היא עובדת בתוך מנוע המשחק Unity, והקוד שלה פתוח לכולם. הערכה מרנדרת splats ישירות על הקסדה. היא מוסיפה להם פיזיקה, כך שחפצים יכולים להתנגש בהם ולהטיל צללים. יש בה גם אפקטים, כמו התפוררות וחשיפה הדרגתית. רכיב נוסף פותח חלון שמשלב סצנה סרוקה עם העולם האמיתי סביב המשתמש. דף הפרויקט לא מציין דגמי קסדות או נתוני ביצועים, ולכן כדאי לבדוק בפועל. הרעיון של חלון לאתר עתיק סרוק מתאים במיוחד להַנְגָּשָׁה ולביקור מרחוק.", "speech_en": "A new toolkit called SplatXR brings Gaussian Splatting into mixed reality. It was developed by researchers at Princeton University and presented at UIST 2026. It runs inside the Unity game engine, and its code is open source. The toolkit renders splats directly on the headset. It adds physics, so objects can collide with splats and cast shadows. It also includes effects, such as disintegration and gradual reveal. Another component opens a portal that blends a scanned scene with the real world around the user. The project page does not list headsets or performance figures, so testing is advised. A portal into a scanned ancient site is especially suited to accessibility and remote visits.", "url": "https://splatxr.github.io/", "sourceName": "Princeton University (UIST 2026)", "relevance": 4, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Parastoo Abtahi", "Cyrus Vachha", "Mohamed Kari"], "readTime": "4 דק׳"}, {"id": "2026-10-23-supersplat-3-6", "date": "2026-10-23", "kind": "news", "topicId": "splats", "title": "SuperSplat 3.6: יישור splat עקום בשתי לחיצות על קו אנכי, וייצוא מדויק של רצועות SH", "summary": "הגרסה החדשה של עורך ה-splats החינמי של PlayCanvas מאפשרת ליישר סריקה עקומה בבחירת שתי נקודות על משקוף, עמוד או פינת קיר. שיפור קטן אבל שימושי מאוד לסריקות רחפן וכף-יד של מבני מורשת, שיוצאות לעיתים קרובות מוטות.", "title_en": "SuperSplat 3.6: straighten a tilted splat with two clicks on a vertical edge, plus exact SH band export", "summary_en": "The new version of PlayCanvas's free splat editor lets you straighten a tilted scan by picking two points on a door frame, column or wall corner. A small but very practical improvement for drone and handheld scans of heritage buildings, which often come out tilted.", "details": "SuperSplat 3.6.0 הוא העורך החינמי מבוסס הדפדפן של PlayCanvas, והגרסה פורסמה ב-22 באוקטובר 2026. הכלי החדש מבקש לבחור שתי נקודות על קצה אנכי אחד, כמו משקוף דלת או עמוד, והקו ביניהן הופך לציר המעלה של הסצנה. סדר הלחיצות קובע את הכיוון, כך שגם סריקה הפוכה או מוטה ב-90 מעלות מתיישרת בלי צעד נוסף, והסיבוב נעשה סביב נקודת האמצע עם הצמדה של 3 מעלות וביטול בצעד אחד. שינוי נוסף מאפשר לקבוע בדיוק כמה רצועות spherical harmonics ייכתבו לקובץ, במקום מקסימום בלבד, ומשפר תאימות לכלים כמו SIBR ו-INRIA. הייצוא נתמך ב-PLY, PLY דחוס, SOG, SPZ ו-HTML. העורך זמין בחינם ב-superspl.at והקוד ב-GitHub. ליישור סריקות של מבנים היסטוריים לפני פרסום או שילוב באפליקציה, זה חוסך עבודה ידנית מתסכלת.", "details_en": "SuperSplat 3.6.0 is PlayCanvas's free browser-based editor, released on October 22, 2026. The new tool asks you to pick two points on a single vertical edge, such as a door frame or column, and the line between them becomes the scene's up axis. Click order sets the direction, so even an upside-down scan or one tilted 90 degrees is fixed in one step, and the rotation happens around the midpoint with a 3-degree snap and single-step undo. Another change lets you set exactly how many spherical harmonics bands are written to the file, instead of only a maximum, improving compatibility with tools such as SIBR and the INRIA loader. Export covers PLY, compressed PLY, SOG, SPZ and HTML. The editor is free at superspl.at, with code on GitHub. For straightening scans of historic buildings before publishing or adding them to an app, it saves frustrating manual work.", "speech_he": "העורך SuperSplat יצא בגרסה 3.6, עם כלי חדש ליישור סריקות עקומות. זהו עורך חינמי שעובד בדפדפן, של החברה PlayCanvas. הגרסה פורסמה ב-22 באוקטובר 2026. בוחרים שתי נקודות על קו אנכי אחד, כמו משקוף דלת או עמוד. הקו ביניהן הופך לציר המעלה של כל הסצנה. גם סריקה הפוכה או מוטה בתשעים מעלות מתיישרת בצעד אחד. שינוי נוסף מאפשר לקבוע בדיוק כמה רצועות צבע ייכתבו בקובץ, ומשפר תאימות לכלים אחרים. הייצוא נתמך בכמה פורמטים, ביניהם PLY ו-SPZ. סריקות רחפן וכף יד של מבנים היסטוריים יוצאות לעיתים קרובות מוטות. הכלי החדש חוסך עבודה ידנית לפני פרסום או שילוב באפליקציה.", "speech_en": "SuperSplat version 3.6 adds a new tool for straightening tilted scans. It is a free browser based editor from PlayCanvas. The release came out on October 22, 2026. You pick two points on one vertical edge, such as a door frame or a column. The line between them becomes the up axis of the whole scene. Even an upside down scan, or one tilted ninety degrees, is fixed in one step. Another change lets you set exactly how many spherical harmonics bands are written to the file. This improves compatibility with other tools. Export works in several formats, including PLY and SPZ. Drone and handheld scans of historic buildings are often tilted. The new tool saves manual work before publishing or adding a scan to an app.", "url": "https://radiancefields.com/supersplat-3.6-straightens-splats-from-a-vertical-edge", "sourceName": "Radiance Fields", "relevance": 4, "heritage": false, "discovery": false, "isUpdate": false, "people": ["Michael Rubloff"], "published": "2026-10-22", "readTime": "2 דק׳"}, {"id": "2026-10-23-v-avthar-cc-planning", "date": "2026-10-23", "kind": "media", "topicId": "claude", "title": "שיטת תכנון לפרויקטים ב-Claude Code: שלושה שלבים וחמישה Skills", "summary": "הסרטון מציג שיטה לתכנון פרויקטים ב-Claude Code במקום Plan Mode: בירור, קבלת החלטות ומבנה, עם Skills לסיעור מוחות, אפיון, פירוק למשימות ובדיקת היקף ההשפעה. שימושי למי שבונה אפליקציות מורשת גדולות ורוצה פחות תיקונים בדיעבד.", "title_en": "A planning method for Claude Code projects: three phases and five skills", "summary_en": "The video presents a method for planning Claude Code projects instead of Plan Mode: clarity, decisions and structure, with skills for brainstorming, specs, issue breakdown and blast-radius checks. Useful for anyone building larger heritage apps who wants fewer fixes after the fact.", "details": "הסרטון של הערוץ AI with Avthar עלה ב-15 באוקטובר 2026 ומציג את שיטת התכנון שהמנחה משתמש בה בכל פרויקט Claude Code. הוא מסביר למה הפסיק להשתמש ב-Plan Mode ומחלק את התכנון לשלושה שלבים: לקבל בהירות, לקבל החלטות ולהוסיף מבנה. חמישה Skills תומכים בשלבים: סיעור מוחות, בירור, כתיבת אפיון, יצירת משימות ובדיקת היקף ההשפעה של שינוי. ההדגמה נעשית על תכנון אפליקציה אמיתית לעסק שלו. בתיאור יש קישורים לתבניות ול-Skills, וגם לקורסים בתשלום. עבור פרויקט הנגשה מורכב, שיטה כזו עוזרת לפרק דרישות לפני שכותבים קוד.", "details_en": "The AI with Avthar video, published on October 15, 2026, presents the planning method the host uses for every Claude Code project. He explains why he stopped using Plan Mode and splits planning into three phases: getting clear, making decisions and adding structure. Five skills support the phases: brainstorm, get clarity, create spec, create issues and blast radius. The demo plans a real app for his business. The description links to templates and skills as well as paid courses. For a complex accessibility project, a method like this helps break down requirements before writing code.", "speech_he": "סרטון חדש מציג שיטה לתכנון פרויקטים עם הכלי Claude Code. הסרטון עלה ב-15 באוקטובר 2026 בערוץ AI with Avthar. המנחה מסביר למה הפסיק להשתמש במצב התכנון המובנה. הוא מחלק את התכנון לשלושה שלבים. השלב הראשון הוא בירור, השני קבלת החלטות, והשלישי בניית מבנה. חמש מיומנויות מסוג Skills תומכות בשלבים האלה. הן כוללות סיעור מוחות, כתיבת אפיון ופירוק למשימות. ההדגמה נעשית על אפליקציה אמיתית. בתיאור יש גם קישורים לקורסים בתשלום. בפרויקט הַנְגָּשָׁה מורכב, שיטה כזו עוזרת לפרק דרישות לפני כתיבת קוד.", "speech_en": "A new video presents a planning method for projects built with Claude Code. It was published on October 15, 2026, on the AI with Avthar channel. The host explains why he stopped using the built in plan mode. He splits planning into three phases. The first is getting clear, the second is making decisions, and the third is adding structure. Five skills support these phases. They include brainstorming, writing a spec and breaking work into issues. The demo uses a real app. The description also links to paid courses. In a complex accessibility project, a method like this helps break down requirements before writing code.", "watchUrl": "https://www.youtube.com/watch?v=TJsldEnkK8g", "url": "https://www.youtube.com/watch?v=TJsldEnkK8g", "sourceName": "AI with Avthar (YouTube)", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-15", "mediaType": "video", "duration": "כ-42 דק׳"}, {"id": "2026-10-23-v-claude-3d-voice-assistant", "date": "2026-10-23", "kind": "media", "topicId": "claude", "title": "בניית עוזר AI תלת-ממדי שמדבר באתר: Claude Code עם Tripo ו-Fish Audio", "summary": "מדריך וידאו שבונה אתר עם דמות תלת-ממדית שמבקרים יכולים לשוחח איתה בקול או בטקסט: Claude Code לממשק ולאנימציה, Tripo למודל ו-Fish Audio לדיבור בזמן אמת. רלוונטי כאב-טיפוס למדריך דובר באתר מורשת; הסרטון ממומן.", "title_en": "Building a talking 3D AI assistant for a website: Claude Code with Tripo and Fish Audio", "summary_en": "A video tutorial that builds a site with a 3D character visitors can talk to by voice or text: Claude Code for the interface and animation, Tripo for the model and Fish Audio for real-time speech. Relevant as a prototype for a talking guide at a heritage site; the video is sponsored.", "details": "הסרטון של הערוץ MiladiCode עלה ב-17 באוקטובר 2026 ומראה בנייה של Clara Studio, אתר תלת-ממדי שבו מבקרים מדברים עם עוזר AI בקול או בטקסט. Claude Code משמש לבניית הממשק ולאנימציה של הדמות, Tripo ליצירת המודל התלת-ממדי ו-Fish Audio לדיבור ולשיחה בזמן אמת. המדריך מכסה תגי רגש בדיבור, עיצוב קול מותאם, חיבור Fish Audio ל-Claude Code, הטמעה דרך Web SDK והגדרת הרשאות מיקרופון ומקורות מורשים. הסרטון ממומן על ידי Fish Audio, ויש לקחת זאת בחשבון. זרימת העבודה מתאימה לבדיקת רעיון של מדריך דובר לאתר או למוצג, אבל עברית לא נבדקה בסרטון ויש לבחון את איכות הקול בעברית.", "details_en": "The MiladiCode video, published on October 17, 2026, shows how to build Clara Studio, a 3D website where visitors talk with an AI assistant by voice or text. Claude Code builds the interface and the character animation, Tripo creates the 3D model and Fish Audio handles speech and real-time conversation. The tutorial covers emotional speech tags, custom voice design, connecting Fish Audio to Claude Code, embedding with the Web SDK, and configuring microphone access and allowed origins. The video is sponsored by Fish Audio, which should be kept in mind. The workflow suits testing the idea of a talking guide for a site or exhibit, but Hebrew was not tested and voice quality in Hebrew would need checking.", "speech_he": "מדריך וידאו מראה איך בונים עוזר בינה מלאכותית תלת ממדי שמדבר באתר אינטרנט. הסרטון עלה ב-17 באוקטובר 2026 בערוץ MiladiCode. המבקרים באתר יכולים לשוחח עם הדמות בקול או בטקסט. הכלי Claude Code בונה את הממשק ואת האנימציה של הדמות. הכלי Tripo יוצר את המודל התלת ממדי. הכלי Fish Audio אחראי על הדיבור והשיחה בזמן אמת. המדריך מסביר גם איך מעצבים קול ואיך מטמיעים את הדמות באתר. הסרטון ממומן על ידי החברה Fish Audio. זהו אב טיפוס מעניין למדריך דובר באתר מורשת, אבל עברית לא נבדקה בו.", "speech_en": "A video tutorial shows how to build a talking 3D AI assistant for a website. It was published on October 17, 2026, on the MiladiCode channel. Visitors can talk with the character by voice or text. Claude Code builds the interface and the character animation. Tripo creates the 3D model. Fish Audio handles speech and real time conversation. The tutorial also covers voice design and embedding the character on a site. The video is sponsored by Fish Audio. It is an interesting prototype for a talking guide at a heritage site, but Hebrew was not tested.", "watchUrl": "https://www.youtube.com/watch?v=aSE45gePCJc", "url": "https://www.youtube.com/watch?v=aSE45gePCJc", "sourceName": "MiladiCode (YouTube)", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-17", "mediaType": "video", "duration": "משך לא צוין"}, {"id": "2026-10-23-v-opus55-3d-website", "date": "2026-10-23", "kind": "media", "topicId": "claude", "title": "בניית אתר תלת-ממדי אינטראקטיבי עם Claude Opus 5.5 בלי לכתוב קוד", "summary": "מדריך מלא מהערוץ Create a Pro Website: Claude בונה את האתר, Higgsfield מייצר תמונות ווידאו פתיחה, ואחר כך פרסום עם דומיין. מתאים כהשראה לדפי נחיתה לאתרי מורשת; הסרטון כולל קישורי שותפים.", "title_en": "Building an interactive 3D website with Claude Opus 5.5 without writing code", "summary_en": "A full tutorial from the Create a Pro Website channel: Claude builds the site, Higgsfield generates images and an opening video, then publishing with a domain. Good inspiration for heritage site landing pages; the video includes affiliate links.", "details": "הסרטון עלה ב-13 באוקטובר 2026 בערוץ Create a Pro Website ומדגים בניית אתר תלת-ממדי אינטראקטיבי עם Claude Opus 5.5 בלי לכתוב קוד בעצמך. התהליך כולל הגדרת Claude, יצירת ערכת מותג, יצירת תמונות ווידאו קולנועי לפתיחה בעזרת Higgsfield, בניית האתר, התאמת מקטעים, חיבור דומיין ופרסום. בסוף מוצגת עבודה עם תיקונים באמצעות הנחיות בשפה טבעית. הסרטון כולל הצעת אחסון בהנחה וגילוי נאות על קישורי שותפים. הוא משלים סרטון דומה שדווח ב-22 באוקטובר, ומתאים כהשראה לדף נחיתה ויזואלי לאתר מורשת או לתערוכה.", "details_en": "The video, published on October 13, 2026 on the Create a Pro Website channel, demonstrates building an interactive 3D website with Claude Opus 5.5 without writing code yourself. The process covers setting up Claude, creating a brand kit, generating images and a cinematic opening video with Higgsfield, building the site, customizing sections, connecting a domain and publishing. It ends with revisions made through natural-language prompts. The video includes a discounted hosting offer and an affiliate disclosure. It complements a similar video reported on October 22 and works as inspiration for a visual landing page for a heritage site or exhibition.", "speech_he": "מדריך וידאו מראה איך בונים אתר תלת ממדי אינטראקטיבי עם המודל Claude Opus 5.5, בלי לכתוב קוד. הסרטון עלה ב-13 באוקטובר 2026 בערוץ Create a Pro Website. התהליך מתחיל בבניית ערכת מותג. אחר כך נוצרים תמונות ווידאו פתיחה בעזרת הכלי Higgsfield. המודל בונה את האתר, ואז מתאימים מקטעים, מחברים דומיין ומפרסמים. בסוף מוצגים תיקונים בעזרת הנחיות בשפה רגילה. הסרטון כולל קישורי שותפים והצעות מסחריות. הוא מתאים כהשראה לדף נחיתה ויזואלי לאתר מורשת או לתערוכה.", "speech_en": "A video tutorial shows how to build an interactive 3D website with Claude Opus 5.5, without writing code. It was published on October 13, 2026, on the Create a Pro Website channel. The process starts with a brand kit. Then images and an opening video are created with Higgsfield. Claude builds the site, and then sections are adjusted, a domain is connected and the site is published. At the end, revisions are made with plain language prompts. The video includes affiliate links and commercial offers. It works as inspiration for a visual landing page for a heritage site or an exhibition.", "watchUrl": "https://www.youtube.com/watch?v=fSFrHISdpt8", "url": "https://www.youtube.com/watch?v=fSFrHISdpt8", "sourceName": "Create a Pro Website (YouTube)", "relevance": 3, "heritage": false, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-13", "mediaType": "video", "duration": "משך לא צוין"}, {"id": "2026-10-24-3dbigdataspace-70k-models", "date": "2026-10-24", "kind": "news", "topicId": "heritage", "title": "3DBigDataSpace הסתיים: יותר מ-70,000 מודלים תלת-ממדיים של מורשת נכנסו למרחב הנתונים האירופי", "summary": "פרויקט אירופי בן 18 חודשים מסר יותר מ-70,000 מודלים תלת-ממדיים למרחב הנתונים האירופי למורשת תרבות, ומעל 1,200 מהם פורסמו לציבור ב-Europeana. הפרויקט הותיר גם כלי AI להעשרת מטא-דאטה, צופי תלת-ממד ו-4D, כלי AR וקורסים, שימושיים כתבנית לפרסום ארכיון תיעוד לאומי.", "title_en": "3DBigDataSpace wraps up: more than 70,000 heritage 3D models added to the European data space", "summary_en": "An 18-month EU project delivered more than 70,000 3D models to the European cultural heritage data space, with over 1,200 published to the public on Europeana. It also left AI metadata-enrichment tools, 3D and 4D viewers, AR tools and courses, useful as a template for publishing a national documentation archive.", "details": "הפרויקט 3DBigDataSpace פעל מפברואר 2025 עד יולי 2026 במימון תוכנית Digital Europe, והסיכום שלו פורסם ב-15 באוקטובר 2026 באתר CARARE. לפי הדיווח נמסרו יותר מ-70,000 מודלים תלת-ממדיים למרחב הנתונים האירופי למורשת תרבות, יחד עם מטא-דאטה על מקורם ועל ההקשר שלהם, ומעל 1,200 מודלים פורסמו ב-Europeana.eu. הסוכנות האירופית שבחנה את הפרויקט קבעה שהיעדים הושגו ולעיתים אף נעקפו. בין התוצרים: כלי AI להעשרת מטא-דאטה מרחבית וקישור לרשומות סמכות, צופי תלת-ממד ו-4D, כלי מציאות רבודה, 20 משאבי הדרכה וארבעה קורסים עצמיים ב-Europeana Academy. מערכי הנתונים נשמרים לטווח ארוך ב-Zenodo, והתוכנה פורסמה בקוד פתוח. הכתבה אינה מפרטת את השותפים, את הפורמטים המדויקים או את רמת הדיוק של המודלים. עבור ארגון שמחזיק ארכיון תיעוד גדול, זהו מקרה בוחן מעשי לשאלה איך עוברים מאלפי סריקות פנימיות לפרסום ציבורי מסודר עם מטא-דאטה.", "details_en": "3DBigDataSpace ran from February 2025 to July 2026 with Digital Europe Programme funding, and its wrap-up was published on October 15, 2026 on the CARARE site. According to the report, more than 70,000 3D models were delivered to the European cultural heritage data space, together with metadata on their origin and context, and over 1,200 models were published on Europeana.eu. The European agency that reviewed the project found that it met and often exceeded its objectives. Outputs include AI tools for spatial metadata enrichment and authority linking, 3D and 4D viewers, augmented reality tools, 20 training resources and four self-paced courses on the Europeana Academy. Datasets are stored long term on Zenodo, and the software was released as open source. The article does not list partners, exact formats or model accuracy. For an organisation holding a large documentation archive, it is a practical case study in moving from thousands of internal scans to orderly public publication with metadata.", "speech_he": "הפרויקט 3DBigDataSpace הכניס יותר מ-70,000 מודלים תלת ממדיים של מורשת למרחב הנתונים האירופי. הפרויקט פעל שמונה עשר חודשים, עד יולי 2026, והסיכום פורסם ב-15 באוקטובר. יותר מ-1,200 מודלים כבר פורסמו לציבור באתר Europeana. לכל מודל צורף מידע על מקורו ועל ההקשר שלו. הפרויקט השאיר גם כלי בינה מלאכותית להעשרת מידע, צופים תלת ממדיים וכלי מציאות רבודה. יש גם קורסים עצמיים במסגרת Europeana Academy. מערכי הנתונים נשמרים לטווח ארוך באתר Zenodo, והתוכנה פתוחה. הכתבה לא מפרטת את השותפים ואת רמת הדיוק של המודלים. זהו מקרה בוחן טוב למעבר מארכיון סריקות פנימי לפרסום ציבורי מסודר.", "speech_en": "The 3DBigDataSpace project added more than 70,000 heritage 3D models to the European data space. The project ran for eighteen months, until July 2026, and its summary was published on October 15. More than 1,200 models are already public on Europeana. Each model comes with information on its origin and context. The project also left AI tools for metadata enrichment, 3D viewers and augmented reality tools. There are also self-paced courses on the Europeana Academy. The datasets are stored long term on Zenodo, and the software is open source. The article does not list the partners or the accuracy of the models. It is a good case study for moving from an internal scan archive to orderly public publication.", "url": "https://www.carare.eu/en/news/3dbigdataspace-completes-its-journey-seventy-thousand-3d-models-join-the-european-data-space-for-cultural-heritage/", "sourceName": "CARARE", "relevance": 4, "heritage": true, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-15", "readTime": "5 דק׳"}, {"id": "2026-10-24-arcgis-earth-3-splats", "date": "2026-10-24", "kind": "news", "topicId": "splats", "title": "עדכון: ArcGIS Earth 3.0 מציג שכבות Gaussian splats ממוקמות, לצד Local Scenes ועורך סרטונים", "summary": "גרסת אוקטובר של ArcGIS Earth לשולחן העבודה מוסיפה שכבות splats ממוקמות גיאוגרפית, כך ש-splats מגיעים גם לצופה החינמי של Esri ולא רק ל-ArcGIS Pro. נוספו גם סצנות מקומיות בקואורדינטות המקור ועורך סרטונים לייצוא MP4, שימושיים להצגת סריקות אתרים.", "title_en": "Update: ArcGIS Earth 3.0 displays georeferenced Gaussian splat layers, alongside Local Scenes and a movie editor", "summary_en": "The October release of ArcGIS Earth desktop adds georeferenced splat layers, bringing splats to Esri's free viewer and not only ArcGIS Pro. It also adds local scenes in native coordinates and a movie editor that exports MP4, useful for presenting site scans.", "details": "Esri פרסמה ב-1 באוקטובר 2026 את ArcGIS Earth 3.0 לשולחן העבודה ואת גרסה 2.8 למובייל. החידוש המרכזי לעניין התיעוד הוא תמיכה בשכבות Gaussian splats ממוקמות גיאוגרפית, שנבנו משחזור מבוסס תמונות, והן מנוהלות מלוח השכבות הרגיל עם שליטה בנראות ובשקיפות. Esri מציינת שהן מתאימות במיוחד לצמחייה, למבנים דקים ולמשטחי זכוכית ומתכת, שבהם רשת תלת-ממדית רגילה מתקשה. נוספו גם Local Scenes ששומרות על מערכת הקואורדינטות המקורית בלי הטלה מחדש, שכבות מבנים תלת-ממדיות עם סינון לפי קומות, ניהול פרויקטים, ועורך סרטונים בבטא שמייצא MP4 עם תנועות מצלמה, טקסט ושמע. שכבות ה-splats זמינות כרגע רק בגרסת שולחן העבודה ולא במובייל, והמאמר לא מזכיר תמיכה ב-XR. ההבדל מהדיווחים הקודמים על Esri הוא שה-splats עוברים מכלי המקצוע ArcGIS Pro לצופה רחב יותר. עבור מחלקת גיאואינפורמטיקה זה מאפשר להציג סריקות אתרים בסביבה המוכרת ולהפיק מהן סרטון הסבר בלי תוכנה נוספת.", "details_en": "Esri released ArcGIS Earth 3.0 for desktop and version 2.8 for mobile on October 1, 2026. The key addition for documentation work is support for georeferenced Gaussian splat layers built from image-based reconstruction, managed from the regular layer panel with visibility and transparency controls. Esri notes they suit vegetation, thin structures and glass or metal surfaces, where a regular mesh struggles. Also new are Local Scenes that keep the original coordinate system without reprojection, 3D building layers with floor filters, project management, and a beta movie editor that exports MP4 with camera moves, text and audio. Splat layers are currently desktop-only, not mobile, and the article does not mention XR. The change from earlier Esri reports is that splats move from the professional ArcGIS Pro to a wider viewer. For a geoinformatics department this means showing site scans in a familiar environment and producing an explainer video without extra software.", "speech_he": "עדכון מהחברה Esri. גרסה 3.0 של התוכנה ArcGIS Earth מציגה שכבות של Gaussian Splatting במיקום גיאוגרפי מדויק. הגרסה יצאה ב-1 באוקטובר 2026. השכבות מנוהלות בלוח השכבות הרגיל, עם שליטה בנראות ובשקיפות. לפי Esri הן מתאימות במיוחד לצמחייה, למבנים דקים ולמשטחי זכוכית ומתכת. נוספו גם סצנות מקומיות ששומרות על מערכת הקואורדינטות המקורית. נוסף עורך סרטונים בגרסת בטא, שמייצא קובץ וידאו עם תנועות מצלמה, טקסט ושמע. השכבות זמינות כרגע רק במחשב, ולא בטלפון. החידוש הוא שהסריקות עוברות מכלי המקצוע לצופה רחב יותר. כך אפשר להציג סריקת אתר ולהפיק ממנה סרטון הסבר באותה סביבה.", "speech_en": "An update from Esri. ArcGIS Earth version 3.0 displays Gaussian splat layers in their exact geographic location. The release came out on October 1, 2026. The layers are managed in the regular layer panel, with visibility and transparency controls. According to Esri, they suit vegetation, thin structures and glass or metal surfaces. Also new are local scenes that keep the original coordinate system. There is a beta movie editor that exports video with camera moves, text and audio. The splat layers are currently available only on desktop, not on mobile. What is new is that scans move from the professional tool to a wider viewer. You can show a site scan and produce an explainer video in the same environment.", "url": "https://www.esri.com/arcgis-blog/products/arcgis-earth/3d-gis/whats-new-in-arcgis-earth-october-2026", "sourceName": "Esri ArcGIS Blog", "relevance": 4, "discovery": false, "isUpdate": true, "people": [], "published": "2026-10-01", "readTime": "5 דק׳"}, {"id": "2026-10-24-chcnav-cocloud-splats", "date": "2026-10-24", "kind": "news", "topicId": "splats", "title": "CHCNAV CoCloud מוסיפה מנוע הצגה ל-splats: טעינה מוקדמת של מודלים עד 5GB וסינון הולכי רגל ב-AI", "summary": "פלטפורמת הענן של CHCNAV, המשמשת את סורק הלייזר הנייד RS7, מציגה עכשיו מודלי 3DGS עד 5GB, עם עיבוד מהיר ב-20% וכלי ניקוי. זה עוד סימן שיצרני סורקי לייזר ניידים מאמצים splats כתוצר רגיל לצד ענן הנקודות.", "title_en": "CHCNAV CoCloud adds a splat renderer: preloading models up to 5 GB and AI pedestrian filtering", "summary_en": "CHCNAV's cloud platform, used with the RS7 handheld laser scanner, now displays 3DGS models up to 5 GB, with 20% faster processing and cleanup tools. It is another sign that mobile laser scanner makers are adopting splats as a standard output alongside point clouds.", "details": "CHCNAV הודיעה ב-LinkedIn על עדכון לפלטפורמת העיבוד בענן CoCloud, שכולל מנוע הצגה למודלי Gaussian Splatting. לפי החברה המנוע טוען מראש מודלים בגודל של עד 5GB תוך שניות, והגדלת כוח המחשוב בענן הפכה את העיבוד למהיר ב-20 אחוז. נוספו כלים להכנת הנתונים: סינון הולכי רגל ב-AI, ניקוי רעש בענן הנקודות ומעקב בזמן אמת אחרי התקדמות העבודה, וגלריה של פרויקטים לדוגמה. העדכון מיועד בעיקר למשתמשי סורק הלייזר הנייד RS7 ולפרויקטי לכידת מציאות. לצידו קיימים הצופה החינמי CoViewer ל-Windows והחבילה CoMeta שמייצאת splats ל-PLY ול-3D Tiles. החברה לא פרסמה מספר splats, פורמטים, דרישות חומרה או מספר גרסה, ולא ברור אם 5GB היא מגבלה קשיחה. עבור תיעוד מבנים ומנהרות בסורק נייד, הכיוון חשוב: אותה סריקה יכולה לייצר גם ענן נקודות מדיד וגם מודל צפייה מציאותי לציבור.", "details_en": "CHCNAV announced on LinkedIn an update to its CoCloud cloud processing platform that includes a renderer for Gaussian splat models. According to the company, the engine preloads models of up to 5 GB within seconds, and added cloud capacity made processing 20 percent faster. New data preparation tools include AI pedestrian filtering, point cloud denoising and real-time job tracking, plus a gallery of sample projects. The update mainly targets users of the RS7 handheld laser scanner and reality capture projects. Alongside it are the free CoViewer for Windows and the CoMeta package, which exports splats to PLY and 3D Tiles. The company published no splat counts, formats, hardware requirements or version number, and it is unclear whether 5 GB is a hard limit. For documenting buildings and tunnels with a handheld scanner the direction matters: one scan can produce both a measurable point cloud and a realistic viewing model for the public.", "speech_he": "החברה CHCNAV הוסיפה מנוע הצגה למודלי Gaussian Splatting בפלטפורמת הענן CoCloud. לפי החברה, המנוע טוען מודלים בגודל של עד 5 גיגה בייט תוך שניות. העיבוד בענן נעשה מהיר יותר ב-20 אחוז. נוספו כלים לסינון הולכי רגל בעזרת בינה מלאכותית ולניקוי רעש בענן הנקודות. העדכון מיועד בעיקר למשתמשי סורק הלייזר הנייד RS7. החברה לא פרסמה פורמטים, דרישות חומרה או מספר גרסה. זהו עוד סימן שיצרני סורקים ניידים מאמצים את הטכנולוגיה. אותה סריקה יכולה לייצר גם ענן נקודות מדיד וגם מודל צפייה מציאותי.", "speech_en": "CHCNAV added a Gaussian splat renderer to its CoCloud cloud platform. According to the company, it preloads models of up to 5 gigabytes within seconds. Cloud processing became 20 percent faster. New tools filter out pedestrians with AI and remove noise from point clouds. The update mainly targets users of the RS7 handheld laser scanner. The company did not publish formats, hardware requirements or a version number. It is another sign that handheld scanner makers are adopting splats. One scan can produce both a measurable point cloud and a realistic viewing model.", "url": "https://radiancefields.com/chcnav-cocloud-adds-a-new-gaussian-splat-renderer", "sourceName": "Radiance Fields", "relevance": 3, "discovery": false, "isUpdate": false, "people": ["Michael Rubloff"], "published": "2026-10-23", "readTime": "2 דק׳"}, {"id": "2026-10-24-claude-duet-preview", "date": "2026-10-24", "kind": "news", "topicId": "claude", "title": "Anthropic משיקה את Claude Duet: סוכן יזום שעובד ברקע על מכונה וירטואלית ומבקש אישור לפני פעולות רגישות", "summary": "תצוגה מקדימה מחקרית למנויי Pro ו-Max בארצות הברית, ב-iOS, Android ו-claude.ai: Duet שולח תדריך בוקר, בודק כל כמה שעות מה דורש תשומת לב ומבצע משימות דרך המחברים, הזיכרון וה-Skills של החשבון. רלוונטי כתבנית לאוטומציה של מעקב שוטף, אך עדיין לא זמין מחוץ לארצות הברית.", "title_en": "Anthropic launches Claude Duet: a proactive agent that works in the background on a virtual machine and asks before sensitive actions", "summary_en": "A research preview for US Pro and Max subscribers on iOS, Android and claude.ai: Duet sends a morning brief, checks every few hours for what needs attention and carries out tasks through the account's connectors, memory and Skills. Relevant as a pattern for automating ongoing monitoring, but not yet available outside the US.", "details": "Anthropic הציגה ב-21 באוקטובר 2026 את Claude Duet, אפליקציית סוכן יזום שמבוססת על Claude Opus 5.5 וזמינה כתצוגה מקדימה מחקרית דרך רשימת המתנה למנויי Pro ו-Max בארצות הברית. במקום לחכות לשיחה, Duet שולח תדריך בוקר על הדברים החשובים בחשבונות המחוברים, בודק כל כמה שעות, ופונה רק כשמשהו דורש את המשתמש. אפשר לתת לו משימות בטקסט או בקול, כמו קביעת פגישות או בניית לוח מחוונים. הוא רץ על מכונה וירטואלית משלו עם דפדפן, כך שהמכשיר של המשתמש לא צריך להישאר דלוק, ומשתמש בזיכרון, ב-Skills ובמחברים של החשבון. לפני שליחת הודעות, תשלום, חתימה על מסמכים או מחיקה הוא מציג את הפעולה ומחכה לאישור, ומסווג חוסם שיתוף פרטים כמו מספרי כרטיסי אשראי. Anthropic מודה שהוא עדיין עלול לטעות בהערכת מה דחוף, והבדיקות ברקע נספרות במכסת השימוש. לעבודה כמו המכ״ם הזה, זה מראה לאן הולך תחום הסוכנים היזומים, אבל בינתיים אין תאריך לזמינות מחוץ לארצות הברית.", "details_en": "On October 21, 2026 Anthropic introduced Claude Duet, a proactive agent app built on Claude Opus 5.5 and available as a research preview through a waitlist for US Pro and Max subscribers. Instead of waiting for a chat, Duet sends a morning brief on what matters in connected accounts, checks in every few hours, and reaches out only when something needs the user. It accepts tasks by text or voice, such as scheduling meetings or building a dashboard. It runs on its own virtual machine with a browser, so the user's device does not need to stay on, and uses the account's memory, Skills and connectors. Before sending messages, making payments, signing documents or deleting anything it shows the planned action and waits for approval, and a classifier blocks sharing details such as credit card numbers. Anthropic acknowledges it can still misjudge what is urgent, and background checks count toward usage limits. For work like this radar it shows where proactive agents are heading, but there is no date yet for availability outside the US.", "speech_he": "החברה Anthropic השיקה את Claude Duet, סוכן יזום שעובד ברקע. המוצר הוא תצוגה מקדימה למנויי Pro ו-Max בארצות הברית בלבד, דרך רשימת המתנה. הסוכן שולח תדריך בוקר ובודק כל כמה שעות מה דורש תשומת לב. אפשר לתת לו משימות בטקסט או בקול. הוא רץ על מחשב וירטואלי משלו, כך שהמכשיר של המשתמש לא חייב להישאר דלוק. הוא משתמש בזיכרון, בכלים ובחיבורים של החשבון. לפני שליחת הודעה, תשלום או מחיקה, הוא מבקש אישור. החברה מודה שהוא עדיין עלול לטעות בהערכת מה דחוף. אין עדיין תאריך לזמינות מחוץ לארצות הברית.", "speech_en": "Anthropic launched Claude Duet, a proactive agent that works in the background. It is a research preview for Pro and Max subscribers in the United States only, through a waitlist. The agent sends a morning brief and checks every few hours for what needs attention. You can give it tasks by text or by voice. It runs on its own virtual computer, so the user's device does not have to stay on. It uses the account's memory, skills and connectors. Before sending a message, making a payment or deleting anything, it asks for approval. Anthropic admits it can still misjudge what is urgent. There is no date yet for availability outside the United States.", "url": "https://iphoneincanada.ca/2026/10/21/claude-duet-proactive-ai-agent-app", "sourceName": "iPhone in Canada", "relevance": 3, "discovery": false, "isUpdate": false, "people": [], "published": "2026-10-21", "readTime": "3 דק׳"}, {"id": "2026-10-24-eureka3d-xr-toolbox", "date": "2026-10-24", "kind": "news", "topicId": "heritage", "title": "EUreka3D-XR: ארגז כלים אירופי חינמי וקוד פתוח לבניית סיורי AR מבוססי מיקום באתרי מורשת", "summary": "פרויקט EUreka3D-XR במימון האיחוד האירופי פרסם חמישה כלים פתוחים למוסדות מורשת: בונה סיורי AR על מפה, אפליקציית סיור מבוססת GPS, יצירת מודל תלת-ממדי מתמונות, סטודיו XR בלי קוד ובונה אווטארים מספרים. זהו מסלול מוכן לבדיקת פיילוט הנגשה בשטח בלי פיתוח מאפס.", "title_en": "EUreka3D-XR: a free, open-source European toolbox for building location-based AR tours at heritage sites", "summary_en": "The EU-funded EUreka3D-XR project has published five open tools for heritage institutions: a map-based AR tour builder, a GPS tour app, AI 3D reconstruction from photos, a no-code XR studio and a narrator avatar builder. It offers a ready path to test an on-site accessibility pilot without building from scratch.", "details": "ארגז הכלים EUreka3D-XR פורסם במאי 2026 ונבנה במסגרת פרויקט במימון תוכנית Digital Europe. הכלי AR Tour Builder הוא אפליקציית רשת שבה אוצרים מציבים נקודות עניין על מפה ומצמידים אליהן מודלים תלת-ממדיים, תמונות, שמע, וידאו וטקסט, בכמה שפות. האפליקציה AR Tour Experience מזהה לפי GPS שהמבקר קרוב לנקודה ומציגה את המודל במציאות רבודה, וניתן להוריד את הסיור מראש לאזורים בלי קליטה. לצידם יש כלי AI 3D Builder שבונה מודל GLB מסדרת תמונות, סטודיו 3D XR Studio לבניית חוויות בלי תכנות שמופעלות בסריקת QR, וכלי Avatar Builder לדמות מספרת. לפי האתר הכלים פתוחים וחינמיים וקוד המקור נמצא ב-GitHub, אבל רישיון התוכנה לא מצוין בעמוד. מגבלות חשובות: אפליקציית הסיור עובדת כרגע רק ב-Android עם מכשיר שתומך ב-AR, הכניסה דורשת הזדהות EGI Check-in, ואין התחייבות לרמת שירות. לא מתוארות התאמות נגישות ייעודיות, ולכן יש לבדוק קריינות, ניגודיות ותמיכה בעברית לפני פיילוט.", "details_en": "The EUreka3D-XR toolbox was published in May 2026 by a project funded under the Digital Europe Programme. AR Tour Builder is a web app where curators place points of interest on a map and attach 3D models, images, audio, video and text, in several languages. The AR Tour Experience app uses GPS to detect that a visitor is near a point and shows the model in augmented reality, and tours can be downloaded in advance for areas without coverage. Alongside them are AI 3D Builder, which creates a GLB model from a set of photos, 3D XR Studio for building no-code experiences launched by scanning a QR code, and Avatar Builder for a narrator character. According to the site the tools are open and free and the source code is on GitHub, but the software licence is not stated on the page. Important limits: the tour app currently runs only on Android with an AR-capable device, sign-in requires EGI Check-in, and there is no service-level commitment. No dedicated accessibility features are described, so narration, contrast and Hebrew support should be checked before a pilot.", "speech_he": "ארגז הכלים EUreka3D-XR מאפשר לבנות סיורי מציאות רבודה באתרי מורשת, בחינם. הכלים פורסמו במאי 2026 במסגרת פרויקט במימון האיחוד האירופי. בכלי AR Tour Builder האוצר מציב נקודות עניין על מפה. לכל נקודה אפשר לצרף מודל תלת ממדי, תמונות, שמע, וידאו וטקסט, בכמה שפות. האפליקציה AR Tour Experience מזהה לפי מיקום שהמבקר קרוב לנקודה. אז היא מציגה את המודל במציאות רבודה. אפשר להוריד את הסיור מראש, לאזורים בלי קליטה. יש גם כלי שבונה מודל תלת ממדי מתמונות, סטודיו לחוויות בלי תכנות, ובונה דמויות מספרות. לפי האתר הכלים פתוחים וחינמיים, והקוד נמצא באתר GitHub. אפליקציית הסיור עובדת כרגע רק במכשירי Android. לא מתוארות התאמות נגישות ייעודיות. לכן כדאי לבדוק קריינות ותמיכה בעברית לפני פִּיילוֹט.", "speech_en": "EUreka3D-XR is a free toolbox for building augmented reality tours at heritage sites. The tools were published in May 2026 by an EU-funded project. In AR Tour Builder, curators place points of interest on a map. Each point can hold 3D models, images, audio, video and text, in several languages. The AR Tour Experience app uses location to detect that a visitor is near a point. It then shows the model in augmented reality. Tours can be downloaded in advance for areas without coverage. There is also a tool that builds 3D models from photos, a no-code XR studio, and a narrator avatar builder. According to the site, the tools are open and free, and the code is on GitHub. The tour app currently runs only on Android. No dedicated accessibility features are described, so narration and Hebrew support should be tested before a pilot.", "url": "https://www.dataspace-culturalheritage.eu/en/news/use-the-eureka3d-xr-toolbox-to-transform-2d-and-3d-digital-collections-into-xr-storytelling", "sourceName": "Common European Data Space for Cultural Heritage", "relevance": 5, "heritage": true, "discovery": true, "isUpdate": false, "people": [], "published": "2026-05-05", "readTime": "5 דק׳"}, {"id": "2026-10-24-fano-hbim-ar", "date": "2026-10-24", "kind": "news", "topicId": "heritage", "title": "חומות פאנו: HBIM פתוח ב-Blender Bonsai עם אפליקציית AR שמעדכנת את המודל מהשטח", "summary": "צוות מאוניברסיטת Marche ומ-Sapienza בנה תהליך Scan-to-HBIM-to-XR לחומות פאנו: 119 סריקות לייזר ו-4,200 תמונות רחפן, מודל HBIM בכלי הפתוח Bonsai, ואפליקציית AR שבה מסמנים בלייה על הקיר והנתון חוזר למודל כ-IFC. דוגמה מעשית לחיבור תיעוד, ניהול שימור ועבודת שטח.", "title_en": "Fano's city walls: open HBIM in Blender Bonsai with an AR app that updates the model from the field", "summary_en": "A team from Marche Polytechnic and Sapienza built a Scan-to-HBIM-to-XR workflow for the walls of Fano: 119 laser scans and 4,200 drone images, an HBIM model in the open-source Bonsai, and an AR app where decay is marked on the wall and flows back into the model as IFC. A practical link between documentation, conservation management and fieldwork.", "details": "המאמר של Paolo Clini ועמיתיו הוצג בסדנת 3D-ARCH בפברואר 2026 באנקונה ופורסם ב-ISPRS Archives, ולכן הוא מסומן כתגלית. האזור הנבדק הוא שער Porta della Mandria והחומות והמגדלים הסמוכים בפאנו. הסקר כלל 119 סריקות לייזר ב-Leica P40 ו-RTC360 ויותר מ-4,200 תמונות מרחפן DJI Mavic 3T, עם נקודות בקרה ב-GNSS-RTK. מודל ה-HBIM נבנה ב-Blender עם התוסף הפתוח Bonsai, וכל קטע קיר נושא שלב בנייה, סוג בנייה, סטרטיגרפיה, בלייה ומדד איכות בנייה. אפליקציית Android מזהה את הקיר בעזרת Area Target שנבנה מענן הנקודות, מציגה שחזורים קודמים ומפות בלייה צבעוניות, ומאפשרת לסמן אזור בלייה ולהקליט את סוגו בקול. העדכונים חוזרים למודל דרך Google Sheets ו-Web App כאלמנטים של IFC. המאמר אינו מדווח על בדיקת דיוק או שמישות, אבל זה מתכון פתוח יחסית שאפשר לשחזר עם כלים זמינים.", "details_en": "The paper by Paolo Clini and colleagues was presented at the 3D-ARCH workshop in Ancona in February 2026 and published in the ISPRS Archives, so it is flagged as a discovery. The pilot area is the Porta della Mandria gate with its adjacent towers and walls in Fano. The survey included 119 laser scans with a Leica P40 and RTC360 and more than 4,200 images from a DJI Mavic 3T drone, with GNSS-RTK control points. The HBIM model was built in Blender with the open-source Bonsai add-on, and each wall portion carries construction phase, masonry type, stratigraphy, decay and a masonry quality index. An Android app recognizes the wall using an Area Target built from the point cloud, shows past restorations and color-coded decay maps, and lets users mark a decay area and record its type by voice. Updates flow back to the model through Google Sheets and a web app as IFC elements. The paper reports no accuracy or usability testing, but it is a fairly open recipe that can be reproduced with available tools.", "speech_he": "חומות פאנו באיטליה. מודל HBIM פתוח, עם אפליקציית מציאות רבודה שמעדכנת אותו מהשטח. צוות מאוניברסיטאות באנקונה וברומא תיעד את חומות העיר פאנו. הם ביצעו מאה תשעה עשר סריקות בסורק לייזר. הם צילמו יותר מארבעת אלפים תמונות בְּרַחְפָן. המודל נבנה בתוכנה Blender עם התוסף הפתוח Bonsai. כל קטע קיר שומר נתונים על שלב הבנייה, סוג הבנייה והבלייה. אפליקציה בטלפון מזהה את הקיר ומציגה עליו מפות בלייה צבעוניות. העובד בשטח מסמן אזור בלייה, ומקליט בקול את סוגו. הנתון חוזר אוטומטית למודל. המאמר פורסם בפברואר, ולא כולל בדיקת דיוק. אבל זה מתכון פתוח שאפשר לשחזר עם כלים זמינים.", "speech_en": "Fano's city walls in Italy. An open HBIM model, with an augmented reality app that updates it from the field. A team from universities in Ancona and Rome documented the walls of Fano. They made 119 laser scans. They took more than 4,200 drone images. The model was built in Blender with the open source Bonsai add-on. Each wall section stores construction phase, masonry type and decay. A phone app recognizes the wall and shows color-coded decay maps on it. A field worker marks a decay area and records its type by voice. The data flows back to the model automatically. The paper was published in February and has no accuracy testing. But it is an open recipe that can be reproduced with available tools.", "url": "https://isprs-archives.copernicus.org/articles/XLVIII-2-W12-2026/97/2026/isprs-archives-XLVIII-2-W12-2026-97-2026.pdf", "sourceName": "ISPRS Archives", "relevance": 5, "heritage": true, "discovery": true, "isUpdate": false, "people": ["Paolo Clini"], "published": "2026-02-10"}, {"id": "2026-10-24-framestore-superman-4dgs", "date": "2026-10-24", "kind": "news", "topicId": "splats", "title": "Framestore חושפת את צנרת ה-4D splats של Superman: 192 מצלמות, 1.6 מיליון splats לפריים ו-5TB לטייק", "summary": "בהרצאה שעלתה ליוטיוב פירט מפקח ה-CG של Framestore איך צולמו ההולוגרמות בסרט Superman כ-splats דינמיים ואילו פתרונות עוקפים נדרשו כשהכלים עוד לא תמכו בהם. זהו מקרה בוחן מפורט לעלות ולמורכבות של לכידה נפחית של אנשים, למשל לדמות מספרת באתר.", "title_en": "Framestore details its Superman 4D splat pipeline: 192 cameras, 1.6 million splats per frame and 5 TB per take", "summary_en": "In a talk now on YouTube, Framestore's CG supervisor explained how the Superman holograms were captured as dynamic splats and which workarounds were needed when tools did not yet support them. It is a detailed case study of the cost and complexity of volumetric human capture, for example for a narrator at a site.", "details": "Kevin Sears, מפקח CG ב-Framestore Montreal, העביר וובינר של 54 דקות ב-22 בספטמבר, והחברה העלתה אותו ליוטיוב ב-21 באוקטובר. ההולוגרמות של הורי Superman צולמו באוגוסט 2024 באיפסוויץ' שבאנגליה על ידי Infinite Realities, ושימשו בכ-30 שוטים. מערך הצילום כלל 192 מצלמות של 12 מגה-פיקסל ב-24 פריימים לשנייה, בחלל בגודל חדר שינה קטן, וטייק אחד של כ-88 שניות הניב יותר מ-400,000 תמונות ובערך 5TB. כל פריים אומן בנפרד בתוכנה Postshot על 20 מחשבים עם כרטיסי RTX 4090 במשך כמה ימים, והתוצאה הייתה כ-1.6 מיליון splats לפריים. בזמן העבודה Houdini ו-Nuke עוד לא טענו splats, ולכן נבנו פתרונות עוקפים כמו מצלמה נפרדת לכל אשכול splats, והרינדור נעשה בצופה SIBR של Inria. רעידות בקצוות טופלו בהסרת רעש בזמן בשלב הקומפוזיטינג. לדברי Sears, היום הכלים כבר טוענים splats ולא בטוח שהיה חוזר על אותה שיטה. עבור מורשת, הנתונים ממחישים כמה כבדה עדיין לכידה נפחית איכותית של אדם.", "details_en": "Kevin Sears, CG supervisor at Framestore Montreal, gave a 54-minute webinar on September 22, and the studio posted it to YouTube on October 21. The holograms of Superman's parents were captured in August 2024 in Ipswich, England by Infinite Realities and used in about 30 shots. The rig had 192 cameras at 12 megapixels and 24 frames per second in a space the size of a small bedroom, and one take of about 88 seconds produced more than 400,000 images and roughly 5 TB. Each frame was trained separately in Postshot on 20 machines with RTX 4090 GPUs over several days, yielding about 1.6 million splats per frame. At the time Houdini and Nuke could not load splats, so workarounds were built, such as one camera per splat cluster, and rendering used Inria's SIBR viewer. Edge flicker was reduced with temporal denoising in compositing. Sears said tools now load splats natively and he would not necessarily reuse the same method. For heritage, the numbers show how heavy high-quality volumetric capture of a person still is.", "speech_he": "האולפן Framestore פירט איך נוצרו ההולוגרמות בסרט Superman בעזרת Gaussian Splatting דינמי. ההרצאה של Kevin Sears עלתה ליוטיוב ב-21 באוקטובר. הצילום נעשה עם 192 מצלמות, בחלל בגודל חדר שינה קטן. טייק אחד של כדקה וחצי הניב יותר מ-400,000 תמונות, וכחמישה טרה בייט של נתונים. כל פריים אומן בנפרד בתוכנה Postshot, על עשרים מחשבים, במשך כמה ימים. כל פריים כלל כמיליון ושש מאות אלף splats. באותה תקופה הכלים עוד לא תמכו בטכנולוגיה, ולכן נבנו פתרונות עוקפים. לדבריו, היום הכלים כבר תומכים בה. הנתונים ממחישים כמה כבדה עדיין לכידה נפחית של אדם, למשל לדמות מספרת באתר מורשת.", "speech_en": "Framestore explained how the holograms in Superman were made with dynamic Gaussian splats. Kevin Sears' talk was posted to YouTube on October 21. The capture used 192 cameras, in a space the size of a small bedroom. One take of about a minute and a half produced more than 400,000 images and about five terabytes of data. Each frame was trained separately in Postshot, on twenty computers, over several days. Each frame held about one point six million splats. At the time, the tools did not support the technology, so workarounds were built. He says today's tools now support it. The numbers show how heavy volumetric capture of a person still is, for example for a narrator at a heritage site.", "url": "https://radiancefields.com/framestore-details-its-superman-4d-splatting-pipeline", "sourceName": "Radiance Fields", "relevance": 3, "discovery": false, "isUpdate": false, "people": ["Michael Rubloff", "Kevin Sears"], "published": "2026-10-23", "readTime": "3 דק׳"}, {"id": "2026-10-24-geosplats-sdk-annotations", "date": "2026-10-24", "kind": "news", "topicId": "webxr", "title": "GeoSplats SDK 1.2 של MapTiler: תוויות לחיצות על מודלי splats ממוקמים על מפה תלת-ממדית בדפדפן", "summary": "ספריית JavaScript שמציגה splats ממוקמים גיאוגרפית מעל מפת MapTiler ותבליט קיבלה תוויות לחיצות עם חלוני HTML, שאפשר לעגן למודל או לקואורדינטות. זהו רכיב שימושי לפלטפורמת הנגשה שמשלבת סריקות אתרים עם מפה ומידע הסברי.", "title_en": "MapTiler GeoSplats SDK 1.2: clickable annotations on georeferenced splat models over a 3D web map", "summary_en": "A JavaScript library that shows georeferenced splats over MapTiler maps and terrain now supports clickable annotations with HTML popups, anchored to the model or to coordinates. It is a useful building block for an access platform that combines site scans with a map and interpretive content.", "details": "MapTiler הוסיפה בגרסה 1.2.0 של GeoSplats SDK, חבילת npm בשם maptiler/geosplats, את הפונקציה addAnnotation שמוסיפה למודל splat תוויות לחיצות. לכל תווית אפשר להגדיר אייקון, צבע, חלון HTML ונתונים מצורפים, ולבחור אם היא נעה עם המודל או נשארת קבועה בקואורדינטות על המפה. התוויות יכולות לשבת על המודל עצמו או על פני הקרקע, עם היסט גובה, אבל עיגון על המודל דורש רשת התנגשות. יש אירועי לחיצה והפעלה, ואפשר לשנות או למחוק תוויות בקוד. הגרסה הקודמת, 1.1, הוסיפה מיזוג של המודל עם תבליט השטח, אבל MapTiler לא מתעדת מה הפרמטרים שלו עושים. נדרש מפתח API של MapTiler, שחינמי עד 100,000 טעינות מפה בחודש, והשימוש מותר רק עם שירותי MapTiler. אין יומן שינויים רשמי והמוצר עדיין מוגדר כבטא. עבור אתר מורשת זו דרך מהירה להציג סריקת splats במיקום האמיתי שלה ולהצמיד לה נקודות הסבר, בלי לבנות מנוע תלת-ממד מאפס, אבל עם תלות בספק אחד.", "details_en": "MapTiler added the addAnnotation function to GeoSplats SDK 1.2.0, the npm package maptiler/geosplats, which places clickable labels on a splat model. Each label can have an icon, colour, HTML popup and attached data, and can either move with the model or stay fixed at map coordinates. Labels can rest on the model itself or on the terrain, with a height offset, but anchoring to the model requires a collision mesh. Click and activation events are available, and labels can be changed or removed in code. The previous version, 1.1, added blending of the model with terrain, but MapTiler does not document what its parameters do. A MapTiler API key is required, free up to 100,000 map loads per month, and use is allowed only with MapTiler services. There is no official changelog and the product is still labelled beta. For a heritage site it is a quick way to show a splat scan in its real location and pin interpretive points to it without building a 3D engine from scratch, at the cost of depending on one vendor.", "speech_he": "החברה MapTiler הוסיפה תוויות לחיצות לספרייה GeoSplats SDK, בגרסה 1.2. הספרייה מציגה מודלי Gaussian Splatting במיקום האמיתי שלהם, מעל מפה תלת ממדית בדפדפן. עכשיו אפשר להצמיד למודל תוויות עם אייקון, צבע וחלון מידע. התווית יכולה לנוע עם המודל, או להישאר קבועה בנקודה על המפה. כדי להצמיד תווית למודל עצמו צריך רֶשֶׁת התנגשות. השימוש חינמי עד מאה אלף טעינות מפה בחודש. השימוש מותר רק עם השירותים של MapTiler, והמוצר עדיין בגרסת בטא. אין יומן שינויים רשמי. עבור אתר מורשת, זו דרך מהירה להציג סריקה במקומה ולהוסיף לה נקודות הסבר.", "speech_en": "MapTiler added clickable labels to its GeoSplats SDK, in version 1.2. The library shows Gaussian splat models in their real location, over a 3D map in the browser. Now you can pin labels to a model, with an icon, a colour and an information window. A label can move with the model, or stay fixed at a point on the map. Pinning a label to the model itself requires a collision mesh. Use is free up to one hundred thousand map loads per month. It may be used only with MapTiler services, and the product is still in beta. There is no official changelog. For a heritage site, it is a quick way to show a scan in place and add interpretive points.", "url": "https://radiancefields.com/geosplats-sdk-1.2.0-pins-annotations-to-splat-models", "sourceName": "Radiance Fields", "relevance": 4, "discovery": false, "isUpdate": false, "people": ["Michael Rubloff"], "published": "2026-10-23", "readTime": "2 דק׳"}, {"id": "2026-10-24-insta360-project-eternal", "date": "2026-10-24", "kind": "news", "topicId": "splats", "title": "Project ETERNAL: מצילום 360 למודלי splats של פומפיי, בורובודור וצ׳יצ׳ן איצה, עם CyArk", "summary": "Insta360, Antigravity ו-CyArk בחנו אם מצלמת 360 כף-יד או רחפן 360 מספיקים כדי ליצור מודל Gaussian Splatting של אתר מורשת. יותר מ-2,000 משתתפים הגישו 225 מודלים, והמסקנה המרכזית הייתה שטכניקת הצילום חשובה יותר ממחיר הציוד.", "title_en": "Project ETERNAL: from 360 footage to splat models of Pompeii, Borobudur and Chichen Itza, with CyArk", "summary_en": "Insta360, Antigravity and CyArk tested whether a handheld 360 camera or a 360 drone is enough to create a Gaussian Splatting model of a heritage site. More than 2,000 participants submitted 225 models, and the main finding was that capture technique matters more than equipment cost.", "details": "הקמפיין רץ בין אפריל ליולי 2026 בשיתוף Antigravity, Insta360, CyArk והפלטפורמה Splatica. CyArk הפיקה מודלי ייחוס של פומפיי ושל Civita di Bagnoregio, והם עלו לאתרים של השותפים ב-23 באפריל. הצילום נעשה במצלמת Insta360 X5 ברזולוציה של 8K מהקרקע וברחפן Antigravity A1 עם צילום 360 מהאוויר, והעיבוד בענן של Splatica. בתחרות הפתוחה השתתפו יותר מ-2,000 יוצרים מיותר מ-20 מדינות, עם יותר מ-225 הגשות, ביניהן בורובודור, צ׳יצ׳ן איצה, מקדש בקיוטו וכפר מסורתי בסין, והפרס הראשון ניתן לטירת De Haar בהולנד. חלק מהסצנות צולמו בחמש עד עשר דקות בלבד. המודלים נפתחים בדפדפן בכל מכשיר, בלי אפליקציה ובלי משקפי VR. זה סיכום שיווקי של יצרן ואין בו מדידות דיוק, אבל הוא מראה שצילום 360 הופך לדרך מהירה וזולה להפיק מודל פנים וחוץ להנגשה.", "details_en": "The campaign ran from April to July 2026 with Antigravity, Insta360, CyArk and the Splatica platform. CyArk produced reference models of Pompeii and Civita di Bagnoregio, which went live on the partners' sites on April 23. Capture used an Insta360 X5 at 8K from the ground and an Antigravity A1 drone with 360 capture from the air, with processing in Splatica's cloud. The open challenge drew more than 2,000 creators from over 20 countries and more than 225 submissions, including Borobudur, Chichen Itza, a temple in Kyoto and a traditional village in China, and first prize went to De Haar Castle in the Netherlands. Some scenes were captured in only five to ten minutes. The models open in a browser on any device, with no app or VR headset. It is a vendor wrap-up without accuracy measurements, but it shows 360 capture becoming a fast, cheap way to produce interior and exterior models for public access.", "speech_he": "הפרויקט ETERNAL. מצילום שלוש מאות שישים למודלים תלת ממדיים של אתרי מורשת. החברות Insta360 ו-Antigravity עבדו יחד עם הארגון CyArk. הן בדקו אם מצלמת שלוש מאות שישים או רַחְפָן מספיקים כדי ליצור מודל Gaussian Splatting של אתר מורשת. הארגון CyArk הפיק מודלים של פומפיי ושל כפר היסטורי באיטליה. יותר מאלפיים משתתפים הגישו יותר ממאתיים עשרים וחמישה מודלים. בין האתרים היו בורובודור, צ׳יצ׳ן איצה ומקדש בקיוטו. חלק מהסצנות צולמו בחמש עד עשר דקות בלבד. המודלים נפתחים בדפדפן, בלי אפליקציה ובלי מִשְׁקְפֵי מציאות מדומה. המסקנה המרכזית הייתה שטכניקת הצילום חשובה יותר ממחיר הציוד. זה סיכום של יצרן, ואין בו מדידות דיוק.", "speech_en": "Project ETERNAL. From 360 footage to 3D models of heritage sites. Insta360 and Antigravity worked together with CyArk. They tested whether a 360 camera or drone is enough to create a Gaussian Splatting model of a heritage site. CyArk produced models of Pompeii and of a historic village in Italy. More than 2,000 participants submitted more than 225 models. The sites included Borobudur, Chichen Itza and a temple in Kyoto. Some scenes were captured in only five to ten minutes. The models open in a browser, with no app and no VR headset. The main finding was that capture technique matters more than equipment cost. This is a vendor summary, with no accuracy measurements.", "url": "https://www.insta360.com/blog/enterprise/project-eternal-3dgs-wrap-up.html", "sourceName": "Insta360 Blog", "relevance": 4, "heritage": true, "discovery": true, "isUpdate": false, "people": [], "published": "2026-08-06", "readTime": "9 דק׳"}, {"id": "2026-10-24-nabataean-hbim-hegra-petra", "date": "2026-10-24", "kind": "news", "topicId": "research", "title": "מסגרת HBIM לקברים הנבטיים בחגרא ובפטרה: 403 מיליון נקודות וספריית מוטיבים מעוטרים", "summary": "חוקרים מירדן ומסעודיה פרסמו ב-16.10 תהליך עבודה שמחבר סריקות לייזר, פוטוגרמטריה ונתוני מצב, היסטוריה וגיאולוגיה למודל HBIM אחד של קברים נבטיים בחגרא ושל א-דיר בפטרה. רלוונטי ישירות לארכיטקטורה נבטית בנגב ולשאלה איך מנהלים אתר חצוב בסלע במודל אחד.", "title_en": "An HBIM framework for Nabataean tombs at Hegra and Petra: 403 million points and a library of decorative motifs", "summary_en": "Researchers from Jordan and Saudi Arabia published on October 16 a workflow that combines laser scans, photogrammetry and condition, historical and geological data in a single HBIM model of Nabataean tombs at Hegra and of Al-Deir at Petra. Directly relevant to Nabataean architecture in the Negev and to managing a rock-cut site in one model.", "details": "המאמר של Yahya Alshawabkeh ו-Ahmad Baik פורסם בכתב העת Sustainability ועוסק בשני קברים בנקרופוליס של חגרא שבסעודיה ובמבנה א-דיר בפטרה. קבר IGN 110 נסרק ב-29 עמדות, כולל ארבע פנימיות, עם יותר מ-403 מיליון נקודות ורזולוציה ממוצעת של 6 מילימטר, וקבר IGN 22 בשבע עמדות עם כ-77 מיליון נקודות. הסריקות נרשמו ב-ReCap Pro, תמונות עובדו ב-Metashape, והשילוב בין המקורות נעשה ב-CloudCompare עם שארית רישום של 0.18 מילימטר לקבר אחד. המודל נבנה ב-Revit כמודל מרכזי עם worksets נושאיים שמקשרים נתוני מצב, היסטוריה וגיאולוגיה לכל אלמנט. העיטורים, כמו נשר, ספינקס, נחש ומדוזה, נשמרו כספריית משפחות מבוססות רשת תלת-ממדית לצד אלמנטים פרמטריים. המחברים מציינים מגבלות: המוטיבים אינם ניתנים לעריכה, יש תלות בתוכנה קניינית, לא נבדקו IFC ו-CIDOC CRM, והנתונים עצמם אינם פתוחים. זה מקרה בוחן קרוב מאוד לאתרים נבטיים בישראל כמו עבדת, ממשית ושבטה, ומראה גם מה עוד חסר כדי להגיע למודל פתוח ובר-שיתוף.", "details_en": "Th
